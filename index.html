<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deviens">
<title>Deviens qui tu es</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.auth{position:fixed;inset:0;z-index:80;background:var(--bg,#000);color:var(--fg,#fff);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.auth-box{width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.auth-box .brand{padding:0;font-size:26px;margin-bottom:4px}
.auth-err{color:var(--neg,#ff4d43);font-size:14px;min-height:20px}
</style>
</head>
<body>

<div id="auth" class="auth" hidden>
  <form id="auth-form" class="auth-box" novalidate>
    <div class="brand">Deviens qui tu es</div>
    <p class="note" id="auth-msg">Connecte-toi pour retrouver ton espace sur tous tes appareils.</p>
    <div id="auth-fields" style="display:flex;flex-direction:column;gap:14px">
      <label class="field"><span>E-mail</span><input id="auth-email" type="email" autocomplete="username" required></label>
      <label class="field"><span>Mot de passe</span><input id="auth-pass" type="password" autocomplete="current-password" minlength="6" required></label>
      <button class="btn" type="submit">Se connecter</button>
      <button class="btn-sec" type="button" id="auth-create">Créer mon compte</button>
      <button class="link" type="button" id="auth-reset" style="align-self:flex-start">Mot de passe oublié</button>
    </div>
    <p class="auth-err" id="auth-err" role="alert"></p>
  </form>
</div>
<script>window.DQ_BACKEND={};window.DQ_BACKEND.ready=new Promise(r=>{window.DQ_BACKEND._resolve=r});</script>
<script src="firebase-config.js"></script>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){const cfg=window.FIREBASE_CONFIG||{};const box=document.getElementById('auth');const msg=document.getElementById('auth-msg');const fields=document.getElementById('auth-fields');
  if(!cfg.apiKey){box.hidden=false;fields.hidden=true;msg.textContent='Configuration Firebase manquante : remplis le fichier firebase-config.js.';return}
  setTimeout(()=>{if(!window.DQ_BACKEND.loaded){box.hidden=false;fields.hidden=true;msg.textContent='Impossible de joindre Firebase pour l’instant. Vérifie ta connexion internet, puis recharge la page.'}},12000)})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap">
<style>
/* Direction visuelle sombre (book v1, U08-U10) : fond charbon, surfaces légèrement différenciées,
   accent indigo pour les actions et la sélection. Le vert, l'orange et le rouge ne portent que des statuts.
   Le thème reste sombre quel que soit le réglage du système (D13). */
:root{
  --bg:#111318; --surface:#1B1E27; --surface-2:#242837; --surface-3:#30354A; --line:#2A2F3D;
  --fg:#F3F4F8; --muted:#B7BDCC; --faint:#7F879A;
  --pos:#4DD49B; --neg:#FF707C; --warn:#FFB454;
  --accent:#8B83FF; --accent-ink:#111318;
  --ph-angle:#8E9AAF; --ph-recherche:#4C7DFF; --ph-ecriture:#9B6BFF; --ph-packaging:#E8B10E; --ph-voix:#19B9A8; --ph-montage:#FF7A45;
  --f:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --ft:"Quicksand","Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)} .faint{color:var(--faint)} .sm{font-size:13px}
.up{color:var(--pos)} .down{color:var(--neg)}
.eyebrow{font-size:14px;color:var(--muted);font-weight:500}
.cap::first-letter{text-transform:uppercase}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:32px;padding:32px 16px 24px calc(20px + env(safe-area-inset-left,0px))}
.brand{font-size:18px;font-weight:700;letter-spacing:-.02em;padding:0 12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:999px;color:var(--muted);font-weight:600;text-align:left}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--surface-2)}
.nav svg{width:20px;height:20px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.store-state{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:0 12px}
.store-state i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.store-state.cloud i{background:var(--pos)}
main{min-width:0;width:100%;max-width:1080px;padding-block:36px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:820px){main{padding-left:32px;padding-right:max(48px,env(safe-area-inset-right,0px))}}
.mtop,.tabbar{display:none}
@media (max-width:819px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;justify-content:space-between;background:var(--bg);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .mtop .brand{padding:0;font-size:17px}
  main{padding-block:12px 120px}
  .tabbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;min-width:0;color:var(--faint);font-weight:600}
  .tabbar button[aria-current="page"]{color:var(--fg)}
  .tabbar svg{width:23px;height:23px}
}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--fg)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:21px;height:21px}

/* Page head & hero */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.h1{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.hero{display:flex;flex-direction:column;gap:6px;margin-top:20px}
.hero-v{font-size:clamp(44px,8vw,60px);font-weight:600;letter-spacing:-.045em;line-height:1}
.hero-v small{font-size:.5em;color:var(--muted);letter-spacing:-.02em;font-weight:500}
.hero-d{font-size:15px;font-weight:500;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;min-height:22px}
.chart{position:relative;height:190px;margin:22px 0 14px;user-select:none}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.l-act{fill:none;stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.l-act.up{stroke:var(--pos)} .l-act.down{stroke:var(--neg)}
.l-exp{fill:none;stroke:var(--faint);stroke-width:1.4;stroke-dasharray:2 5;vector-effect:non-scaling-stroke;stroke-linecap:round}
.c-dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:currentColor;pointer-events:none}
.c-dot.up{color:var(--pos)} .c-dot.down{color:var(--neg)}
@media (prefers-reduced-motion:no-preference){.c-dot.live::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:currentColor;opacity:.25;animation:pulse 2s ease-out infinite}@keyframes pulse{from{transform:scale(.5);opacity:.45}to{transform:scale(1.6);opacity:0}}}
.c-scrub{position:absolute;top:-6px;bottom:-6px;width:1px;margin-left:-.5px;background:var(--muted);pointer-events:none}
.c-hit{position:absolute;inset:-6px 0;cursor:crosshair;touch-action:pan-y}
.c-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:14px;text-align:center}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills button{height:34px;padding:0 15px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px}
.pills button:hover{color:var(--fg)}
.pills button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.qnav{display:inline-flex;align-items:center;gap:2px}
.qnav b{min-width:84px;text-align:center;font-weight:600}
.qnav button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.qnav button:hover{background:var(--surface-2)}

/* Sections & lists */
.sec{margin-top:44px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.sec-h h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.sec-h .act{color:var(--muted);font-weight:600;font-size:14px}
.sec-h .act:hover{color:var(--fg)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 56px}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 0;width:100%;text-align:left}
.row-l{display:flex;align-items:center;gap:14px;min-width:0;text-align:left}
.row .m{display:flex;flex-direction:column;min-width:0;gap:1px}
.row .t{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:1px;white-space:nowrap}
.row .r b{font-size:16px;font-weight:500}
.row .r span{font-size:13px;font-weight:500}
button.row:hover .t,.row-l:hover .t{text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.av{--c:#8E9AAF;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;line-height:1;background:color-mix(in srgb,var(--c) 22%,var(--surface-2));color:var(--fg);font-weight:600;flex:none}
.av.sm{width:36px;height:36px;font-size:17px}
.av.lg{width:64px;height:64px;font-size:30px}
.av.txt{font-size:16px}
.empty{color:var(--muted);font-size:15px;line-height:1.55;padding:10px 0}
.empty-state{padding:40px 0;display:flex;flex-direction:column;align-items:flex-start;gap:14px;max-width:560px}
.empty-state h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.note{font-size:15px;color:var(--muted);line-height:1.6;max-width:66ch}

/* Buttons & tags */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.btn-sec{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;background:var(--surface-2);color:var(--fg);font-weight:600;font-size:14px;white-space:nowrap}
.btn-sec:hover{background:var(--surface-3)}
.btn-danger{color:var(--neg)}
.link{color:var(--fg);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.add{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:15px;font-weight:600;padding:10px 0}
.add:hover{color:var(--fg)}
.add i{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--fg)}
.add svg{width:16px;height:16px}
.tag{font-size:13px;font-weight:600;white-space:nowrap}
.tag.pos{color:var(--pos)} .tag.neg{color:var(--neg)} .tag.warn{color:var(--warn)} .tag.mut{color:var(--muted)}
.bar{position:relative;height:4px;border-radius:999px;background:var(--surface-2);min-width:0}
.bar > i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--fg)}
.bar > b{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--muted);border-radius:2px}

/* Stats row */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:22px}
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .l{font-size:13px;color:var(--muted);font-weight:500}
.stat .v{font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.15}
.stat .v small{font-size:16px;color:var(--muted);font-weight:500}
.stat .s{font-size:13px;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:nth-child(3){grid-column:1/-1}}

/* Swipe rows (habits) */
.swipe{position:relative;overflow:hidden;border-radius:16px;margin:2px 0}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-start;padding:0 22px;font-weight:600;font-size:15px;color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,var(--bg))}
.swipe[data-dir="l"] .swipe-bg{justify-content:flex-end;color:var(--muted);background:var(--surface-2)}
.swipe.go .swipe-bg{background:var(--pos);color:#000}
.swipe.back .swipe-bg{background:var(--neg);color:#fff}
.swipe-fg{position:relative;background:var(--surface);touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.8,.2,1);padding:0 4px;cursor:grab}
.hcheck{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface-3);display:grid;place-items:center;color:transparent;flex:none}
.hcheck svg{width:16px;height:16px}
.hcheck.on{background:var(--pos);border-color:var(--pos);color:#000}
.swipe.done .t{color:var(--muted)}
.hint{font-size:13px;color:var(--faint)}

/* Todo */
.todo-add{display:flex;gap:8px;margin:6px 0 4px}
.todo-add input{flex:1;min-width:0;height:46px;padding:0 18px;border-radius:999px;border:0;background:var(--surface-2)}
.todo li{display:flex;align-items:center;gap:14px;padding:11px 0}
.todo li span{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px}
.todo li.done span{color:var(--faint);text-decoration:line-through}
.x{color:var(--faint);width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.x:hover{color:var(--neg);background:var(--surface-2)}
.x svg{width:14px;height:14px}

/* OKR */
.id-sec{margin-top:52px;scroll-margin-top:24px}
.id-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.id-head h2{font-size:24px;font-weight:700;letter-spacing:-.025em}
.id-head .st{font-size:15px;color:var(--muted)}
.id-meta{margin:14px 0 4px 80px;display:flex;flex-direction:column;gap:6px;max-width:64ch}
@media (max-width:640px){.id-meta{margin-left:0}}
.id-meta p{font-size:14px;color:var(--muted)}
.id-meta p b{color:var(--fg);font-weight:600;margin-right:6px}
.obj{margin:22px 0 0 80px}
@media (max-width:640px){.obj{margin-left:0}}
.obj-h{display:flex;align-items:center;gap:10px;padding:6px 0}
.obj-h button{font-size:17px;font-weight:700;letter-spacing:-.015em;text-align:left}
.obj-h span{font-size:18px}
.kr{padding:6px 0 12px}
.kr .row{grid-template-columns:minmax(0,1fr) auto;padding:6px 0}
.kr .bar{margin-left:50px}
.kr-r{display:flex;align-items:center;gap:12px}
.step{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:18px;line-height:1;color:var(--fg);font-weight:500}
.step:hover{background:var(--surface-3)}
.head-r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pill-mini{height:30px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:600;white-space:nowrap}
.pill-mini:hover{background:var(--surface-3)}
.kr.faded{opacity:.5}
.tpl-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.tpl-f{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:10px}
@media (max-width:480px){.tpl-f{grid-template-columns:minmax(0,1fr)}}
.tpl-item .x{margin-top:30px}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;margin-top:10px}
.wk{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border-radius:14px;background:var(--surface);min-width:60px}
.wk span{font-size:11px;color:var(--muted);font-weight:600}
.wk b{font-size:14px;font-weight:600}
.wk.on{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--fg)}
.wk:disabled{opacity:.35}
.obj-add{display:flex;gap:22px;flex-wrap:wrap}
.qty-form{display:flex;gap:8px;margin:6px 0 4px 50px}
.qty-form input{flex:1;min-width:0;height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--surface-2)}
.qty-form .qdate{flex:0 0 150px}
@media (max-width:640px){.qty-form{margin-left:0;flex-wrap:wrap}.qty-form .qdate{flex:1 1 140px}}
.log li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.log b{font-weight:600}

/* Habits grid */
.hgrid-wrap{overflow-x:auto}
.hgrid{width:100%;border-collapse:collapse;min-width:640px}
.hgrid th,.hgrid td{padding:8px 6px;text-align:center;font-weight:400}
.hgrid th{font-size:12px;color:var(--muted);font-weight:600}
.hgrid th.today{color:var(--fg)}
.hgrid td:first-child,.hgrid th:first-child{text-align:left;padding-left:0}
.hname{display:flex;align-items:center;gap:12px;text-align:left}
.hname b{font-weight:500;display:block}
.hname small{display:block;font-size:12px;color:var(--muted)}
.cell{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:inline-grid;place-items:center;color:transparent}
.cell svg{width:14px;height:14px}
.cell.on{background:var(--pos);color:#000}
.cell.off{background:transparent;border:1.5px dashed var(--surface-3)}
.cell:disabled{opacity:.35}
.idbar{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr) 3rem;align-items:center;gap:14px;padding:8px 0}
.idbar > span{display:flex;align-items:center;gap:10px;min-width:0;font-weight:500}
.idbar > span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idbar b{text-align:right;font-weight:600}

/* Forms & review */
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field > span{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%;min-width:0;padding:12px 14px;border-radius:14px;border:0;background:var(--surface-2)}
.field input,.field select{height:46px}
.field textarea{resize:vertical;min-height:90px;line-height:1.5}
.field .hint{font-size:12px;color:var(--faint)}
.rv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.rv-grid{grid-template-columns:minmax(0,1fr)}}

<script>
/* ---------- Utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
/* La date métier se calcule dans le fuseau du compte (Réglages) : même jour et même lundi sur tous les appareils */
const DEF_TZ='Europe/Paris';const TZF={};
function today(){let tz=DEF_TZ;try{tz=(S.data.settings.main||{}).tz||DEF_TZ}catch(e){}
  try{const f=TZF[tz]||(TZF[tz]=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}));return f.format(new Date())}catch(e){return ymd(new Date())}}
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const maxD=(a,b)=>a>b?a:b, minD=(a,b)=>a<b?a:b;
const nowIso=()=>new Date().toISOString();
const nf=new Intl.NumberFormat('fr-FR');
const fmtN=n=>nf.format(Math.round((+n||0)*10)/10);
const pctS=p=>Math.round((p||0)*100)+' %';
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const plural=(n,w)=>`${n} ${w}${n>1?'s':''}`;
function fmtD(s,withYear){if(!s)return '—';const d=parse(s);const o={day:'numeric',month:'short'};if(withYear||d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString('fr-FR',o)}
function monday(s){const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function isoWeek(s){const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7)+3);const y=d.getFullYear();const f=new Date(y,0,4);f.setDate(f.getDate()-((f.getDay()+6)%7)+3);const w=1+Math.round((d-f)/(7*864e5));return{y,w,key:`${y}-W${pad(w)}`}}
const qKey=s=>{const[y,m]=s.split('-').map(Number);return `${y}-Q${Math.floor((m-1)/3)+1}`};
function qRange(k){const[y,q]=k.split('-Q').map(Number);const sm=(q-1)*3;return{start:ymd(new Date(y,sm,1)),end:ymd(new Date(y,sm+3,0))}}
const qLabel=k=>{const[y,q]=k.split('-Q');return `T${q} ${y}`};
function qShift(k,n){let[y,q]=k.split('-Q').map(Number);q+=n;while(q>4){q-=4;y++}while(q<1){q+=4;y--}return `${y}-Q${q}`}
function dPts(d,suffix){const n=Math.round(d*100);const cls=n>0?'up':n<0?'down':'muted';return `<span class="${cls}">${n>0?'▲ +':n<0?'▼ −':''}${Math.abs(n)} pts</span>${suffix?` <span class="muted">${suffix}</span>`:''}`}

const ICON={
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>',
  okr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>',
  habits:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.8 2.7L16.5 9"/></svg>',
  review:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17.5 9 12l4 4 7.5-8.5"/><path d="M15.5 7.5h5v5"/></svg>',
  studio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="m10 9.2 5 2.8-5 2.8z" fill="currentColor"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  progress:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="m7.5 14.5 3.5-4 3 2.5 5-6"/></svg>',
  kb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7.5 14h9"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  left:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 6 6 6-6 6"/></svg>'
};

/* ---------- Référentiels ---------- */
const TABS=[
  {k:'today',label:"Aujourd'hui",short:"Aujourd'hui",hash:'aujourdhui'},
  {k:'okr',label:'Identités',short:'Identités',hash:'identites'},
  {k:'habits',label:'Habitudes',short:'Habitudes',hash:'habitudes'},
  {k:'progress',label:'Progrès',short:'Progrès',hash:'progres'},
  {k:'review',label:'Revue',short:'Revue',hash:'revue'},
  {k:'studio',label:'Studio',short:'Studio',hash:'studio'}
];
const STAGES=[
  {k:'idee',label:'Idée'},{k:'angle',label:'Angle'},{k:'recherche',label:'Recherche'},{k:'ecriture',label:'Plan & script'},
  {k:'packaging',label:'Titre & miniature'},{k:'voix',label:'Voix'},{k:'montage',label:'Montage & mixage'},{k:'publie',label:'Publiée'}
];
const STAGE_LABEL=Object.fromEntries(STAGES.map(s=>[s.k,s.label]));
const PHASES=[{k:'angle',label:"Verrouiller l'angle"},{k:'recherche',label:'Recherche'},{k:'ecriture',label:'Plan en loops & script'},{k:'voix',label:'Enregistrement voix'},{k:'montage',label:'Montage & mixage'}];
const CPLX={legere:'Légère',moyenne:'Moyenne',lourde:'Lourde'};
const KINDS=[['habit','Habitude','Se valide dans Aujourd’hui, les jours que tu choisis.'],['qty','Quantité','Mots, heures… tu ajoutes ce que tu fais.'],['milestone','Étape','Faite ou pas. Se coche dans Identités.']];
const COLORS=['#FF7A45','#E8B10E','#4C7DFF','#9B6BFF','#19B9A8','#FF5D8F','#6CC56C','#8E9AAF'];
const PICTOS=['🥊','🏆','💪','🏃','🧘','😴','🌅','🥗','💧','📚','✍️','🎬','🎙️','🎞️','🖼️','💡','🧠','♟️','🎮','💼','💻','🚀','📈','💰','✈️','🎯','🔥','⭐','🗣️','❤️','🎵','🙏'];
const DEF={phases:{angle:5,recherche:20,ecriture:10,voix:2,montage:10,marge:2},complexity:{legere:.6,moyenne:.8,lourde:1},goals:{'2026':4,'2027':7},capacity:20,hoursPerVideo:45,channel:'Zav le brave',tz:'Europe/Paris'};
const COLLS=['settings','identities','objectives','krs','habits','habitlog','todos','days','metrics','plans','justifs','reviews','videos','ideas','templates'];

/* ---------- Etat ---------- */
const S={
  data:Object.fromEntries(COLLS.map(c=>[c,{}])), ver:0,
  mode:'boot', loaded:{},
  tab:'today', day:null, quarter:qKey(today()), habitWeek:monday(today()), reviewWeek:monday(today()),
  okrMode:'week', week:monday(today()), qtyOpen:null, studio:'pipeline', ideaCat:'Tout', ideaQuery:'', allIdeas:false, range:{okr:'q',habits:'m',progress:'t'}, sheet:null, pendingImport:null
};
try{const v=JSON.parse(localStorage.getItem('dqte:ui')||'{}');if(v.studio)S.studio=v.studio;if(v.ideaCat)S.ideaCat=v.ideaCat;if(v.range)S.range={...S.range,...v.range};if(v.okrMode)S.okrMode=v.okrMode}catch(e){}
function saveUi(){try{localStorage.setItem('dqte:ui',JSON.stringify({studio:S.studio,ideaCat:S.ideaCat,range:S.range,okrMode:S.okrMode}))}catch(e){}}

/* ---------- Stockage : base en ligne (claude.ai) ou navigateur ---------- */
let db=null;
const writeQ={};
const clean=d=>{const o={...d};delete o.id;return o};
function loadLocal(){for(const c of COLLS){let raw={};try{raw=JSON.parse(localStorage.getItem('dqte:'+c)||'{}')||{}}catch(e){}S.data[c]=Object.fromEntries(Object.entries(raw).map(([k,v])=>[k,{...v,id:k}]))}S.ver++}
function saveLocal(c){try{localStorage.setItem('dqte:'+c,JSON.stringify(Object.fromEntries(Object.entries(S.data[c]).map(([k,v])=>[k,clean(v)]))))}catch(e){toast("Le navigateur refuse d'enregistrer. Exporte tes données pour ne rien perdre.")}}
function put(c,id,data){if(!id){console.error('Écriture sans identifiant ignorée',c);return}const doc=clean(data);S.data[c]={...S.data[c],[id]:{...doc,id}};S.ver++;schedule();if(db)queueWrite(c,id,doc);else saveLocal(c)}
function del(c,id){if(!id)return;const n={...S.data[c]};delete n[id];S.data[c]=n;S.ver++;schedule();if(db)queueWrite(c,id,null);else saveLocal(c)}
function queueWrite(c,id,data){const k=c+'/'+id;const q=writeQ[k]||(writeQ[k]={running:false,next:undefined});q.next=data;if(!q.running)flush(k,c,id)}
/* Une écriture n'est « synchronisée » qu'une fois confirmée par le serveur ; hors connexion elle reste en attente */
const SYNC={inflight:0,failed:{},online:navigator.onLine!==false};
async function flush(k,c,id){const q=writeQ[k];q.running=true;while(q.next!==undefined){const d=q.next;q.next=undefined;SYNC.inflight++;renderSync();
    try{const ref=db.collection(c).doc(id);if(d===null)await ref.delete();else await ref.set(d);delete SYNC.failed[k]}catch(e){SYNC.failed[k]={c,id,d};dbError(e)}finally{SYNC.inflight--;renderSync()}}q.running=false}
function syncState(){if(S.mode==='local')return['local','Enregistré sur cet appareil','Sur cet appareil'];if(S.mode!=='cloud')return['wait','Connexion…','Connexion…'];
  if(Object.keys(SYNC.failed).length)return['err','Impossible de synchroniser','Erreur'];
  if(!SYNC.online)return['off',SYNC.inflight?'Hors connexion · en attente de synchronisation':'Hors connexion · enregistré sur cet appareil','Hors connexion'];
  if(SYNC.inflight)return['wait','En attente de synchronisation','En attente'];return['ok','Synchronisé','Synchronisé']}
function renderSync(){const[k,l,sh]=syncState();document.querySelectorAll('[data-sync]').forEach(el=>{el.className='store-state s-'+k;const a=el.querySelector('.lg'),b=el.querySelector('.sh'),btn=el.querySelector('button');if(a)a.textContent=l;if(b)b.textContent=sh;if(btn)btn.hidden=k!=='err'})}
function retrySync(){const f=SYNC.failed;SYNC.failed={};for(const{c,id,d} of Object.values(f))queueWrite(c,id,d);renderSync()}
window.addEventListener('online',()=>{SYNC.online=true;renderSync()});window.addEventListener('offline',()=>{SYNC.online=false;renderSync()});
function dbError(e){const c=e&&e.code;if(c==='quota_exceeded')toast("Stockage plein : supprime d'anciennes données ou exporte-les.");else if(c==='invalid_argument')toast("Cette modification n'a pas pu être enregistrée.");else if(c==='revoked')toast("L'accès en écriture a été retiré pour cette session.");else toast('Enregistrement impossible pour le moment, réessaie dans un instant.')}
async function initStore(){
  let api=null;
  if(window.DQ_BACKEND){try{api=await window.DQ_BACKEND.ready}catch(e){api=null}}
  else try{api=(window.claude&&typeof window.claude.use==='function')?await window.claude.use('db'):null}catch(e){api=null}
  if(!api){S.mode='local';loadLocal();renderShell();schedule();return}
  db=api;S.mode='cloud';renderShell();
  for(const c of COLLS){
    let q=db.collection(c);
    if(c==='todos')q=q.where('date','>=',addDays(today(),-120));
    q.onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]={...d.data(),id:d.id}});S.data[c]=m;S.loaded[c]=true;S.ver++;schedule()},err=>{S.loaded[c]=true;if(err&&err.code!=='revoked')toast('Synchronisation interrompue. Recharge la page.');schedule()});
  }
}
const ready=()=>S.mode==='local'||(S.mode==='cloud'&&COLLS.every(c=>S.loaded[c]));

/* ---------- Domaine : identités, objectifs, preuves ---------- */
const list=c=>Object.values(S.data[c]);
const byCreated=(a,b)=>(a.createdAt||'').localeCompare(b.createdAt||'');
function settings(){const m=S.data.settings.main||{};return{...DEF,...clean(m),phases:{...DEF.phases,...(m.phases||{})},complexity:{...DEF.complexity,...(m.complexity||{})},goals:m.goals||DEF.goals}}
const identities=()=>list('identities').sort((a,b)=>(a.order??99)-(b.order??99)||byCreated(a,b));
const idOf=id=>S.data.identities[id];
const idColor=id=>(idOf(id)||{}).color||'#8E9AAF';
const objectivesOf=(q,iid)=>list('objectives').filter(o=>o.quarter===q&&(!iid||o.identityId===iid)).sort(byCreated);
const krsOf=oid=>list('krs').filter(k=>k.objectiveId===oid).sort(byCreated);
const krsOfQuarter=q=>objectivesOf(q).flatMap(o=>krsOf(o.id).map(k=>({...k,identityId:o.identityId})));
const habits=()=>list('habits').sort(byCreated);
const proofHabitIds=()=>new Set(list('krs').filter(k=>kindOf(k)==='habit'&&k.habitId).map(k=>k.habitId));
const trackerHabits=()=>{const p=proofHabitIds();return habits().filter(h=>!p.has(h.id))};
const videos=()=>list('videos');
const ideas=()=>list('ideas');
function av(icon,color,cls='',fallback=''){const t=(icon||'').trim();return `<span class="av ${cls} ${t?'':'txt'}" style="--c:${esc(color||'#8E9AAF')}" aria-hidden="true">${t?esc(t):esc((fallback||'·').trim().charAt(0).toUpperCase()||'·')}</span>`}

function krQuarter(kr){if(kr._q)return kr._q;const o=S.data.objectives[kr.objectiveId];return o?o.quarter:qKey(today())}
function krSpan(kr){const{start,end}=qRange(krQuarter(kr));const c=(kr.createdAt||'').slice(0,10);let s=c&&c>start?c:start;if(s>end)s=start;return{qs:start,s,e:end}}
const kindOf=kr=>kr.kind==='manual'?'level':(kr.kind||'habit');
const habitOf=kr=>S.data.habits[kr.habitId];
const krTitle=kr=>kr.title||(habitOf(kr)||{}).name||'Preuve sans titre';
const krIcon=kr=>kr.icon||(habitOf(kr)||{}).icon||'';
const sumLog=(log,a,b)=>Object.entries(log||{}).reduce((s,[d,v])=>d>=a&&d<=b?s+(+v||0):s,0);
const signed=(v,u)=>`${v>0?'+':v<0?'−':''}${fmtN(Math.abs(v))}${u?' '+esc(u):''}`;
function autoTarget(kr){const h=habitOf(kr);if(!h)return 0;const{s,e}=krSpan(kr);return occurrences(h,maxD(s,hStart(h)),e)}
function krTarget(kr){const k=kindOf(kr);if(k==='milestone')return 1;if(k==='habit')return autoTarget(kr);return +kr.target||0}
const qtyStep=kr=>+kr.step>0?+kr.step:1;
const krStart=kr=>kindOf(kr)==='level'?(+kr.start||0):0;
function levelAt(kr,d){const h=kr.history||{};const ks=Object.keys(h).filter(x=>x<=d).sort();if(ks.length)return +h[ks[ks.length-1]]||0;return Object.keys(h).length?krStart(kr):(+kr.current||0)}
function krValueAt(kr,d){const{qs}=krSpan(kr);const k=kindOf(kr);
  if(k==='habit')return habitCount(kr.habitId,qs,d);
  if(k==='qty')return sumLog(kr.log,qs,d);
  if(k==='videos')return publishedBetween(qs,d).length;
  if(k==='milestone')return kr.done&&(kr.doneAt||'0000')<=d?1:0;
  return levelAt(kr,d)}
function krValue(kr){const k=kindOf(kr);if(k==='level')return +kr.current||0;if(k==='milestone')return kr.done?1:0;const{e}=krSpan(kr);return krValueAt(kr,minD(today(),e))}
function prog(kr,v){const s=krStart(kr),t=krTarget(kr);if(t===s)return t>0&&v>=t?1:0;return clamp((v-s)/(t-s),0,1)}
const krProgress=kr=>prog(kr,krValue(kr));
const krProgressAt=(kr,d)=>prog(kr,krValueAt(kr,d));
function krExpectedAt(kr,d){const{s,e}=krSpan(kr);if(d<s)return 0;if(d>=e)return 1;
  const h=kindOf(kr)==='habit'&&habitOf(kr);if(h){const a=maxD(s,hStart(h));const tot=occurrences(h,a,e);if(tot)return occurrences(h,a,d)/tot}

  ${ms.slice(0,limit).map(x=>`<div class="jrow">${av(x.h.icon,idColor(x.h.identityId),'sm',x.h.name)}<div class="m"><b>${esc(x.h.name||'Habitude')}</b><span class="hint">${x.scope==='week'?`Semaine ${isoWeek(x.key).w} : ${x.c} sur ${x.h.perWeek||3}`:esc(fmtDay(x.key,true))}</span></div>${justBtns(x.h,x.key,x.scope,'')}</div>`).join('')}
  ${ms.length>limit?`<p class="hint" style="margin-top:8px">… et ${ms.length-limit} autre${ms.length-limit>1?'s':''}.</p>`:''}</section>`}
function rate30(h){const t=today();const a=maxD(addDays(t,-29),hStart(h));const exp=occurrences(h,a,t);if(!exp)return null;return Math.min(1,habitCount(h.id,a,t)/exp)}
function dayScore(d){let den=0,dn=0;for(const h of trackerHabits()){if(d<hStart(h))continue;const done=habitDone(h.id,d);if(freqOf(h)==='weekly'){den+=(h.perWeek||3)/7;if(done)dn+=1}else if(fixedOn(h,d)){den++;if(done)dn++}}return den?Math.min(1,dn/den):null}
function weekStats(mon){const t=today();let sc=0,dn=0;const votes={};const tk=new Set(trackerHabits().map(h=>h.id));
  for(const h of habits()){const end=minD(addDays(mon,6),t);if(end<mon)continue;const c=habitCount(h.id,mon,end);votes[h.identityId||'_']=(votes[h.identityId||'_']||0)+c;if(!tk.has(h.id))continue;
    if(freqOf(h)==='weekly'){if(addDays(mon,6)>=hStart(h)){sc+=(h.perWeek||3);dn+=Math.min(c,h.perWeek||3)}}else{const a=maxD(mon,hStart(h));const e=occurrences(h,a,end);sc+=e;dn+=Math.min(c,e)}}
  const days=[...Array(7)].map((_,i)=>addDays(mon,i));let td=0,tt=0;for(const d of days){const it=todoItems(d);tt+=it.length;td+=it.filter(x=>x.done).length}
  const moves=[];for(const v of videos()){const lg=v.stageLog||[];lg.forEach((l,i)=>{if(i>0&&l.date>=mon&&l.date<=days[6]&&stageIdx(l.stage)>stageIdx(lg[i-1].stage))moves.push({v,...l})})}
  return{rate:sc?dn/sc:null,done:dn,sched:sc,votes,todosDone:td,todosTotal:tt,moves}}

const todoItems=s=>((S.data.todos[s]||{}).items||[]);
function saveTodos(s,items){put('todos',s,{date:s,items})}

/* ---------- Journée : sommeil, énergie et humeur du matin (mêmes choix que le tableau « Days » de Notion) ---------- */
const SLEEP=[[5,'🌕','Excellent'],[4,'🌔','Bon'],[3,'🌓','Moyen'],[2,'🌒','Mauvais'],[1,'🌑','Très mauvais']];
const sleepOf=n=>SLEEP.find(x=>x[0]===n);
const ENERGY=[[5,'⚡','Ultra','Ultra énergétique'],[4,'💪','Motivé','Motivé · bonne énergie'],[3,'⚖️','Stable','Équilibré · stable'],[2,'🐢','Fatigué','Fatigué · lourd et lent'],[1,'🪫','KO','Épuisé · KO']];
const MOODS=['🤩','🙂','😐','😠','😔'];
const dayOf=d=>S.data.days[d]||{};
const energyOf=n=>ENERGY.find(x=>x[0]===n);
function setDay(d,patch){const b=S.data.days[d];put('days',d,{...(b?clean(b):{}),date:d,...patch,updatedAt:nowIso()})}
function weekMood(mon){const days=[...Array(7)].map((_,i)=>addDays(mon,i));const vals=f=>days.map(d=>dayOf(d)[f]).filter(n=>n>0);const mean=f=>{const v=vals(f);return v.length?avg(v):null};
  return{days,avg:mean('energy'),sleep:mean('sleep'),nE:vals('energy').length,nS:vals('sleep').length}}

/* ---------- Studio ---------- */
const stageIdx=k=>Math.max(0,STAGES.findIndex(s=>s.k===k));
const publishedBetween=(a,b)=>videos().filter(v=>v.stage==='publie'&&v.publishDate&&v.publishDate>=a&&v.publishDate<=b);
const publishedInYear=y=>publishedBetween(`${y}-01-01`,`${y}-12-31`);
function plan(v){if(!v.publishDate)return null;const st=settings();const f=st.complexity[v.complexity||'lourde']??1;let end=addDays(v.publishDate,-(+st.phases.marge||0));const out={};
  for(const p of [...PHASES].reverse()){const d=Math.max(1,Math.round((+st.phases[p.k]||0)*f));const start=addDays(end,-d);out[p.k]={start,end};end=start}
  out.packaging={start:out.recherche.start,end:out.ecriture.end};out.start=out.angle.start;return out}
function deadline(v,p){p=p||plan(v);if(!p)return null;const m={idee:p.angle.start,angle:p.angle.end,recherche:p.recherche.end,ecriture:p.ecriture.end,packaging:p.ecriture.end,voix:p.voix.end,montage:p.montage.end};const d=m[v.stage];return d?addDays(d,-1):null}
function videoStatus(v){if(v.stage==='publie')return{k:'pos',t:'Publiée'};const p=plan(v);if(!p)return{k:'mut',t:'Sans date'};const dl=deadline(v,p);if(!dl)return{k:'mut',t:''};const late=diffDays(dl,today());
  if(late>0)return{k:'neg',t:`Retard ${late} j`};if(late>-4)return{k:'warn',t:late===0?"Échéance aujourd'hui":`Échéance ${fmtD(dl)}`};return{k:'pos',t:'Dans les temps'}}
function setStage(id,k){const v=S.data.videos[id];if(!v||v.stage===k)return;const n={...v,stage:k,stageLog:[...(v.stageLog||[]),{stage:k,date:today()}],updatedAt:nowIso()};
  if(k==='publie'&&(!n.publishDate||n.publishDate>today()))n.publishDate=today();put('videos',id,n);
  if(k==='publie')toast('Vidéo publiée : tes preuves « vidéos » sont à jour')}
function ideaScore(i){if(!i.potentiel||!i.envie)return null;return Math.round((+i.potentiel)*(+i.envie)/Math.max(1,+i.effort||3)*10)/10}

/* Graphique en ligne façon Trade Republic : courbe réelle + trajectoire attendue en pointillés ; survol ou doigt pour lire une date */
const CH={};
function lineChart(id,{xs,act,exp,y0=0,y1=1,fmtV=pctS,fmtX=null,live=true,good=null,expLabel='attendu'}){
  const n=xs.length;const X=i=>n<=1?500:i/(n-1)*1000;const Y=v=>200-(clamp(v,y0,y1)-y0)/((y1-y0)||1)*200;
  const path=arr=>{let p='';(arr||[]).forEach((v,i)=>{if(v==null)return;p+=(p?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});return p};
  let li=-1;act.forEach((v,i)=>{if(v!=null)li=i});
  if(li<0)return `<div class="chart"><div class="c-empty">Pas encore de données sur cette période</div></div>`;
  const fi=act.findIndex(v=>v!=null);
  const up=good!=null?good:exp?act[li]>=exp[li]-.005:act[li]>=act[fi];
  CH[id]={xs,act,exp,fmtV,fmtX,X,Y,expLabel};
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">${exp?`<path class="l-exp" d="${path(exp)}"/>`:''}<path class="l-act ${up?'up':'down'}" d="${path(act)}"/></svg>
  <i class="c-dot ${up?'up':'down'} ${live?'live':''}" style="left:${(X(li)/10).toFixed(2)}%;top:${(Y(act[li])/2).toFixed(2)}%"></i><i class="c-scrub" hidden></i><i class="c-dot c-sd ${up?'up':'down'}" hidden></i><div class="c-hit" role="img" aria-label="Courbe de progression"></div></div>`}
function scrub(el,clientX){const id=el.dataset.chart;const c=CH[id];if(!c)return;const r=el.getBoundingClientRect();const n=c.xs.length;let i=Math.round(clamp((clientX-r.left)/r.width,0,1)*(n-1));while(i>0&&c.act[i]==null)i--;if(c.act[i]==null)return;
  const sl=el.querySelector('.c-scrub'),sd=el.querySelector('.c-sd');sl.hidden=false;sd.hidden=false;sl.style.left=sd.style.left=(c.X(i)/10)+'%';sd.style.top=(c.Y(c.act[i])/2)+'%';
  const v=$('#'+id+'-v'),d=$('#'+id+'-d');if(v&&!c.orig)c.orig=[v.innerHTML,d?d.innerHTML:''];if(v)v.textContent=c.fmtV(c.act[i]);
  if(d)d.innerHTML=`<span class="muted">${esc(c.fmtX?c.fmtX(c.xs[i]):fmtD(c.xs[i],true))}${c.exp?` · ${esc(c.expLabel||'attendu')} ${esc(c.fmtV(c.exp[i]))}`:''}</span>`}
function unscrub(el){const id=el.dataset.chart;const c=CH[id];if(!c)return;el.querySelector('.c-scrub').hidden=true;el.querySelector('.c-sd').hidden=true;if(c.orig){const v=$('#'+id+'-v'),d=$('#'+id+'-d');if(v)v.innerHTML=c.orig[0];if(d)d.innerHTML=c.orig[1];c.orig=null}}
const hero=(id,label,v,d)=>`<div class="hero"><p class="eyebrow">${label}</p><div class="hero-v" id="${id}-v">${v}</div><div class="hero-d" id="${id}-d">${d}</div></div>`;

/* Ligne d'habitude à glisser */
function swipeRow(h,d){const on=habitDone(h.id,d);const i=idOf(h.identityId);
  const st=habitState(h.id,d);const sub=`${st==='min'?'<span class="tone-warn">Minimum réalisé</span> · ':''}${freqOf(h)==='weekly'?`${weekCount(h,monday(d))}/${h.perWeek||3} cette semaine · `:''}${streakTxt(h)}`;
  return `<div class="swipe ${on?'done':''}" data-swipe="${h.id}" data-date="${d}" data-done="${on?1:0}"><div class="swipe-bg">${on?'Annuler':'✓ Fait'}</div>
  <div class="swipe-fg row">${av(h.icon,idColor(h.identityId),'',h.name)}<div class="m"><span class="t">${esc(h.name||'Habitude sans nom')}</span><span class="s">${i?esc(i.name)+' · ':''}${sub}</span></div>
  ${habitCtl(h,d)}</div></div>`}

/* Aujourd'hui (U01) : la priorité et les prochaines actions d'abord, les compteurs en second plan.
   Les flèches remontent dans les jours passés pour les revoir ou les corriger. */
function viewToday(){
  const real=today(),t=S.day&&S.day<real?S.day:real,past=t<real,mon=monday(t),q=weekQuarter(mon),reset=diffDays(real,addDays(monday(real),7)),ago=diffDays(t,real);
  const title=parse(t).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const items=todoItems(t),done=items.filter(i=>i.done).length;
  const hs=habits().filter(h=>visibleOn(h,t)&&t>=hStart(h)),hd=hs.filter(h=>habitDone(h.id,t)).length;
  const ws=weekSummary(mon),pw=weekSummary(addDays(mon,-7));const nCarry=past?0:carryCandidates(t).length;
  const rv=S.data.reviews[isoWeek(real).key]||{};
  const remind=!past&&wd(real)===6&&!(rv.closedAt&&rv.auto===false)?`<section class="sec remind"><div class="sec-h"><h2>C’est dimanche : ta revue</h2></div><p class="note">Fais le bilan de ta semaine (ce qui a marché, ce qui a bloqué, tes 3 priorités), puis clôture-la.</p><div style="margin-top:14px"><button class="btn" data-act="open-review">Faire ma revue</button></div></section>`:'';
  const nav=`<div class="qnav"><button data-act="day-nav" data-d="-1" aria-label="Jour précédent">${ICON.left}</button><button data-act="day-nav" data-d="1" ${past?'':'disabled'} aria-label="Jour suivant">${ICON.right}</button></div>`;
  const nMiss=past?0:missedList().length;
  const habitsSec=`<section class="sec"><div class="sec-h"><h2>Habitudes du jour</h2>${nMiss?`<button class="act" data-act="tab" data-tab="habits">${nMiss} à justifier</button>`:'<span class="hint">Touche le rond pour valider</span>'}</div>
      ${hs.length?`<div class="list">${hs.map(h=>swipeRow(h,t)).join('')}</div>`:`<p class="empty">${past?'Aucune habitude prévue ce jour-là.':'Aucune habitude prévue aujourd\'hui. Ajoute-en une dans l’onglet Habitudes.'}</p>`}</section>`;
  const todoSec=`<section class="sec"><div class="sec-h"><h2>Tâches</h2>${nCarry?`<button class="act" data-act="carry-open">Reprendre des tâches (${nCarry})</button>`:''}</div>
      <form class="todo-add" data-form="todo"><input id="todo-new" placeholder="${past?'Ajouter une tâche à ce jour':'Ajouter une tâche'}" autocomplete="off" aria-label="Nouvelle tâche"><button class="btn sm" type="submit">Ajouter</button></form>
      ${items.length?`<ul class="todo">${items.map(i=>`<li class="${i.done?'done':''}"><button class="hcheck ${i.done?'on':''}" data-act="todo-toggle" data-id="${i.id}" aria-label="${i.done?'Décocher':'Cocher'} « ${esc(i.text)} »">${ICON.check}</button><span>${esc(i.text)}${i.from?`<small>Reportée du ${fmtD(i.from)}</small>`:''}</span><button class="x" data-act="todo-del" data-id="${i.id}" aria-label="Supprimer">${ICON.x}</button></li>`).join('')}</ul>`:`<p class="empty">${past?'Aucune tâche notée ce jour-là.':'Le matin, note les 3 à 5 tâches qui comptent aujourd\'hui.'}</p>`}</section>`;
  const counters=`<section class="sec"><div class="sec-h"><h2>En chiffres</h2></div><div class="stats mini">
    ${stat(past?'Habitudes ce jour-là':'Habitudes du jour',`${hd}<small> / ${hs.length}</small>`,hs.length?`${pctS(hd/hs.length)} validées`:'Aucune prévue')}
    ${stat('Tâches',`${done}<small> / ${items.length}</small>`,items.length?(done===items.length?'Tout est fait':`${items.length-done} restante${items.length-done>1?'s':''}`):'Rien de noté')}
    ${stat(`Engagements sem. ${isoWeek(t).w}`,ws.score==null?'—':`<span class="tone-${rateTone(ws.score,past).k}">${pctS(ws.score)}</span>`,ws.score==null?'Aucun engagement prévu':ws.score!=null&&pw.score!=null?dPts(ws.score-pw.score,'vs sem. d’avant'):`jour ${diffDays(mon,t)+1} / 7`)}
  </div><p class="hint" style="margin-top:8px">Engagements : preuves et habitudes liées à tes identités. Les habitudes indépendantes n’y comptent pas.</p></section>`;
  return `<header class="page-head"><h1 class="h1 cap">${esc(title)}</h1>${nav}</header>
  <p class="eyebrow">${past?`${ago===1?'Hier':`Il y a ${ago} jours`} · semaine ${isoWeek(t).w} · <button class="act" data-act="day-today">Revenir à aujourd’hui</button>`:`Semaine ${isoWeek(t).w} · ${qLabel(q)} · nouvelle semaine dans ${plural(reset,'jour')}`}</p>
  ${remind}<div class="today-grid"><div>${morningCard(t)}${prioCard(t)}${habitsSec}${todoSec}</div>
  <div>${past?'':`<section class="sec">${focusVideo()}</section>`}${weeklyPrios(t)}${counters}<section class="sec">${weekFocus(mon)}</section></div></div>`}
/* F01 : une priorité principale par date. Elle référence une tâche, une preuve, une habitude, une priorité de la semaine
   ou une action Studio, sans jamais la recopier. Accomplie, elle le reste : aucune autre n'est imposée à sa place. */
function prioInfo(t){const d=dayOf(t),p=d.prio;if(!p)return null;const miss={p,missing:true,label:p.label||'Élément introuvable',icon:'⭐'};let label='',sub='',done=false,act='',icon='⭐',iid='';
  if(p.kind==='todo'){const it=todoItems(t).find(i=>i.id===p.id);if(!it)return miss;label=it.text;icon='📝';done=!!it.done;act=`<button class="btn" data-act="todo-toggle" data-id="${it.id}">Marquer comme faite</button>`}
  else if(p.kind==='habit'){const h=S.data.habits[p.id];if(!h)return miss;label=h.name||'Habitude';icon=h.icon||'🔁';iid=h.identityId;const st=habitState(h.id,t);done=st==='target';sub=[h.targetLabel,st==='min'?'Minimum réalisé':''].filter(Boolean).join(' · ');act=habitCtl(h,t)}
  else if(p.kind==='kr'){const k=S.data.krs[p.id];if(!k)return miss;const o=S.data.objectives[k.objectiveId]||{},kind=kindOf(k),mon=monday(t);label=krTitle(k);icon=krIcon(k)||'🎯';iid=o.identityId;sub=o.title||'';
    if(kind==='milestone'){done=!!k.done;act=`<button class="btn" data-act="kr-done" data-id="${k.id}" data-date="${t}">Marquer faite</button>`}
    else if(kind==='qty'){const r=krWeekRate(k,mon);done=r!=null&&r>=1;sub=`${fmtN(krWeekValue(k,mon))} / ${fmtN(krWeekTarget(k,mon))} ${k.unit||''} cette semaine`;act=qtyCtl(k,t,mon)+`<button class="step" data-act="qty-open" data-id="${k.id}" aria-label="Saisir au clavier">${ICON.kb}</button>`}
    else{const h=habitOf(k);if(h){done=habitState(h.id,t)==='target';act=habitCtl(h,t)}}}
  else if(p.kind==='video'){const v=S.data.videos[p.id];if(!v)return miss;label=v.nextAction||`${STAGE_LABEL[v.stage]} · ${v.title||''}`;sub=v.title||'';icon='🎬';done=!!d.prioDone;act=`<button class="btn-sec" data-act="edit-video" data-id="${v.id}">Ouvrir la fiche</button><button class="btn" data-act="prio-done" data-date="${t}">Marquer accomplie</button>`}
  else if(p.kind==='weekly'){const r2=S.data.reviews[p.week];const x=r2&&r2.prios&&r2.prios[p.id];if(!x)return miss;label=x.text;icon='📌';sub='Priorité de la semaine';done=!!x.done;act=`<button class="btn" data-act="wprio-done" data-key="${p.week}" data-id="${p.id}">Marquer accomplie</button>`}
  return{p,label,sub,done,act,icon,iid}}
function prioCard(t){const x=prioInfo(t),past=t<today();
  if(!x)return `<section class="sec prio"><div class="sec-h"><h2>Priorité du jour</h2></div>${past?'<p class="empty">Aucune priorité choisie ce jour-là.</p>':`<p class="note">Choisis l’action qui compte le plus aujourd’hui : une tâche, une preuve ou une action du Studio.</p><div class="prio-a"><button class="btn" data-act="prio-pick">Choisir ma priorité</button></div>`}</section>`;
  const i=idOf(x.iid);
  return `<section class="sec prio ${x.done?'done':''}"><div class="sec-h"><h2>Priorité du jour</h2><button class="act" data-act="prio-pick">Changer</button></div>
  <div class="prio-b">${av(x.icon,i?i.color:'#8B83FF','',x.label)}<div class="m"><b>${esc(x.label)}</b><span class="hint">${[i&&i.name,x.sub].filter(Boolean).map(esc).join(' · ')||'&nbsp;'}</span></div></div>
  ${x.missing?'<p class="hint" style="margin-top:10px">L’élément d’origine a été supprimé ou déplacé. Choisis une autre priorité.</p>':x.done?'<p class="prio-ok">✓ Priorité accomplie</p>':`<div class="prio-a">${x.act}</div>`}</section>`}
function sheetPrio(t){const mon=monday(t);const items=todoItems(t).filter(i=>!i.done);const hs=habits().filter(h=>visibleOn(h,t)&&t>=hStart(h)&&habitState(h.id,t)!=='target');
  const krs=weekProofs(mon).filter(k=>!k.virtual&&(s=>s!=null&&s<1)(krWeekScore(k,mon)));const wp=weekPriosFor(t).filter(x=>!x.done);
  const vids=videos().filter(v=>v.stage!=='publie'&&v.stage!=='idee').sort((a,b)=>(a.publishDate||'9999').localeCompare(b.publishDate||'9999')).slice(0,3);
  const row=(kind,id,icon,label,sub,extra='')=>`<button class="row" data-act="prio-set" data-kind="${kind}" data-id="${id}" ${extra}>${av(icon,'#8B83FF','sm',label)}<span class="m"><span class="t">${esc(label)}</span>${sub?`<span class="s">${esc(sub)}</span>`:''}</span><span></span></button>`;
  const grp=(h,rows)=>rows.length?`<section><h3>${h}</h3><div class="list">${rows.join('')}</div></section>`:'';
  return sheetTop('Priorité du jour',esc(fmtDay(t,true)))+`<section><h3>Une nouvelle tâche</h3><form class="todo-add" data-form="prio-new"><input id="prio-new" placeholder="Ce qui compte le plus aujourd’hui" autocomplete="off" aria-label="Nouvelle tâche prioritaire"><button class="btn sm" type="submit">Choisir</button></form></section>
  ${grp('Tâches du jour',items.map(i=>row('todo',i.id,'📝',i.text,'')))}
  ${grp('Priorités de la semaine',wp.map(x=>row('weekly',x.id,'📌',x.text,'',`data-week="${x.week}"`)))}
  ${grp('Engagements de la semaine',krs.map(k=>row('kr',k.id,krIcon(k)||'🎯',krTitle(k),`${fmtN(krWeekValue(k,mon))} / ${fmtN(krWeekTarget(k,mon))} ${kindOf(k)==='milestone'?'':k.unit||''}`.trim())))}
  ${grp('Habitudes du jour',hs.map(h=>row('habit',h.id,h.icon||'🔁',h.name||'Habitude',freqLabel(h))))}
  ${grp('Studio',vids.map(v=>row('video',v.id,'🎬',v.nextAction||`${STAGE_LABEL[v.stage]} · ${v.title||''}`,v.nextAction?(v.title||''):'Prochaine action à définir dans la fiche')))}
  ${dayOf(t).prio?`<section><button class="btn-sec" data-act="prio-clear">Retirer la priorité</button></section>`:''}`}

function okrSeries(q,range){const{start,end}=qRange(q);const t=today();let a=start,b=end;

  const xs=[];for(let d=a;d<=b;d=addDays(d,1))xs.push(d);const krs=allProofs(q);
  return{xs,act:xs.map(d=>d>t?null:avg(krs.map(k=>krProgressAt(k,d)))),exp:xs.map(d=>avg(krs.map(k=>krExpectedAt(k,d))))}}

    top=hero('okr',label,ws.score==null?'—':pctS(ws.score),ws.score==null?'<span class="muted">Aucun engagement prévu</span>':[d1,d2].filter(Boolean).join('<span class="muted">·</span>'))
      +lineChart('okr',{xs:days,act:days.map(d=>d>t?null:weekScoreAt(mon,d)),exp:days.map(d=>weekExpectedAt(mon,d)),fmtX:d=>parse(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'}),live:mon===cur})
      +`<p class="hint">La courbe suit ta semaine jour après jour ; les pointillés montrent le rythme attendu selon tes jours prévus (une habitude « X fois par semaine » se juge en fin de semaine). Chaque lundi, tout repart à zéro et la semaine terminée est sauvegardée ici :</p>`+strip;
    scoreOf=i=>{const s=ws.per[i.id];return s==null?null:{v:s,d:pw.per[i.id]!=null?s-pw.per[i.id]:null}};
  }else{const sum=qSummary(q),range=S.range.okr;
    if(sum.krs.length){const s=okrSeries(q,range);let y0=0,y1=1;
      if(range!=='q'){const vals=[...s.act,...s.exp].filter(v=>v!=null);const mn=Math.min(...vals),mx=Math.max(...vals);const pd=Math.max(.04,(mx-mn)*.2);y0=Math.max(0,mn-pd);y1=Math.min(1,mx+pd);if(y1-y0<.1)y1=Math.min(1,y0+.1)}
      const li=s.act.reduce((m,v,i)=>v!=null?i:m,-1),fi=s.act.findIndex(v=>v!=null);const ch=fi>=0&&li>=0?s.act[li]-s.act[fi]:0;

      top=hero('okr',`Engagements · progression ${qLabel(q)}`,pctS(sum.actual),`${dPts(ch,per)}<span class="muted">·</span>${dPts(sum.actual-sum.expected,`vs attendu (${pctS(sum.expected)})`)}`)+lineChart('okr',{...s,y0,y1})+pills('okr-range',range,[['w','1S'],['m','1M'],['q','Trimestre']]);

    scoreOf=i=>{const x=sum.per.find(p=>p.id===i.id);return x&&x.p!=null?{v:x.p,d:x.p-x.e}:null}}
  const overview=`<section class="sec"><div class="sec-h"><h2>Identités</h2><span class="head-r"><button class="act" data-act="open-templates">Modèles</button><button class="act" data-act="new-identity">Ajouter</button></span></div><div class="list">${ids.map(i=>{const sc=scoreOf(i);const o=objectivesOf(q,i.id)[0];const paused=mode==='week'?idPausedWeek(i.id,mon):i.status==='pause';

const ID_ST={prioritaire:['Prioritaire','prio'],entretenue:['Entretenue','maint'],pause:['En pause','pause']};

/* F08 : le résultat d'un objectif se lit à part de ses engagements */
function objResult(o){const t=o.resType||'none';
  if(t==='check')return{done:!!o.resDone,txt:o.resDone?`Atteint${o.resDoneAt?` le ${fmtD(o.resDoneAt)}`:''}`:'Pas encore atteint'};
  if(t==='count'){const c=+o.resCurrent||0,tg=+o.resTarget||0;return{done:tg>0&&c>=tg,txt:tg>0?`${fmtN(c)} sur ${fmtN(tg)}`:'Cible à définir'}}
  if(t==='videos'){const{start,end}=qRange(o.quarter||qKey(today()));const c=publishedBetween(start,end).length,tg=+o.resTarget||0;return{done:tg>0&&c>=tg,txt:`${c} vidéo${c>1?'s':''} publiée${c>1?'s':''}${tg?` sur ${tg}`:''}`}}
  if(t==='metric'){const m=S.data.metrics[o.metricId];return m?metricGoal(m):{done:false,txt:'Indicateur introuvable'}}
  return{none:true,done:false,txt:o.criterion?'Mesure à choisir':'Critère à préciser'}}

const RES=[['none','Pas de mesure'],['check','Case à cocher'],['count','Compteur'],['metric','Indicateur'],['videos','Vidéos publiées']];

function krRow(k,color,mode,mon){const kind=kindOf(k);const cur=monday(today());const isCur=mon===cur;const actDate=mode==='week'&&mon<cur?addDays(mon,6):today();

    rs=paused||(kind==='milestone'&&!(t>0))?'':rateHtml(r,past);col=toneVar(rateTone(r,past).k);

  if(kind==='habit'&&habitOf(k)&&(mode==='quarter'||isCur))ctl=habitCtl(habitOf(k),today());
  else if(kind==='qty')ctl=qtyCtl(k,actDate,mode==='week'?mon:krSpan(k).qs)+`<button class="step" data-act="qty-open" data-id="${k.id}" aria-label="Saisir au clavier">${ICON.kb}</button>`;
  else if(kind==='milestone'&&k.abandoned&&!k.done)ctl='';
  else if(kind==='milestone')ctl=`${!k.done&&k.week!==mon&&mode==='week'?`<button class="pill-mini" data-act="plan-week" data-id="${k.id}" data-mon="${mon}">Cette semaine</button>`:''}<button class="hcheck ${k.done?'on':''}" data-act="kr-done" data-id="${k.id}" data-date="${actDate}" aria-label="${k.done?'Marquer à faire':'Marquer faite'}">${ICON.check}</button>`;

const objTitleOf=k=>{const o=S.data.objectives[k.objectiveId];return o&&o.title?esc(o.title)+' · ':''};
/* − retire depuis les saisies les plus récentes de la période (semaine affichée ou trimestre), sans passer sous zéro */
const qtyCtl=(k,date,from)=>{const st=fmtN(qtyStep(k)),u=esc(k.unit||'');return `<span class="qsteps"><button class="step" data-act="qty-step" data-id="${k.id}" data-d="-1" data-date="${date}" data-from="${from}" aria-label="Retirer ${st} ${u}">−</button><button class="step" data-act="qty-step" data-id="${k.id}" data-d="1" data-date="${date}" data-from="${from}" aria-label="Ajouter ${st} ${u}">+</button></span>`};
function stepQty(k,d,dir,from){const r3=x=>Math.round(x*1000)/1000;const n=qtyStep(k);const log={...(k.log||{})};
  if(dir>0)log[d]=r3((+log[d]||0)+n);
  else{let rest=n;for(const day of Object.keys(log).filter(x=>x>=(from||'0000')&&x<=d&&+log[x]>0).sort().reverse()){const take=Math.min(rest,+log[day]);log[day]=r3(+log[day]-take);rest=r3(rest-take);if(!log[day])delete log[day];if(!rest)break}
    if(rest===n){toast('Rien à retirer sur cette période');return}}
  put('krs',k.id,{...k,log,updatedAt:nowIso()})}

/* ---------- Progrès : ce qui évolue dans le temps (poids, Elo, rang LoL) ---------- */
const TIERS=['Fer','Bronze','Argent','Or','Platine','Émeraude','Diamant','Maître','Grand Maître','Challenger'];
const DIVS=['IV','III','II','I'];
/* Un rang devient un nombre pour tracer la courbe : Fer IV = 0 … Diamant I = 27, Maître = 28, Grand Maître = 29, Challenger = 30 */
const rankVal=(t,d)=>t<7?t*4+d:21+t;
const rankParts=v=>{v=Math.round(+v);return v>=28?[Math.min(9,v-21),null]:[Math.floor(v/4),v%4]};
const rankLabel=v=>{if(v==null||!isFinite(+v))return '—';const[t,d]=rankParts(v);return d==null?TIERS[t]:`${TIERS[t]} ${DIVS[d]}`};
const PRESETS=[{key:'poids',name:'Poids',icon:'⚖️',type:'number',unit:'kg',idRe:/champ|box/i,hint:'Champion'},{key:'elo',name:'Elo échecs',icon:'♟️',type:'number',unit:'Elo',target:1800,dir:'up',idRe:/échec|echec/i,hint:'objectif 1 800'},{key:'lol',name:'Rang LoL',icon:'🎮',type:'rank',target:rankVal(6,0),idRe:/diam|lol|league/i,hint:'objectif Diamant IV'}];
const metrics=()=>list('metrics').sort(byCreated);
const numOrNull=v=>v===''||v==null||!isFinite(+v)?null:+v;
const mEntries=m=>Object.entries(m.history||{}).filter(([,v])=>numOrNull(v)!=null).map(([d,v])=>[d,+v]).sort((a,b)=>a[0].localeCompare(b[0]));
const mFmt=(m,v)=>v==null?'—':m.type==='rank'?rankLabel(v):`${fmtN(v)}${m.unit?' '+m.unit:''}`;
const mDiffTxt=(m,d)=>m.type==='rank'?plural(Math.round(d),'division'):`${fmtN(d)}${m.unit?' '+m.unit:''}`;
function mAt(es,d){let v=null;for(const[x,y] of es){if(x>d)break;v=y}return v}
/* F27 : sens de la cible choisi (augmenter, diminuer, rester dans une plage, bornes incluses).
   Un ancien indicateur sans sens explicite le déduit de sa cible par rapport à la première mesure. */
function mDirOf(m,es){if(m.dir)return m.dir;const t=numOrNull(m.target);es=es||mEntries(m);return t!=null&&es.length&&t<es[0][1]?'down':'up'}
function mDir(m,es){const d=mDirOf(m,es);return d==='down'?-1:d==='up'?1:0}
function dirSign(m,v){const d=mDirOf(m);if(d!=='range')return d==='down'?-1:1;const lo=numOrNull(m.min),hi=numOrNull(m.max);return v==null?0:lo!=null&&v<lo?1:hi!=null&&v>hi?-1:0}
function metricStatus(m,v){const dir=mDirOf(m);if(v==null)return{k:'mut',t:'Aucune mesure'};
  if(dir==='range'){const lo=numOrNull(m.min),hi=numOrNull(m.max);if(lo==null&&hi==null)return{k:'mut',t:'Plage à définir'};if(lo!=null&&v<lo)return{k:'warn',t:'Sous la plage',gap:lo-v};if(hi!=null&&v>hi)return{k:'warn',t:'Au-dessus de la plage',gap:v-hi};return{k:'pos',t:'Dans la plage cible',ok:true}}
  const t=numOrNull(m.target);if(t==null)return{k:'mut',t:'Sans cible'};const ok=dir==='down'?v<=t:v>=t;return ok?{k:'pos',t:'Cible atteinte',ok:true}:{k:'warn',t:'En cours',gap:Math.abs(t-v)}}
function mTargetTxt(m){const dir=mDirOf(m);if(dir==='range'){const lo=numOrNull(m.min),hi=numOrNull(m.max);return lo!=null&&hi!=null?`entre ${mFmt(m,lo)} et ${mFmt(m,hi)}`:lo!=null?`au moins ${mFmt(m,lo)}`:hi!=null?`au plus ${mFmt(m,hi)}`:''}const t=numOrNull(m.target);return t==null?'':`${dir==='down'?'au plus':'au moins'} ${mFmt(m,t)}`}
function setMetric(m,d,v){put('metrics',m.id,{...m,history:{...(m.history||{}),[d]:v},updatedAt:nowIso()})}
function metricForm(m,es){const last=es.length?es[es.length-1][1]:null;const date=`<input type="date" name="date" id="md-${m.id}" value="${today()}" aria-label="Date">`;
  if(m.type==='rank'){const[t,d]=last!=null?rankParts(last):[4,0];
    return `<form class="mform" data-form="metric" data-id="${m.id}"><select name="tier" id="mt-${m.id}" aria-label="Palier">${TIERS.map((x,i)=>`<option value="${i}" ${i===t?'selected':''}>${x}</option>`).join('')}</select><select name="div" id="mv-${m.id}" aria-label="Division">${DIVS.map((x,i)=>`<option value="${i}" ${i===(d??0)?'selected':''}>${x}</option>`).join('')}</select>${date}<button class="btn sm" type="submit">Ajouter la mesure</button></form>`}
  return `<form class="mform" data-form="metric" data-id="${m.id}"><input type="number" name="v" id="mv-${m.id}" step="any" inputmode="decimal" placeholder="${last!=null?fmtN(last):'Valeur'}${m.unit?' '+esc(m.unit):''}" aria-label="Nouvelle valeur" required>${date}<button class="btn sm" type="submit">Ajouter la mesure</button></form>`}
/* U05 : seules les mesures réelles sont tracées ; un relevé unique reste un point, jamais une courbe inventée.
   Toucher un point affiche sa date et sa valeur (pas besoin de survol sur téléphone). */
function metricChart(m,es,a,b,cid,sign){const pts=es.filter(([d])=>d>=a&&d<=b);if(!pts.length)return `<div class="chart mchart"><div class="c-empty">Pas de mesure sur cette période</div></div>`;
  const dir=mDirOf(m),tg=numOrNull(m.target),lo=numOrNull(m.min),hi=numOrNull(m.max);const ref=dir==='range'?[lo,hi].filter(v=>v!=null):tg!=null?[tg]:[];
  const vals=[...pts.map(x=>x[1]),...ref];let y0=Math.min(...vals),y1=Math.max(...vals);const pad=(y1-y0)*.15||(m.type==='rank'?2:Math.max(1,Math.abs(y1)*.02));y0-=pad;y1+=pad;
  const span=Math.max(1,diffDays(a,b));const X=d=>diffDays(a,d)/span*1000,Y=v=>200-(v-y0)/(y1-y0)*200;
  const diff=pts.length>1?pts[pts.length-1][1]-pts[0][1]:0;const good=sign&&diff?diff*sign>0:true;
  const line=pts.length>1?`<path class="l-act ${good?'up':'down'}" d="${pts.map((x,i)=>(i?'L':'M')+X(x[0]).toFixed(1)+' '+Y(x[1]).toFixed(1)).join('')}"/>`:'';
  const band=dir==='range'&&ref.length?`<rect class="m-band" x="0" width="1000" y="${Y(hi!=null?hi:y1).toFixed(1)}" height="${Math.max(2,Y(lo!=null?lo:y0)-Y(hi!=null?hi:y1)).toFixed(1)}"/>`:'';
  const tline=dir!=='range'&&tg!=null?`<path class="l-exp" d="M0 ${Y(tg).toFixed(1)}H1000"/>`:'';
  const dots=pts.map(x=>`<button class="m-pt" style="left:${(X(x[0])/10).toFixed(2)}%;top:${(Y(x[1])/2).toFixed(2)}%" data-act="mpt" data-c="${cid}" data-v="${esc(mFmt(m,x[1]))}" data-d="${esc(fmtD(x[0],true))}" aria-label="Mesure du ${esc(fmtD(x[0],true))} : ${esc(mFmt(m,x[1]))}"></button>`).join('');
  return `<div class="chart mchart"><svg viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">${band}${tline}${line}</svg>${dots}</div><div class="m-axis"><span>${esc(fmtD(a))}</span><span>${dir==='range'&&ref.length?'Bande verte : plage cible':tg!=null?'Pointillés : cible':''}</span><span>${esc(fmtD(b))}</span></div>`}
function metricCard(m,range){const es=mEntries(m),t=today();const cid='mc-'+m.id.replace(/[^a-zA-Z0-9_-]/g,'');
  const a=range==='all'?minD(es.length?es[0][0]:t,addDays(t,-29)):addDays(t,-({m:29,t:90,y:364}[range]||90)),b=t;
  const inR=es.filter(([d])=>d>=a&&d<=b);const last=es.length?es[es.length-1]:null;const st=metricStatus(m,last&&last[1]);
  const diff=inR.length>1?inR[inR.length-1][1]-inR[0][1]:0;const sign=dirSign(m,last&&last[1]);const rt={m:'sur 1 mois',t:'sur 3 mois',y:'sur 1 an',all:'depuis le début'}[range]||'';
  const delta=!last?'<span class="muted">Ajoute ta première mesure ci-dessous</span>':inR.length<2?`<span class="muted">${inR.length?'Une seule mesure sur cette période':'Aucune mesure sur cette période'}</span>`:!diff?`<span class="muted">Stable ${rt}</span>`:`<span class="${sign?(diff*sign>0?'up':'down'):'muted'}">${diff>0?'▲ +':'▼ −'}${esc(mDiffTxt(m,Math.abs(diff)))}</span> <span class="muted">${rt}</span>`;
  const tt=mTargetTxt(m);
  const goal=tt?`<div class="mgoal"><div><span>Cible : <b>${esc(tt)}</b></span>${last?tag({k:st.k,t:st.t+(st.gap!=null&&!st.ok?` · écart ${mDiffTxt(m,st.gap)}`:'')}):''}</div></div>`:'<p class="hint" style="margin-top:12px">Aucune cible : ajoute-la dans les réglages de l’indicateur pour savoir où tu en es.</p>';
  const i=idOf(m.identityId),o=S.data.objectives[m.objectiveId];const link=[o&&`Objectif « ${o.title||''} »`,i&&i.name].filter(Boolean).join(' · ')||'Indépendant';
  return `<section class="sec metric"><div class="sec-h"><button class="mhead" data-act="edit-metric" data-id="${m.id}">${av(m.icon,idColor(m.identityId||(o&&o.identityId)),'',m.name)}<span><b>${esc(m.name||'Indicateur')}</b><small>${esc(link)}</small></span></button><button class="act" data-act="edit-metric" data-id="${m.id}">Réglages</button></div>
  ${hero(cid,last?`Dernière mesure · ${fmtD(last[0],true)}`:'Aucune mesure',last?esc(mFmt(m,last[1])):'—',delta)}
  ${es.length?metricChart(m,es,a,b,cid,sign):''}${goal}
  ${m.purpose||m.freqHint?`<p class="hint" style="margin-top:8px">${[m.purpose&&`Sert à : ${esc(m.purpose)}`,m.freqHint&&`Saisie souhaitée : ${esc(String(m.freqHint).toLowerCase())}`].filter(Boolean).join(' · ')}</p>`:''}
  <h3 class="m-add">Ajouter une mesure</h3>${metricForm(m,es)}</section>`}
function viewProgress(){const ms=metrics(),range=S.range.progress||'t';
  const head=bilanSw()+`<header class="page-head"><h1 class="h1">Progrès</h1><button class="btn sm" data-act="new-metric">Nouvel indicateur</button></header>`;
  const left=PRESETS.filter(p=>!ms.some(m=>m.preset===p.key));
  const presets=left.length?`<div class="presets">${left.map(p=>`<button class="preset" data-act="metric-preset" data-v="${p.key}"><span class="av sm" aria-hidden="true">${p.icon}</span>${esc(p.name)} <small>${esc(p.hint)}</small></button>`).join('')}</div>`:'';
  if(!ms.length)return head+`<div class="empty-state"><h2>Suis ce qui évolue dans le temps</h2><p class="note">Ton poids, ton Elo aux échecs, ton rang sur League of Legends : une valeur que tu mets à jour quand elle change, et sa courbe vers ta cible. Un indicateur observe un résultat ; il ne valide pas d’habitude à ta place.</p>${presets}${addBtn('new-metric','Autre indicateur')}</div>`;

function viewGantt(){

  const end=Y1;const DW=7,W=(diffDays(start,end)+1)*DW,x=s=>clamp(diffDays(start,s),0,diffDays(start,end)+1)*DW;
  let months='',lines='';for(let d=parse(start);ymd(d)<=end;d=new Date(d.getFullYear(),d.getMonth()+1,1)){const s=ymd(d);months+=`<div class="g-month" style="left:${x(s)}px"><span>${d.toLocaleDateString('fr-FR',{month:'long'})}</span></div>`;lines+=`<div class="g-month" style="left:${x(s)}px"></div>`}

  return `<div class="gantt-wrap"><div class="gantt"><div class="g-row g-head"><div class="g-lab">Vidéo</div><div class="g-tr" style="width:${W}px">${months}${todayL}</div></div>${body}</div></div>
  <div class="legend">${PHASES.map(p=>`<span><i class="ph-${p.k}"></i>${p.label}</span>`).join('')}<span><i class="ph-packaging"></i>Titre & miniature</span><span><i style="background:var(--fg);transform:rotate(45deg)"></i>Publication</span><span><i style="background:var(--neg);width:2px"></i>Aujourd'hui</span></div>`}

function viewStats(){

/* Historique : chaque onglet et chaque fiche ouverte devient une page. Le bouton retour du téléphone ferme la fiche

let navLock=false;
const navState=()=>({dq:1,tab:S.tab,day:S.tab==='today'&&S.day?S.day:null,sheet:S.sheet?{kind:S.sheet.kind,coll:S.sheet.coll||null,id:S.sheet.id||null}:null});
const navUrl=st=>{const t=TABS.find(x=>x.k===st.tab);return '#'+(t?t.hash:'reglages')};
function navPush(replace){if(navLock)return;const st=navState();if(JSON.stringify(history.state)===JSON.stringify(st))return;try{history[replace?'replaceState':'pushState'](st,'',navUrl(st))}catch(e){}}
const sheetOnTop=()=>{const h=history.state;return !!(h&&h.dq&&h.sheet)};
/* Fermer depuis l'app (Terminé, fond, Échap, suppression) revient aussi d'une page en arrière */
function dismissSheet(){if(sheetOnTop())history.back();else closeSheet()}

window.addEventListener('popstate',e=>{const st=e.state;navLock=true;try{
    const want=st&&st.dq?st.sheet:null;const cur=S.sheet;
    if(cur&&!(want&&want.kind===cur.kind&&want.id===(cur.id||null)))closeSheet(true);
    const nd=st&&st.dq?st.day||null:null;const dayChanged=nd!==S.day;S.day=nd;
    if(st&&st.dq&&st.tab&&st.tab!==S.tab){S.tab=st.tab;renderShell();renderMain(true);window.scrollTo(0,0)}
    else if(dayChanged&&S.tab==='today'){renderMain(true);window.scrollTo(0,0)}
    if(want&&!S.sheet)openSheet(want.kind,want.coll,want.id);
    schedule()}finally{navLock=false}});

/* Encadré « Comment ça marche » de la fiche preuve : où elle apparaît, comment elle avance */
function howTo(k){const kind=kindOf(k);const step=(ok,n,html)=>`<li class="${ok?'ok':'todo'}"><i aria-hidden="true">${ok?ICON.check:n}</i><span>${html}</span></li>`;
  if(kind==='habit'){const h=habitOf(k);const f=h&&freqOf(h);const days=h?(h.days||[]):[];const hasDays=!!h&&(f!=='days'||days.length>0);const nd=h&&nextDue(h,today());const mon=monday(today());
    const when=!h?'les jours que tu auras choisis':f==='weekly'?`chaque jour, jusqu’à ce que tu l’aies faite ${h.perWeek||3} fois dans la semaine`:f==='daily'?'tous les jours':days.length?`<b>uniquement le${days.length>1?'s':''} ${esc(daysLong(h))}</b>. Les autres jours, elle est cachée&nbsp;: c’est normal`:'aucun jour pour l’instant';
    return `<div class="howto"><h4>Comment ça marche</h4><ol>
    ${step(!!h,1,h?`<b>Habitude activée</b>&nbsp;: « ${esc(h.name||krTitle(k))} » existe et compte pour cette preuve.`:`<b>Habitude pas encore activée</b>&nbsp;: touche « Créer l’habitude liée » ci-dessous. Tant qu’elle ne l’est pas, la preuve n’apparaît nulle part.`)}
    ${step(hasDays,2,h?(hasDays?`<b>Quand</b>&nbsp;: ${f==='weekly'?`${h.perWeek||3} fois par semaine`:f==='daily'?'tous les jours':`${days.length>1?'les':'le'} ${esc(daysLong(h))}`}. Tu changes ça juste en dessous.`:'<b>Choisis au moins un jour</b> juste en dessous.'):'<b>Choisis ses jours</b>&nbsp;: tous les jours, X fois par semaine ou des jours précis.')}

/* Message bref, avec une action facultative (ex. « Annuler ») */
let toastT;function toast(m,act){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent='';const sp=document.createElement('span');sp.textContent=m;el.appendChild(sp);
  if(act){const b=document.createElement('button');b.type='button';b.textContent=act.label;b.addEventListener('click',()=>{el.hidden=true;act.fn()});el.appendChild(b)}
  el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},act?6000:2800)}

function setPath(o,path,v){const ks=path.split('.');let c=o;for(let i=0;i<ks.length-1;i++){const k=ks[i],nk=ks[i+1];if(c[k]==null||typeof c[k]!=='object')c[k]=/^\d+$/.test(nk)?[]:{};c=c[k]}c[ks[ks.length-1]]=v}
function bindChange(el){const[coll,id,path]=el.dataset.bind.split(':');let v;
  if(el.type==='checkbox')v=el.checked;else if(el.dataset.type==='number')v=el.value===''?null:+el.value;else v=el.value;
  let base=coll==='settings'?settings():S.data[coll][id];
  if(!base&&coll==='reviews')base={week:id,monday:S.reviewWeek,createdAt:nowIso()};
  if(!base)return;
  if(coll==='metrics'&&(path==='min'||path==='max')){const lo=numOrNull(path==='min'?v:base.min),hi=numOrNull(path==='max'?v:base.max);if(lo!=null&&hi!=null&&lo>hi){toast('Le minimum doit être inférieur ou égal au maximum : valeur non enregistrée.');el.value=base[path]??'';return}}
  let doc=JSON.parse(JSON.stringify(clean(base)));setPath(doc,path,v);doc.updatedAt=nowIso();
  if(coll==='videos'&&path==='stage'&&base.stage!==v){doc.stageLog=[...(base.stageLog||[]),{stage:v,date:today()}];if(v==='publie'&&(!doc.publishDate||doc.publishDate>today()))doc.publishDate=today()}
  if(coll==='krs'&&path==='current')doc=withHistory(doc);
  if(coll==='objectives'&&path==='resDone')doc.resDoneAt=v?today():null;
  if(coll==='habits'&&path==='identityId'&&v!==base.identityId)doc.identitySince=today();
  if(coll==='objectives'&&path==='videoId'&&v){const vid=S.data.videos[v];const t=S.data.templates[base.fromTemplate];const plain=(t&&t.objTitle)||'Vidéo';if(vid&&(!base.title||base.title.trim()===plain))doc.title=`${plain} ${vid.title||''}`.trim()}
  if(coll==='krs'&&path==='done')doc.doneAt=v?today():null;
  if(coll==='krs'&&path==='week'&&base.week&&v!==base.week&&!base.done)doc.reschedules=[...(base.reschedules||[]),{from:base.week,to:v||null,at:today()}];
  put(coll,id,doc);
  if(coll==='krs'&&path==='title'){const h=S.data.habits[doc.habitId];if(h&&h.fromKr===id)put('habits',h.id,{...h,name:String(v).trim()})}
  if(S.sheet&&(['stage','publishDate','complexity','habitId','target','identityId','weekTarget','unit','done','videoId','resDone','resTarget','resCurrent','metricId','minEnabled','week','objectiveId','min','max'].includes(path)||(coll==='templates'&&/kind$|video$/.test(path))))setTimeout(()=>{const f=document.activeElement&&document.activeElement.id;renderSheet();if(f){const e2=document.getElementById(f);if(e2)e2.focus()}},0)}

    if(m.type==='rank')v=rankVal(+el.tier.value,+el.div.value);else{if(el.v.value==='')return;v=+el.v.value;if(!isFinite(v))return}
    setMetric(m,d,v);toast(`${m.name||'Indicateur'} · ${mFmt(m,v)}`);if(document.activeElement)document.activeElement.blur();renderMain(true);return}
  if(f.dataset.form==='prio-new'){e.preventDefault();const inp=$('#prio-new');const txt=inp.value.trim();if(!txt)return;const t=S.day||today();const id=uid();saveTodos(t,[...todoItems(t),{id,text:txt,done:false}]);setDay(t,{prio:{kind:'todo',id,label:txt},prioDone:false});dismissSheet();return}
  if(f.dataset.form==='carry'){e.preventDefault();const sel=[...f.querySelectorAll('input[name=carry]:checked')].map(x=>x.value.split('|'));if(!sel.length){toast('Sélectionne au moins une tâche');return}carryTasks(sel);dismissSheet();return}
  if(f.dataset.form==='todo'){e.preventDefault();const inp=$('#todo-new');const txt=inp.value.trim();if(!txt)return;const t=S.day||today();saveTodos(t,[...todoItems(t),{id:uid(),text:txt,done:false}]);inp.value='';renderMain(true);const n=$('#todo-new');if(n)n.focus()}});

/* ---------- Glissement des habitudes & lecture des courbes ---------- */
document.addEventListener('pointerdown',e=>{const fg=e.target.closest&&e.target.closest('.swipe-fg');if(!fg||e.button>0)return;sw={fg,el:fg.parentElement,x:e.clientX,y:e.clientY,id:e.pointerId,drag:false,dx:0}});
document.addEventListener('pointermove',e=>{
  if(sw&&e.pointerId===sw.id){const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
    if(!sw.drag){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3){sw.drag=true;try{sw.fg.setPointerCapture(e.pointerId)}catch(_){}sw.fg.style.transition='none'}else if(Math.abs(dy)>12){sw=null;return}else return}
    const done=sw.el.dataset.done==='1';const thr=Math.min(110,sw.el.offsetWidth*.28);
    const lim=(dx>0&&done)||(dx<0&&!done)?Math.sign(dx)*Math.min(Math.abs(dx)*.25,30):dx;
    sw.dx=dx;sw.fg.style.transform=`translateX(${lim}px)`;sw.el.dataset.dir=dx>=0?'r':'l';
    sw.el.classList.toggle('go',dx>thr&&!done);sw.el.classList.toggle('back',dx<-thr&&done);return}
  const hit=e.target.closest&&e.target.closest('.c-hit');if(hit)scrub(hit.parentElement,e.clientX)});
function swEnd(e){if(!sw||e.pointerId!==sw.id)return;const s=sw;sw=null;if(!s.drag)return;swAt=Date.now();s.fg.style.transition='';s.fg.style.transform='';
  const done=s.el.dataset.done==='1';const thr=Math.min(110,s.el.offsetWidth*.28);s.el.classList.remove('go','back');
  if((s.dx>thr&&!done)||(s.dx<-thr&&done)){applyHabit(s.el.dataset.swipe,s.el.dataset.date,done?'none':'target')}
  if(pending){pending=false;schedule()}}
document.addEventListener('pointerup',swEnd);document.addEventListener('pointercancel',swEnd);
document.addEventListener('pointerout',e=>{const hit=e.target.closest&&e.target.closest('.c-hit');if(hit&&!hit.contains(e.relatedTarget))unscrub(hit.parentElement)});
