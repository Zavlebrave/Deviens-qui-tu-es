/* ---------- Rendu ---------- */
let rq=false,pending=false;
let sw=null,swAt=0;
function schedule(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;renderMain()})}
function renderShell(){
  $('#nav').innerHTML=TABS.map(t=>`<button data-act="tab" data-tab="${t.k}" ${S.tab===t.k?'aria-current="page"':''}>${ICON[t.k]}<span>${t.label}</span></button>`).join('');
  $('#nav-settings').outerHTML=`<button data-act="tab" data-tab="settings" id="nav-settings" ${S.tab==='settings'?'aria-current="page"':''}>${ICON.settings}<span>Réglages</span></button>`;
  $('#tabbar').innerHTML=TABS.map(t=>`<button data-act="tab" data-tab="${t.k}" ${S.tab===t.k?'aria-current="page"':''}>${ICON[t.k]}<span>${t.short}</span></button>`).join('');
  $('#m-settings').innerHTML=ICON.settings;
  const ss=$('#store-state');ss.className='store-state'+(S.mode==='cloud'?' cloud':'');ss.querySelector('span').textContent=S.mode==='cloud'?'Synchronisé':S.mode==='local'?'Sauvegarde locale':'Connexion…'}
function renderMain(force){
  const main=$('#main');const ae=document.activeElement;
  if(!force&&((sw&&sw.drag)||(ae&&main.contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.type!=='checkbox'&&ae.type!=='file'))){pending=true;return}
  if(!ready()){main.innerHTML='<div class="boot"><p>Ouverture de ton espace…</p></div>';return}
  const keep=ae&&ae.id&&main.contains(ae)?ae.id:null;
  const fn={today:viewToday,okr:viewOKR,habits:viewHabits,review:viewReview,studio:viewStudio,settings:viewSettings}[S.tab]||viewToday;
  main.innerHTML=fn();
  if(!archived)setTimeout(autoArchive,0);
  if(S.tab==='studio'&&S.studio==='idees')filterIdeas();
  if(keep){const el=document.getElementById(keep);if(el)el.focus()}}
document.addEventListener('focusout',()=>{if(pending){pending=false;setTimeout(()=>{const ae=document.activeElement;if(!(ae&&$('#main').contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))renderMain()},0)}});
function setTab(k){S.tab=k;renderShell();renderMain(true);window.scrollTo(0,0);const t=TABS.find(x=>x.k===k);try{history.replaceState(null,'','#'+(t?t.hash:'reglages'))}catch(e){}}
function filterIdeas(){const q=S.ideaQuery.trim().toLowerCase();document.querySelectorAll('#idea-list .idea').forEach(el=>{el.hidden=!!q&&!el.dataset.text.includes(q)})}
let toastT;function toast(m){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2800)}

/* ---------- Liaison des champs ---------- */
function setPath(o,path,v){const ks=path.split('.');let c=o;for(let i=0;i<ks.length-1;i++){const k=ks[i],nk=ks[i+1];if(c[k]==null||typeof c[k]!=='object')c[k]=/^\d+$/.test(nk)?[]:{};c=c[k]}c[ks[ks.length-1]]=v}
function bindChange(el){const[coll,id,path]=el.dataset.bind.split(':');let v;
  if(el.type==='checkbox')v=el.checked;else if(el.dataset.type==='number')v=el.value===''?null:+el.value;else v=el.value;
  let base=coll==='settings'?settings():S.data[coll][id];
  if(!base&&coll==='reviews')base={week:id,monday:S.reviewWeek,createdAt:nowIso()};
  if(!base)return;
  let doc=JSON.parse(JSON.stringify(clean(base)));setPath(doc,path,v);doc.updatedAt=nowIso();
  if(coll==='videos'&&path==='stage'&&base.stage!==v){doc.stageLog=[...(base.stageLog||[]),{stage:v,date:today()}];if(v==='publie'&&(!doc.publishDate||doc.publishDate>today()))doc.publishDate=today()}
  if(coll==='krs'&&path==='current')doc=withHistory(doc);
  if(coll==='objectives'&&path==='videoId'&&v){const vid=S.data.videos[v];const t=S.data.templates[base.fromTemplate];const plain=(t&&t.objTitle)||'Vidéo';if(vid&&(!base.title||base.title.trim()===plain))doc.title=`${plain} ${vid.title||''}`.trim()}
  if(coll==='krs'&&path==='done')doc.doneAt=v?today():null;
  put(coll,id,doc);
  if(coll==='krs'&&path==='title'){const h=S.data.habits[doc.habitId];if(h&&h.fromKr===id)put('habits',h.id,{...h,name:String(v).trim()})}
  if(S.sheet&&(['stage','publishDate','complexity','habitId','target','identityId','weekTarget','unit','done','videoId'].includes(path)||(coll==='templates'&&/kind$|video$/.test(path))))setTimeout(()=>{const f=document.activeElement&&document.activeElement.id;renderSheet();if(f){const e2=document.getElementById(f);if(e2)e2.focus()}},0)}
document.addEventListener('change',e=>{const el=e.target;if(el.id==='import-file'){readImport(el);return}if(el.dataset&&el.dataset.link==='habit-obj'){linkHabit(el.dataset.id,el.value);return}if(el.dataset&&el.dataset.bind)bindChange(el)});
document.addEventListener('input',e=>{if(e.target.id==='idea-q'){S.ideaQuery=e.target.value;filterIdeas()}});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form==='qty'){e.preventDefault();const k=S.data.krs[f.dataset.id];const inp=f.querySelector('input[type=number]');const amt=+inp.value;if(!k||inp.value===''||!isFinite(amt)||!amt)return;const dIn=f.querySelector('input[name=date]');const d=(dIn&&dIn.value)||f.dataset.date||today();const log={...(k.log||{})};log[d]=(+log[d]||0)+amt;put('krs',k.id,{...k,log,updatedAt:nowIso()});toast(`${signed(amt,k.unit||'')} · ${krTitle(k)}`);if(S.sheet)renderSheet();else{S.qtyOpen=null;renderMain(true)}return}if(f.dataset.form==='todo'){e.preventDefault();const inp=$('#todo-new');const txt=inp.value.trim();if(!txt)return;const t=today();saveTodos(t,[...todoItems(t),{id:uid(),text:txt,done:false}]);inp.value='';renderMain(true);const n=$('#todo-new');if(n)n.focus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet();if(e.key==='Enter'&&S.sheet&&e.target.tagName==='INPUT'&&e.target.type!=='file')e.target.blur()});

/* ---------- Glissement des habitudes & lecture des courbes ---------- */
document.addEventListener('pointerdown',e=>{const fg=e.target.closest&&e.target.closest('.swipe-fg');if(!fg||e.button>0)return;sw={fg,el:fg.parentElement,x:e.clientX,y:e.clientY,id:e.pointerId,drag:false,dx:0}});
document.addEventListener('pointermove',e=>{
  if(sw&&e.pointerId===sw.id){const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
    if(!sw.drag){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3){sw.drag=true;try{sw.fg.setPointerCapture(e.pointerId)}catch(_){}sw.fg.style.transition='none'}else if(Math.abs(dy)>12){sw=null;return}else return}
    const done=sw.el.dataset.done==='1';const thr=Math.min(110,sw.el.offsetWidth*.28);
    const lim=(dx>0&&done)||(dx<0&&!done)?Math.sign(dx)*Math.min(Math.abs(dx)*.25,30):dx;
    sw.dx=dx;sw.fg.style.transform=`translateX(${lim}px)`;sw.el.dataset.dir=dx>=0?'r':'l';
    sw.el.classList.toggle('go',dx>thr&&!done);sw.el.classList.toggle('back',dx<-thr&&done);return}
  const hit=e.target.closest&&e.target.closest('.c-hit');if(hit)scrub(hit.parentElement,e.clientX)});
function swEnd(e){if(!sw||e.pointerId!==sw.id)return;const s=sw;sw=null;if(!s.drag)return;swAt=Date.now();s.fg.style.transition='';s.fg.style.transform='';
  const done=s.el.dataset.done==='1';const thr=Math.min(110,s.el.offsetWidth*.28);s.el.classList.remove('go','back');
  if((s.dx>thr&&!done)||(s.dx<-thr&&done)){toggleHabit(s.el.dataset.swipe,s.el.dataset.date);try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}}
  if(pending){pending=false;schedule()}}
document.addEventListener('pointerup',swEnd);document.addEventListener('pointercancel',swEnd);
document.addEventListener('pointerout',e=>{const hit=e.target.closest&&e.target.closest('.c-hit');if(hit&&!hit.contains(e.relatedTarget))unscrub(hit.parentElement)});

  'new-idea':()=>{const id=create('ideas',{text:'',category:S.ideaCat!=='Tout'?S.ideaCat:'Question philo',status:'',tier:'',notes:''});openSheet('idea','ideas',id,true)},
  'edit-idea':a=>openSheet('idea','ideas',a.dataset.id),
  'idea-to-video':a=>{const i=S.data.ideas[a.dataset.id];if(!i)return;const vid=create('videos',{title:i.text||'',oeuvre:i.category==='Manga'?i.text:'',subject:i.category==='Manga'?'':i.text,notes:i.notes||'',stage:'idee',complexity:'lourde',stageLog:[{stage:'idee',date:today()}],loops:[],titles:['','',''],filters:{},stats:{},fromIdea:i.id});put('ideas',i.id,{...i,videoId:vid});openSheet('video','videos',vid);toast('Vidéo créée dans le pipeline')},
  'arm':a=>{if(a.dataset.armed){ACT[a.dataset.next](a);return}a.dataset.armed='1';a.textContent='Confirmer la suppression';setTimeout(()=>{if(a.isConnected)delete a.dataset.armed},5000)},
  'del-identity':a=>{const id=a.dataset.id;for(const o of list('objectives').filter(o=>o.identityId===id)){krsOf(o.id).forEach(k=>removeKr(k.id));del('objectives',o.id)}del('identities',id);S.sheet=null;closeSheet()},
  'del-objective':a=>{krsOf(a.dataset.id).forEach(k=>removeKr(k.id));del('objectives',a.dataset.id);S.sheet=null;closeSheet()},
  'del-kr':a=>{removeKr(a.dataset.id);S.sheet=null;closeSheet()},
  'del-habit':a=>{const id=a.dataset.id;list('krs').filter(k=>k.habitId===id&&kindOf(k)==='habit').forEach(k=>del('krs',k.id));del('habits',id);S.sheet=null;closeSheet()},
  'del-video':a=>{del('videos',a.dataset.id);S.sheet=null;closeSheet()},
  'del-idea':a=>{del('ideas',a.dataset.id);S.sheet=null;closeSheet()},
  'export':()=>exportData(),
  'sign-out':()=>{if(window.DQ_BACKEND&&window.DQ_BACKEND.signOut)window.DQ_BACKEND.signOut()},
  'import-go':()=>runImport(),
  'import-cancel':()=>{S.pendingImport=null;renderMain(true)}
};
document.addEventListener('click',e=>{if(Date.now()-swAt<350&&e.target.closest('.swipe')){e.preventDefault();return}const a=e.target.closest('[data-act]');if(!a||a.tagName==='A')return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a,e)}});

/* Glisser-déposer du pipeline */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move';c.classList.add('dragging')});
document.addEventListener('dragend',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(c)c.classList.remove('dragging');document.querySelectorAll('.kcol.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col)return;e.preventDefault();document.querySelectorAll('.kcol.over').forEach(x=>{if(x!==col)x.classList.remove('over')});col.classList.add('over')});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col)return;e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(id&&S.data.videos[id])setStage(id,col.dataset.drop)});

/* ---------- Export / import ---------- */
async function exportData(){const data=Object.fromEntries(COLLS.map(c=>[c,Object.fromEntries(Object.entries(S.data[c]).map(([k,v])=>[k,clean(v)]))]));const json=JSON.stringify({app:'deviens-qui-tu-es',version:2,exportedAt:nowIso(),data},null,2);const name=`deviens-qui-tu-es-${today()}.json`;
  if(window.claude&&typeof window.claude.use==='function'){let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
    if(dl){try{await dl.save({filename:name,data:json});toast('Export enregistré')}catch(e){if(e&&e.code!=='declined')toast("L'export n'a pas pu être enregistré")}return}}
  try{const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(e){toast("L'export n'est pas disponible ici")}}
function readImport(el){const file=el.files&&el.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const d=j.data||j;let count=0;for(const c of COLLS)if(d[c]&&typeof d[c]==='object')count+=Object.keys(d[c]).length;if(!count)throw new Error('vide');S.pendingImport={data:d,count};renderMain(true)}catch(e){toast("Ce fichier n'est pas un export valide de l'application")}el.value=''};r.readAsText(file)}
async function runImport(){const d=S.pendingImport&&S.pendingImport.data;if(!d)return;S.pendingImport=null;let n=0;
  for(const c of COLLS){const m=d[c];if(!m||typeof m!=='object')continue;for(const[id,doc] of Object.entries(m)){if(!doc||typeof doc!=='object')continue;const cd=clean(doc);S.data[c]={...S.data[c],[id]:{...cd,id}};if(db){try{await db.collection(c).doc(id).set(cd)}catch(e){dbError(e);break}}n++}if(!db)saveLocal(c)}
  S.ver++;toast(`${n} éléments importés`);schedule()}

/* ---------- Démarrage ---------- */
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);const t=TABS.find(x=>x.hash===h);const k=t?t.k:h==='reglages'?'settings':null;if(k&&k!==S.tab){if(S.sheet)closeSheet(true);S.tab=k;renderShell();renderMain(true)}});
(function boot(){const h=(location.hash||'').slice(1);const t=TABS.find(x=>x.hash===h);if(t)S.tab=t.k;else if(h==='reglages')S.tab='settings';renderShell();initStore()})();
</script>

<script type="module">
// Connexion à Firebase : compte e-mail/mot de passe + base Firestore (données sous users/<ton id>/…)
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {initializeFirestore,getFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot,query,where} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const B=window.DQ_BACKEND,$=id=>document.getElementById(id);B.loaded=true;
const showAuth=(msg,err)=>{$('auth').hidden=false;if(msg)$('auth-msg').textContent=msg;$('auth-err').textContent=err||''};
const ERR={'auth/invalid-credential':'E-mail ou mot de passe incorrect.','auth/wrong-password':'E-mail ou mot de passe incorrect.','auth/user-not-found':'Aucun compte avec cet e-mail : crée-le d’abord.','auth/email-already-in-use':'Un compte existe déjà avec cet e-mail : connecte-toi.','auth/weak-password':'Mot de passe trop court : 6 caractères minimum.','auth/invalid-email':'Cet e-mail n’est pas valide.','auth/missing-password':'Saisis ton mot de passe.','auth/network-request-failed':'Pas de connexion internet. Réessaie dès que tu es en ligne.','auth/too-many-requests':'Trop de tentatives. Patiente quelques minutes.','auth/operation-not-allowed':'Active « E-mail/Mot de passe » dans Firebase → Authentication.','auth/admin-restricted-operation':'La création de compte est désactivée dans Firebase.'};
const say=e=>{$('auth-err').textContent=ERR[e&&e.code]||('Erreur : '+((e&&e.message)||'inconnue'))};
const cfg=window.FIREBASE_CONFIG||{};
if(cfg.apiKey){
  const app=initializeApp(cfg);
  let fs;try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()}),ignoreUndefinedProperties:true})}catch(e){fs=getFirestore(app)}
  const auth=getAuth(app);let started=false;
  const makeApi=uid=>{const wrap=(c,qq)=>({
      where:(f,op,v)=>wrap(c,query(qq,where(f,op,v))),
      onSnapshot:(next,err)=>onSnapshot(qq,s=>next({docs:s.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()}))}),e=>err&&err({code:e.code==='permission-denied'?'revoked':'unavailable',message:e.message})),
      doc:id=>{const r=doc(fs,'users',uid,c,id);return{set:d=>setDoc(r,d),delete:()=>deleteDoc(r)}}});
    return{collection:c=>wrap(c,collection(fs,'users',uid,c))}};
  onAuthStateChanged(auth,u=>{
    if(u){$('auth').hidden=true;B.user=u.email;if(!started){started=true;B._resolve(makeApi(u.uid))}}
    else{if(started){location.reload();return}showAuth()}});
  B.signOut=()=>signOut(auth);
  const creds=()=>[$('auth-email').value.trim(),$('auth-pass').value];
  $('auth-form').addEventListener('submit',e=>{e.preventDefault();$('auth-err').textContent='';signInWithEmailAndPassword(auth,...creds()).catch(say)});
  $('auth-create').addEventListener('click',()=>{$('auth-err').textContent='';createUserWithEmailAndPassword(auth,...creds()).catch(say)});
  $('auth-reset').addEventListener('click',()=>{const m=creds()[0];if(!m){$('auth-err').textContent='Saisis ton e-mail, puis touche « Mot de passe oublié ».';return}sendPasswordResetEmail(auth,m).then(()=>{$('auth-err').textContent='E-mail de réinitialisation envoyé.'}).catch(say)});
}
</script>
