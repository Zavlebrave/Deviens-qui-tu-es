<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deviens">
<title>Deviens qui tu es</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.auth{position:fixed;inset:0;z-index:80;background:var(--bg,#000);color:var(--fg,#fff);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.auth-box{width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.auth-box .brand{padding:0;font-size:26px;margin-bottom:4px}
.auth-err{color:var(--neg,#ff4d43);font-size:14px;min-height:20px}
</style>
</head>
<body>

<div id="auth" class="auth" hidden>
  <form id="auth-form" class="auth-box" novalidate>
    <div class="brand">Deviens qui tu es</div>
    <p class="note" id="auth-msg">Connecte-toi pour retrouver ton espace sur tous tes appareils.</p>
    <div id="auth-fields" style="display:flex;flex-direction:column;gap:14px">
      <label class="field"><span>E-mail</span><input id="auth-email" type="email" autocomplete="username" required></label>
      <label class="field"><span>Mot de passe</span><input id="auth-pass" type="password" autocomplete="current-password" minlength="6" required></label>
      <button class="btn" type="submit">Se connecter</button>
      <button class="btn-sec" type="button" id="auth-create">Créer mon compte</button>
      <button class="link" type="button" id="auth-reset" style="align-self:flex-start">Mot de passe oublié</button>
    </div>
    <p class="auth-err" id="auth-err" role="alert"></p>
  </form>
</div>
<script>window.DQ_BACKEND={};window.DQ_BACKEND.ready=new Promise(r=>{window.DQ_BACKEND._resolve=r});</script>
<script src="firebase-config.js"></script>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){const cfg=window.FIREBASE_CONFIG||{};const box=document.getElementById('auth');const msg=document.getElementById('auth-msg');const fields=document.getElementById('auth-fields');
  if(!cfg.apiKey){box.hidden=false;fields.hidden=true;msg.textContent='Configuration Firebase manquante : remplis le fichier firebase-config.js.';return}
  setTimeout(()=>{if(!window.DQ_BACKEND.loaded){box.hidden=false;fields.hidden=true;msg.textContent='Impossible de joindre Firebase pour l’instant. Vérifie ta connexion internet, puis recharge la page.'}},12000)})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Direction visuelle sombre (book v1, U08-U10), réglée sur les maquettes « Voyageur » : fond bleu nuit, surfaces
   légèrement différenciées, accent bleu pour les actions et la sélection. Le vert, l'orange et le rouge ne portent que des statuts.
   Le thème reste sombre quel que soit le réglage du système (D13). */
:root{
  --bg:#0D1117; --side:#0F131A; --surface:#151A22; --surface-2:#1C222B; --surface-3:#29303C; --line:#222935; --line-2:#2D3543;
  --fg:#F2F5F9; --muted:#AEB8C6; --faint:#808CA0;
  --pos:#52E397; --neg:#FD5661; --warn:#F99A45; --over:#2ED3DC;
  --accent:#4562F2; --accent-h:#3A55E0; --accent-ink:#FFFFFF; --accent-2:#7FA0FF; --accent-bg:#1A213B;
  --ph-angle:#8E9AAF; --ph-recherche:#4C7DFF; --ph-ecriture:#9B6BFF; --ph-packaging:#E8B10E; --ph-voix:#19B9A8; --ph-montage:#FF7A45;
  --f:"Outfit",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --ft:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)} .faint{color:var(--faint)} .sm{font-size:13px}
.up{color:var(--pos)} .down{color:var(--neg)}
.eyebrow{font-size:14px;color:var(--muted);font-weight:500}
.cap::first-letter{text-transform:uppercase}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:32px;padding:32px 16px 24px calc(20px + env(safe-area-inset-left,0px))}
.brand{font-size:18px;font-weight:700;letter-spacing:-.02em;padding:0 12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:999px;color:var(--muted);font-weight:600;text-align:left}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--surface-2)}
.nav svg{width:20px;height:20px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.store-state{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:0 12px}
.store-state i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.store-state.cloud i{background:var(--pos)}
main{min-width:0;width:100%;max-width:1080px;padding-block:36px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:820px){main{padding-left:32px;padding-right:max(48px,env(safe-area-inset-right,0px))}}
.mtop,.tabbar{display:none}
@media (max-width:819px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;justify-content:space-between;background:var(--bg);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .mtop .brand{padding:0;font-size:17px}
  main{padding-block:12px 120px}
  .tabbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;min-width:0;color:var(--faint);font-weight:600}
  .tabbar button[aria-current="page"]{color:var(--fg)}
  .tabbar svg{width:23px;height:23px}
}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--fg)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:21px;height:21px}

/* Page head & hero */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.h1{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.hero{display:flex;flex-direction:column;gap:6px;margin-top:20px}
.hero-v{font-size:clamp(44px,8vw,60px);font-weight:600;letter-spacing:-.045em;line-height:1}
.hero-v small{font-size:.5em;color:var(--muted);letter-spacing:-.02em;font-weight:500}
.hero-d{font-size:15px;font-weight:500;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;min-height:22px}
.chart{position:relative;height:190px;margin:22px 0 14px;user-select:none}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.l-act{fill:none;stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.l-act.up{stroke:var(--pos)} .l-act.down{stroke:var(--neg)}
.l-exp{fill:none;stroke:var(--faint);stroke-width:1.4;stroke-dasharray:2 5;vector-effect:non-scaling-stroke;stroke-linecap:round}
.c-dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:currentColor;pointer-events:none}
.c-dot.up{color:var(--pos)} .c-dot.down{color:var(--neg)}
@media (prefers-reduced-motion:no-preference){.c-dot.live::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:currentColor;opacity:.25;animation:pulse 2s ease-out infinite}@keyframes pulse{from{transform:scale(.5);opacity:.45}to{transform:scale(1.6);opacity:0}}}
.c-scrub{position:absolute;top:-6px;bottom:-6px;width:1px;margin-left:-.5px;background:var(--muted);pointer-events:none}
.c-hit{position:absolute;inset:-6px 0;cursor:crosshair;touch-action:pan-y}
.c-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:14px;text-align:center}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills button{height:34px;padding:0 15px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px}
.pills button:hover{color:var(--fg)}
.pills button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.qnav{display:inline-flex;align-items:center;gap:2px}
.qnav b{min-width:84px;text-align:center;font-weight:600}
.qnav button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.qnav button:hover{background:var(--surface-2)}

/* Sections & lists */
.sec{margin-top:44px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.sec-h h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.sec-h .act{color:var(--muted);font-weight:600;font-size:14px}
.sec-h .act:hover{color:var(--fg)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 56px}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 0;width:100%;text-align:left}
.row-l{display:flex;align-items:center;gap:14px;min-width:0;text-align:left}
.row .m{display:flex;flex-direction:column;min-width:0;gap:1px}
.row .t{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:1px;white-space:nowrap}
.row .r b{font-size:16px;font-weight:500}
.row .r span{font-size:13px;font-weight:500}
button.row:hover .t,.row-l:hover .t{text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.av{--c:#8E9AAF;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;line-height:1;background:color-mix(in srgb,var(--c) 22%,var(--surface-2));color:var(--fg);font-weight:600;flex:none}
.av.sm{width:36px;height:36px;font-size:17px}
.av.lg{width:64px;height:64px;font-size:30px}
.av.txt{font-size:16px}
.empty{color:var(--muted);font-size:15px;line-height:1.55;padding:10px 0}
.empty-state{padding:40px 0;display:flex;flex-direction:column;align-items:flex-start;gap:14px;max-width:560px}
.empty-state h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.note{font-size:15px;color:var(--muted);line-height:1.6;max-width:66ch}

/* Buttons & tags */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.btn-sec{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;background:var(--surface-2);color:var(--fg);font-weight:600;font-size:14px;white-space:nowrap}
.btn-sec:hover{background:var(--surface-3)}
.btn-danger{color:var(--neg)}
.link{color:var(--fg);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.add{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:15px;font-weight:600;padding:10px 0}
.add:hover{color:var(--fg)}
.add i{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--fg)}
.add svg{width:16px;height:16px}
.tag{font-size:13px;font-weight:600;white-space:nowrap}
.tag.pos{color:var(--pos)} .tag.neg{color:var(--neg)} .tag.warn{color:var(--warn)} .tag.mut{color:var(--muted)}
.bar{position:relative;height:4px;border-radius:999px;background:var(--surface-2);min-width:0}
.bar > i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--fg)}
.bar > b{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--muted);border-radius:2px}

/* Stats row */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:22px}
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .l{font-size:13px;color:var(--muted);font-weight:500}
.stat .v{font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.15}
.stat .v small{font-size:16px;color:var(--muted);font-weight:500}
.stat .s{font-size:13px;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:nth-child(3){grid-column:1/-1}}

/* Swipe rows (habits) */
.swipe{position:relative;overflow:hidden;border-radius:16px;margin:2px 0}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-start;padding:0 22px;font-weight:600;font-size:15px;color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,var(--bg))}
.swipe[data-dir="l"] .swipe-bg{justify-content:flex-end;color:var(--muted);background:var(--surface-2)}
.swipe.go .swipe-bg{background:var(--pos);color:#000}
.swipe.back .swipe-bg{background:var(--neg);color:#fff}
.swipe-fg{position:relative;background:var(--surface);touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.8,.2,1);padding:0 4px;cursor:grab}
.hcheck{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface-3);display:grid;place-items:center;color:transparent;flex:none}
.hcheck svg{width:16px;height:16px}
.hcheck.on{background:var(--pos);border-color:var(--pos);color:#000}
.swipe.done .t{color:var(--muted)}
.hint{font-size:13px;color:var(--faint)}

/* Todo */
.todo-add{display:flex;gap:8px;margin:6px 0 4px}
.todo-add input{flex:1;min-width:0;height:46px;padding:0 18px;border-radius:999px;border:0;background:var(--surface-2)}
.todo li{display:flex;align-items:center;gap:14px;padding:11px 0}
.todo li span{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px}
.todo li.done span{color:var(--faint);text-decoration:line-through}
.x{color:var(--faint);width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.x:hover{color:var(--neg);background:var(--surface-2)}
.x svg{width:14px;height:14px}

/* OKR */
.id-sec{margin-top:52px;scroll-margin-top:24px}
.id-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.id-head h2{font-size:24px;font-weight:700;letter-spacing:-.025em}
.id-head .st{font-size:15px;color:var(--muted)}
.id-meta{margin:14px 0 4px 80px;display:flex;flex-direction:column;gap:6px;max-width:64ch}
@media (max-width:640px){.id-meta{margin-left:0}}
.id-meta p{font-size:14px;color:var(--muted)}
.id-meta p b{color:var(--fg);font-weight:600;margin-right:6px}
.obj{margin:22px 0 0 80px}
@media (max-width:640px){.obj{margin-left:0}}
.obj-h{display:flex;align-items:center;gap:10px;padding:6px 0}
.obj-h button{font-size:17px;font-weight:700;letter-spacing:-.015em;text-align:left}
.obj-h span{font-size:18px}
.kr{padding:6px 0 12px}
.kr .row{grid-template-columns:minmax(0,1fr) auto;padding:6px 0}
.kr .bar{margin-left:50px}
.kr-r{display:flex;align-items:center;gap:12px}
.step{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:18px;line-height:1;color:var(--fg);font-weight:500}
.step:hover{background:var(--surface-3)}
.head-r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pill-mini{height:30px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:600;white-space:nowrap}
.pill-mini:hover{background:var(--surface-3)}
.kr.faded{opacity:.5}
.tpl-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.tpl-f{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:10px}
@media (max-width:480px){.tpl-f{grid-template-columns:minmax(0,1fr)}}
.tpl-item .x{margin-top:30px}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;margin-top:10px}
.wk{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border-radius:14px;background:var(--surface);min-width:60px}
.wk span{font-size:11px;color:var(--muted);font-weight:600}
.wk b{font-size:14px;font-weight:600}
.wk.on{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--fg)}
.wk:disabled{opacity:.35}
.obj-add{display:flex;gap:22px;flex-wrap:wrap}
.qty-form{display:flex;gap:8px;margin:6px 0 4px 50px}
.qty-form input{flex:1;min-width:0;height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--surface-2)}
.qty-form .qdate{flex:0 0 150px}
@media (max-width:640px){.qty-form{margin-left:0;flex-wrap:wrap}.qty-form .qdate{flex:1 1 140px}}
.log li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.log b{font-weight:600}

/* Habits grid */
.hgrid-wrap{overflow-x:auto}
.hgrid{width:100%;border-collapse:collapse;min-width:640px}
.hgrid th,.hgrid td{padding:8px 6px;text-align:center;font-weight:400}
.hgrid th{font-size:12px;color:var(--muted);font-weight:600}
.hgrid th.today{color:var(--fg)}
.hgrid td:first-child,.hgrid th:first-child{text-align:left;padding-left:0}
.hname{display:flex;align-items:center;gap:12px;text-align:left}
.hname b{font-weight:500;display:block}
.hname small{display:block;font-size:12px;color:var(--muted)}
.cell{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:inline-grid;place-items:center;color:transparent}
.cell svg{width:14px;height:14px}
.cell.on{background:var(--pos);color:#000}
.cell.off{background:transparent;border:1.5px dashed var(--surface-3)}
.cell:disabled{opacity:.35}
.idbar{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr) 3rem;align-items:center;gap:14px;padding:8px 0}
.idbar > span{display:flex;align-items:center;gap:10px;min-width:0;font-weight:500}
.idbar > span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idbar b{text-align:right;font-weight:600}

/* Forms & review */
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field > span{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%;min-width:0;padding:12px 14px;border-radius:14px;border:0;background:var(--surface-2)}
.field input,.field select{height:46px}
.field textarea{resize:vertical;min-height:90px;line-height:1.5}
.field .hint{font-size:12px;color:var(--faint)}

function monday(s){const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function isoWeek(s){const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7)+3);const y=d.getFullYear();const f=new Date(y,0,4);f.setDate(f.getDate()-((f.getDay()+6)%7)+3);const w=1+Math.round((d-f)/(7*864e5));return{y,w,key:`${y}-W${pad(w)}`}}
const qKey=s=>{const[y,m]=s.split('-').map(Number);return `${y}-Q${Math.floor((m-1)/3)+1}`};
function qRange(k){const[y,q]=k.split('-Q').map(Number);const sm=(q-1)*3;return{start:ymd(new Date(y,sm,1)),end:ymd(new Date(y,sm+3,0))}}
const qLabel=k=>{const[y,q]=k.split('-Q');return `T${q} ${y}`};
function qShift(k,n){let[y,q]=k.split('-Q').map(Number);q+=n;while(q>4){q-=4;y++}while(q<1){q+=4;y--}return `${y}-Q${q}`}
function dPts(d,suffix){const n=Math.round(d*100);const cls=n>0?'up':n<0?'down':'muted';return `<span class="${cls}">${n>0?'▲ +':n<0?'▼ −':''}${Math.abs(n)} pts</span>${suffix?` <span class="muted">${suffix}</span>`:''}`}

/* ---------- Stockage : base en ligne (claude.ai) ou navigateur ---------- */
let db=null;
const writeQ={};
const clean=d=>{const o={...d};delete o.id;return o};
function loadLocal(){for(const c of COLLS){let raw={};try{raw=JSON.parse(localStorage.getItem('dqte:'+c)||'{}')||{}}catch(e){}S.data[c]=Object.fromEntries(Object.entries(raw).map(([k,v])=>[k,{...v,id:k}]))}S.ver++}
function saveLocal(c){try{localStorage.setItem('dqte:'+c,JSON.stringify(Object.fromEntries(Object.entries(S.data[c]).map(([k,v])=>[k,clean(v)]))))}catch(e){toast("Le navigateur refuse d'enregistrer. Exporte tes données pour ne rien perdre.")}}
function put(c,id,data){if(!id){console.error('Écriture sans identifiant ignorée',c);return}const doc=clean(data);S.data[c]={...S.data[c],[id]:{...doc,id}};S.ver++;schedule();if(db)queueWrite(c,id,doc);else saveLocal(c)}
function del(c,id){if(!id)return;const n={...S.data[c]};delete n[id];S.data[c]=n;S.ver++;schedule();if(db)queueWrite(c,id,null);else saveLocal(c)}
function queueWrite(c,id,data){const k=c+'/'+id;const q=writeQ[k]||(writeQ[k]={running:false,next:undefined});q.next=data;if(!q.running)flush(k,c,id)}
/* Une écriture n'est « synchronisée » qu'une fois confirmée par le serveur ; hors connexion elle reste en attente */
const SYNC={inflight:0,failed:{},online:navigator.onLine!==false};
async function flush(k,c,id){const q=writeQ[k];q.running=true;while(q.next!==undefined){const d=q.next;q.next=undefined;SYNC.inflight++;renderSync();
    try{const ref=db.collection(c).doc(id);if(d===null)await ref.delete();else await ref.set(d);delete SYNC.failed[k]}catch(e){SYNC.failed[k]={c,id,d};dbError(e)}finally{SYNC.inflight--;renderSync()}}q.running=false}
function syncState(){if(S.mode==='local')return['local','Enregistré sur cet appareil','Sur cet appareil'];if(S.mode!=='cloud')return['wait','Connexion…','Connexion…'];
  if(Object.keys(SYNC.failed).length)return['err','Impossible de synchroniser','Erreur'];
  if(!SYNC.online)return['off',SYNC.inflight?'Hors connexion · en attente de synchronisation':'Hors connexion · enregistré sur cet appareil','Hors connexion'];
  if(SYNC.inflight)return['wait','En attente de synchronisation','En attente'];return['ok','Synchronisé','Synchronisé']}
function renderSync(){const[k,l,sh]=syncState();document.querySelectorAll('[data-sync]').forEach(el=>{el.classList.remove('s-ok','s-wait','s-off','s-err','s-local');el.classList.add('store-state','s-'+k);const a=el.querySelector('.lg'),b=el.querySelector('.sh'),btn=el.querySelector('button');if(a)a.textContent=l;if(b)b.textContent=sh;if(btn)btn.hidden=k!=='err'})}
/* F38 : une écriture partielle (incrément, ajout ou retrait dans une liste) se fusionne côté serveur ;
   deux appareils qui ajoutent chacun une quantité conservent les deux ajouts */
function track(pr,c,id){SYNC.inflight++;renderSync();Promise.resolve(pr).then(()=>{delete SYNC.failed[c+'/'+id]},e=>{const cur=S.data[c][id];SYNC.failed[c+'/'+id]={c,id,d:cur?clean(cur):null};dbError(e)}).finally(()=>{SYNC.inflight--;renderSync()})}
function setLocal(c,id,doc){S.data[c]={...S.data[c],[id]:{...doc,id}};S.ver++;schedule()}
function incLog(kid,d,n){const k=S.data.krs[kid];if(!k||!n)return;const r3=x=>Math.round(x*1000)/1000;const log={...(k.log||{})};log[d]=r3((+log[d]||0)+n);const doc={...clean(k),log,updatedAt:nowIso()};setLocal('krs',kid,doc);
  const ref=db&&db.collection('krs').doc(kid);if(ref&&ref.inc)track(ref.inc('log.'+d,n,{updatedAt:doc.updatedAt}),'krs',kid);else if(db)queueWrite('krs',kid,doc);else saveLocal('krs')}
function retrySync(){const f=SYNC.failed;SYNC.failed={};for(const{c,id,d} of Object.values(f))queueWrite(c,id,d);renderSync()}
window.addEventListener('online',()=>{SYNC.online=true;renderSync()});window.addEventListener('offline',()=>{SYNC.online=false;renderSync()});
function dbError(e){const c=e&&e.code;if(c==='quota_exceeded')toast("Stockage plein : supprime d'anciennes données ou exporte-les.");else if(c==='invalid_argument')toast("Cette modification n'a pas pu être enregistrée.");else if(c==='revoked')toast("L'accès en écriture a été retiré pour cette session.");else toast('Enregistrement impossible pour le moment, réessaie dans un instant.')}
async function initStore(){
  let api=null;
  if(window.DQ_BACKEND){try{api=await window.DQ_BACKEND.ready}catch(e){api=null}}
  else try{api=(window.claude&&typeof window.claude.use==='function')?await window.claude.use('db'):null}catch(e){api=null}
  if(!api){S.mode='local';loadLocal();renderShell();schedule();return}
  db=api;S.mode='cloud';renderShell();
  for(const c of COLLS){
    let q=db.collection(c);
    if(c==='todos')q=q.where('date','>=',addDays(today(),-120));
    q.onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]={...d.data(),id:d.id}});S.data[c]=m;S.loaded[c]=true;S.ver++;schedule()},err=>{S.loaded[c]=true;if(err&&err.code!=='revoked')toast('Synchronisation interrompue. Recharge la page.');schedule()});
  }
}

function habitCtl(h,d,row){const st=habitState(h.id,d),nm=esc(h.name||''),mode=hMode(h),on=st==='target',ov=habitOver(h,d);
  const tgt=`<button class="hcheck ${on?'on':''} ${ov?'ov':''}" data-act="habit-set" data-id="${h.id}" data-date="${d}" data-v="target" aria-pressed="${on}" aria-label="${mode==='simple'?'Valider':'Cible atteinte'} : ${nm}">${ICON.check}</button>`;
  if(mode==='qty'){const v=habitVal(h.id,d),tg=qTgt(h);
    return `<span class="hmc"><button class="hqty ${on?(ov?'ov':'on'):st==='min'?'min':v!=null?'part':''}" data-act="hday-open" data-id="${h.id}" data-date="${d}" aria-label="Saisir la quantité : ${nm}">${v!=null?fmtN(v):'+'}${tg?`<small>/${fmtN(tg)}</small>`:''}</button>${tgt}</span>`}
  if(mode==='tiers'&&!(row&&on))return `<span class="hmc"><button class="hmin ${st==='min'?'on':''}" data-act="habit-set" data-id="${h.id}" data-date="${d}" data-v="min" aria-pressed="${st==='min'}" aria-label="Minimum réalisé : ${nm}">Min</button>${tgt}</span>`;
  return tgt}
/* Date de départ du suivi (Réglages → Repartir de zéro) : rien n'est attendu ni manqué avant elle */
const startDay=()=>((S.data.settings||{}).main||{}).startDate||'';
const hStart=h=>{const c=(h.createdAt||'2000-01-01').slice(0,10),sd=startDay();return sd&&sd>c?sd:c};
const weekCount=(h,mon)=>habitCount(h.id,mon,addDays(mon,6));
function weekExpected(h,mon){const sun=addDays(mon,6);if(hStart(h)>sun)return 0;return freqOf(h)==='weekly'?(h.perWeek||3):occurrences(h,maxD(mon,hStart(h)),sun)}
/* Série recalculée à partir des faits (F23) : cible ou minimum = continuité et +1 (D07) ; un jour prévu manqué l'interrompt.
   Les jours non prévus ne comptent pas. Unité : jours, fois (jours précis) ou semaines. Plus de justification depuis le 29 octobre. */
function streakOf(h){const t=today(),st=hStart(h),pw=h.perWeek||3;let n=0,frozen=false;
  if(freqOf(h)==='weekly'){const ok=m=>{const sun=addDays(m,6);return habitCount(h.id,m,sun)+minCount(h.id,m,sun)>=pw};let mon=monday(t);if(ok(mon)){n++;first=false}mon=addDays(mon,-7);
    for(let i=0;i<260&&addDays(mon,6)>=st;i++,mon=addDays(mon,-7)){if(ok(mon)){n++;continue}break}
    return{n,frozen,unit:n>1?'semaines':'semaine'}}
  let d=t;if(fixedOn(h,d)&&habitState(h.id,d)==='none')d=addDays(d,-1);
  for(let i=0;i<900&&d>=st;i++,d=addDays(d,-1)){if(!fixedOn(h,d))continue;if(habitState(h.id,d)!=='none'){n++;continue}break}
  return{n,frozen,unit:freqOf(h)==='daily'?(n>1?'jours':'jour'):'fois'}}
function streakTxt(h){const x=streakOf(h);return `🔥 ${x.n} ${x.unit}`}
/* Taux de réussite sur les occasions prévues ; les minimums sont affichés à part */
function rate30Txt(h){const t=today();const a=maxD(addDays(t,-29),hStart(h));const exp=occurrences(h,a,t);if(!exp)return '30 derniers jours : rien de prévu';const c=habitCount(h.id,a,t),mi=minCount(h.id,a,t);
  return `30 derniers jours : ${pctS(Math.min(1,c/exp))} (${c} sur ${exp} prévu${exp>1?'s':''})${mi?` · ${plural(mi,'minimum')}`:''}`}
function rate30(h){const t=today();const a=maxD(addDays(t,-29),hStart(h));const exp=occurrences(h,a,t);if(!exp)return null;return Math.min(1,habitCount(h.id,a,t)/exp)}
function dayScore(d){let den=0,dn=0;for(const h of trackerHabits()){if(d<hStart(h))continue;const done=habitDone(h.id,d);if(freqOf(h)==='weekly'){den+=(h.perWeek||3)/7;if(done)dn+=1}else if(fixedOn(h,d)){den++;if(done)dn++}}return den?Math.min(1,dn/den):null}
function weekStats(mon){const t=today();let sc=0,dn=0;const votes={};const tk=new Set(trackerHabits().map(h=>h.id));
  for(const h of habits()){const end=minD(addDays(mon,6),t);if(end<mon)continue;const c=habitCount(h.id,mon,end);votes[h.identityId||'_']=(votes[h.identityId||'_']||0)+c;if(!tk.has(h.id))continue;
    if(freqOf(h)==='weekly'){if(addDays(mon,6)>=hStart(h)){sc+=(h.perWeek||3);dn+=Math.min(c,h.perWeek||3)}}else{const a=maxD(mon,hStart(h));const e=occurrences(h,a,end);sc+=e;dn+=Math.min(c,e)}}
  const days=[...Array(7)].map((_,i)=>addDays(mon,i));let td=0,tt=0;for(const d of days){const it=todoItems(d);tt+=it.length;td+=it.filter(x=>x.done).length}
  const moves=[];for(const v of videos()){const lg=v.stageLog||[];lg.forEach((l,i)=>{if(i>0&&l.date>=mon&&l.date<=days[6]&&stageIdx(l.stage)>stageIdx(lg[i-1].stage))moves.push({v,...l})})}
  let pt=0,pd=0,fm=0;for(const d of days){if(d>t||!dayOf(d).prio)continue;const x=prioInfo(d);if(!x||x.missing)continue;pt++;if(x.done)pd++;fm+=+x.p.spent||0}
  return{rate:sc?dn/sc:null,done:dn,sched:sc,votes,todosDone:td,todosTotal:tt,moves,priosTotal:pt,priosDone:pd,focusMin:fm}}

const todoItems=s=>((S.data.todos[s]||{}).items||[]);
function saveTodos(s,items){put('todos',s,{date:s,items})}

/* ---------- Journée : sommeil, énergie et humeur du matin (mêmes choix que le tableau « Days » de Notion) ---------- */
const SLEEP=[[5,'🌕','Excellent'],[4,'🌔','Bon'],[3,'🌓','Moyen'],[2,'🌒','Mauvais'],[1,'🌑','Très mauvais']];
const sleepOf=n=>SLEEP.find(x=>x[0]===n);
const ENERGY=[[5,'⚡','Ultra','Ultra énergétique'],[4,'💪','Motivé','Motivé · bonne énergie'],[3,'⚖️','Stable','Équilibré · stable'],[2,'🐢','Fatigué','Fatigué · lourd et lent'],[1,'🪫','KO','Épuisé · KO']];
const MOODS=['🤩','🙂','😐','😠','😔'];
const dayOf=d=>S.data.days[d]||{};
const energyOf=n=>ENERGY.find(x=>x[0]===n);
function setDay(d,patch){const b=S.data.days[d];put('days',d,{...(b?clean(b):{}),date:d,...patch,updatedAt:nowIso()})}
function weekMood(mon){const days=[...Array(7)].map((_,i)=>addDays(mon,i));const vals=f=>days.map(d=>dayOf(d)[f]).filter(n=>n>0);const mean=f=>{const v=vals(f);return v.length?avg(v):null};
  return{days,avg:mean('energy'),sleep:mean('sleep'),nE:vals('energy').length,nS:vals('sleep').length}}

/* ---------- Studio ---------- */
const stageIdx=k=>Math.max(0,STAGES.findIndex(s=>s.k===k));
const publishedBetween=(a,b)=>videos().filter(v=>v.stage==='publie'&&v.publishDate&&v.publishDate>=a&&v.publishDate<=b);
const publishedInYear=y=>publishedBetween(`${y}-01-01`,`${y}-12-31`);
function plan(v){if(!v.publishDate)return null;const st=settings();const f=st.complexity[v.complexity||'lourde']??1;let end=addDays(v.publishDate,-(+st.phases.marge||0));const out={};
  for(const p of [...PHASES].reverse()){const d=Math.max(1,Math.round((+st.phases[p.k]||0)*f));const start=addDays(end,-d);out[p.k]={start,end};end=start}
  out.packaging={start:out.recherche.start,end:out.ecriture.end};out.start=out.angle.start;return out}
function deadline(v,p){p=p||plan(v);if(!p)return null;const m={idee:p.angle.start,angle:p.angle.end,recherche:p.recherche.end,ecriture:p.ecriture.end,packaging:p.ecriture.end,voix:p.voix.end,montage:p.montage.end};const d=m[v.stage];return d?addDays(d,-1):null}
/* F35 : travail restant estimé par phase, en heures ; le temps qui passe ne le réduit pas tout seul */
const PH_ALL=()=>[...PHASES,{k:'packaging',label:'Titre & miniature'}];
const phaseDone=(v,k)=>stageIdx(v.stage)>stageIdx(k);
function remainingHours(v,k){if(v.stage==='publie')return 0;const r=v.remaining||{};if(k)return +r[k]||0;return PH_ALL().reduce((s,ph)=>s+(phaseDone(v,ph.k)?0:(+r[ph.k]||0)),0)}
/* F36 : « Échéance aujourd'hui » le jour même, puis le retard daté avec les heures restantes estimées */
function videoStatus(v){if(v.stage==='publie')return{k:'pos',t:'Publiée'};const p=plan(v);if(!p)return{k:'mut',t:'Sans date'};const dl=deadline(v,p);if(!dl)return{k:'mut',t:''};const late=diffDays(dl,today());
  const rem=remainingHours(v,v.stage)||remainingHours(v);const ph=STAGE_LABEL[v.stage]||'';
  if(late>0)return{k:'neg',t:`${ph} : ${late} jour${late>1?'s':''} de retard${rem?` · ${fmtN(rem)} h restantes estimées`:''}`};
  if(late===0)return{k:'warn',t:`Échéance aujourd'hui${rem?` · ${fmtN(rem)} h restantes`:''}`};if(late>-4)return{k:'warn',t:`Échéance le ${fmtD(dl)}`};return{k:'pos',t:'Dans les temps'}}
function setStage(id,k){const v=S.data.videos[id];if(!v||v.stage===k)return;const n={...v,stage:k,stageLog:[...(v.stageLog||[]),{stage:k,date:today()}],updatedAt:nowIso()};
  if(k==='publie'&&(!n.publishDate||n.publishDate>today()))n.publishDate=today();put('videos',id,n);
  if(k==='publie')toast('Vidéo publiée : tes preuves « vidéos » sont à jour')}
function ideaScore(i){if(!i.potentiel||!i.envie)return null;return Math.round((+i.potentiel)*(+i.envie)/Math.max(1,+i.effort||3)*10)/10}

/* ---------- Composants ---------- */
const bar=(p,e,color)=>`<div class="bar"><i style="width:${(clamp(p,0,1)*100).toFixed(1)}%${color?`;background:${esc(color)}`:''}"></i>${e!=null?`<b style="left:${(clamp(e,0,1)*100).toFixed(1)}%" title="Attendu à date"></b>`:''}</div>`;
const stat=(l,v,s)=>`<div class="stat"><span class="l">${l}</span><span class="v">${v}</span><span class="s">${s}</span></div>`;
const tag=st=>st&&st.t?`<span class="tag ${st.k||'mut'}">${esc(st.t)}</span>`:'';
const qnav=(act,label)=>`<div class="qnav"><button data-act="${act}" data-d="-1" aria-label="Précédent">${ICON.left}</button><b>${label}</b><button data-act="${act}" data-d="1" aria-label="Suivant">${ICON.right}</button></div>`;
const addBtn=(act,label,attrs='')=>`<button class="add" data-act="${act}" ${attrs}><i>${ICON.plus}</i>${label}</button>`;
const pills=(act,cur,opts,attrs='')=>`<div class="pills" role="group">${opts.map(([k,l])=>`<button data-act="${act}" data-v="${esc(k)}" ${attrs} aria-pressed="${cur===k}">${esc(l)}</button>`).join('')}</div>`;

/* Graphique en ligne façon Trade Republic : courbe réelle + trajectoire attendue en pointillés ; survol ou doigt pour lire une date */
const CH={};
function lineChart(id,{xs,act,exp,y0=0,y1=1,fmtV=pctS,fmtX=null,live=true,good=null,expLabel='attendu'}){
  const n=xs.length;const X=i=>n<=1?500:i/(n-1)*1000;const Y=v=>200-(clamp(v,y0,y1)-y0)/((y1-y0)||1)*200;
  const path=arr=>{let p='';(arr||[]).forEach((v,i)=>{if(v==null)return;p+=(p?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});return p};
  let li=-1;act.forEach((v,i)=>{if(v!=null)li=i});
  if(li<0)return `<div class="chart"><div class="c-empty">Pas encore de données sur cette période</div></div>`;
  const fi=act.findIndex(v=>v!=null);
  const up=good!=null?good:exp?act[li]>=exp[li]-.005:act[li]>=act[fi];
  CH[id]={xs,act,exp,fmtV,fmtX,X,Y,expLabel};
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">${exp?`<path class="l-exp" d="${path(exp)}"/>`:''}<path class="l-act ${up?'up':'down'}" d="${path(act)}"/></svg>
  <i class="c-dot ${up?'up':'down'} ${live?'live':''}" style="left:${(X(li)/10).toFixed(2)}%;top:${(Y(act[li])/2).toFixed(2)}%"></i><i class="c-scrub" hidden></i><i class="c-dot c-sd ${up?'up':'down'}" hidden></i><div class="c-hit" role="img" aria-label="Courbe de progression"></div></div>`}
function scrub(el,clientX){const id=el.dataset.chart;const c=CH[id];if(!c)return;const r=el.getBoundingClientRect();const n=c.xs.length;let i=Math.round(clamp((clientX-r.left)/r.width,0,1)*(n-1));while(i>0&&c.act[i]==null)i--;if(c.act[i]==null)return;
  const sl=el.querySelector('.c-scrub'),sd=el.querySelector('.c-sd');sl.hidden=false;sd.hidden=false;sl.style.left=sd.style.left=(c.X(i)/10)+'%';sd.style.top=(c.Y(c.act[i])/2)+'%';
  const v=$('#'+id+'-v'),d=$('#'+id+'-d');if(v&&!c.orig)c.orig=[v.innerHTML,d?d.innerHTML:''];if(v)v.textContent=c.fmtV(c.act[i]);
  if(d)d.innerHTML=`<span class="muted">${esc(c.fmtX?c.fmtX(c.xs[i]):fmtD(c.xs[i],true))}${c.exp?` · ${esc(c.expLabel||'attendu')} ${esc(c.fmtV(c.exp[i]))}`:''}</span>`}
function unscrub(el){const id=el.dataset.chart;const c=CH[id];if(!c)return;el.querySelector('.c-scrub').hidden=true;el.querySelector('.c-sd').hidden=true;if(c.orig){const v=$('#'+id+'-v'),d=$('#'+id+'-d');if(v)v.innerHTML=c.orig[0];if(d)d.innerHTML=c.orig[1];c.orig=null}}
const hero=(id,label,v,d)=>`<div class="hero"><p class="eyebrow">${label}</p><div class="hero-v" id="${id}-v">${v}</div><div class="hero-d" id="${id}-d">${d}</div></div>`;

/* Ligne d'habitude d'Aujourd'hui : pictogramme, cible, état en deux paliers (minimum puis cible), série et case.
   La barre montre un palier franchi, pas un pourcentage (D07). Glisser la ligne vers la droite valide aussi. */
function planTxt(h){const f=freqOf(h);if(f==='weekly')return `${h.perWeek||3} fois par semaine`;if(f==='daily')return 'Tous les jours';
  const ds=[...(h.days||[])].sort().join('');if(ds==='0123456')return 'Tous les jours';if(ds==='01234')return 'Du lundi au vendredi';if(ds==='56')return 'Le week-end';if(!ds)return 'Aucun jour choisi';
  return (h.days||[]).length===1?`Le ${DAYS_LONG[h.days[0]]}`:`Les ${daysLong(h)}`}
function hRow(h,d){const st=habitState(h.id,d),on=st==='target',past=d<today(),nm=esc(h.name||'Habitude sans nom'),mode=hMode(h),v=mode==='qty'?habitVal(h.id,d):null,ov=habitOver(h,d);
  const sub=[mode==='qty'&&qTgt(h)?`Cible : ${qFmt(h,qTgt(h))}`:h.targetLabel||planTxt(h),freqOf(h)==='weekly'?`${weekCount(h,monday(d))}/${h.perWeek||3} cette semaine`:''].filter(Boolean).join(' · ');
  const two=mode!=='simple',seg=on?(ov?'ov':'ok'):'min';
  const lab=on?(ov?`Au-delà · ${qFmt(h,v)}`:v!=null?`Cible atteinte · ${qFmt(h,v)}`:'Validée'):v!=null?`Minimum · ${qFmt(h,v)}`:'Minimum réalisé';
  const state=st==='none'?(v!=null?`<div class="hst"><span class="chip mut">${esc(qFmt(h,v))}, sous le minimum</span></div>`:`<div class="hst due"><span class="hdue">${past?'Non réalisé':'À faire'}</span></div>`)
    :`<div class="hst"><span class="hbar ${two?'':'one'}" aria-hidden="true">${two?`<i class="${seg}"></i><i class="${on?seg:''}"></i>`:'<i class="ok"></i>'}</span><span class="chip ${on?(ov?'over':'pos'):'warn'}">${esc(lab)}</span></div>`;
  const x=streakOf(h),stk=x.n?`<span class="streak ${x.frozen?'frozen':''}" title="Série${x.frozen?' gelée':''} : ${x.n} ${x.unit}">${ICON.flame}<b>${x.n}</b><span class="u">${x.unit}</span></span>`:'<span class="streak"></span>';
  return `<div class="swipe ${on?'done':''}" data-swipe="${h.id}" data-date="${d}" data-done="${on?1:0}"><div class="swipe-bg">${on?'Annuler':'✓ Fait'}</div>
  <div class="swipe-fg hrow">${av(h.icon,habitColor(h),'',h.name)}<div class="m"><span class="t">${nm}</span><span class="s">${esc(sub)}</span></div>${state}${stk}<div class="hctl">${habitCtl(h,d,true)}</div></div></div>`}

/* ---------- Vue : Aujourd'hui ---------- */
/* Aujourd'hui (U01, maquettes « Voyageur ») : état du matin, priorité, habitudes, tâches, Studio, priorités de la semaine
   et engagements tenus. Une grille de cartes sur ordinateur, une colonne sur téléphone.
   Les flèches de la date remontent dans les jours passés pour les revoir ou les corriger. */
function viewToday(){
  const real=today(),t=S.day&&S.day<real?S.day:real,past=t<real,ago=diffDays(t,real);
  const dateTxt=parse(t).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const items=todoItems(t),done=items.filter(i=>i.done).length;
  const hs=habits().filter(h=>visibleOn(h,t)&&t>=hStart(h)),hd=hs.filter(h=>habitDone(h.id,t)).length;
  const rv=S.data.reviews[isoWeek(real).key]||{};
  const remind=!past&&wd(real)===6&&!(rv.closedAt&&rv.auto===false)?`<section class="sec remind"><div class="sec-h"><h2>C’est dimanche : ta revue</h2></div><p class="note">Fais le bilan de ta semaine (ce qui a marché, ce qui a bloqué, tes 3 priorités), puis clôture-la.</p><div style="margin-top:14px"><button class="btn" data-act="open-review">Faire ma revue</button></div></section>`:'';
  const head=`<header class="today-head"><div class="eyebrow"><button class="dnav" data-act="day-nav" data-d="-1" aria-label="Jour précédent">${ICON.left}</button><span class="cap">${esc(dateTxt)}</span>${past?`<button class="dnav" data-act="day-nav" data-d="1" aria-label="Jour suivant">${ICON.right}</button>`:''}</div>
  <h1 class="h1">${past?(ago===1?'Hier':`Il y a ${ago} jours`):'Aujourd’hui'}</h1>${morningStrip(t)}${past?`<p class="past-note">Tu revois un jour passé : tout reste modifiable. <button class="act" data-act="day-today">Revenir à aujourd’hui</button></p>`:''}</header>`;
  const habitsSec=`<section class="sec td-habits"><div class="sec-h"><h2>Mes habitudes</h2><span class="sec-r">${hs.length?`<span class="cnt">${hd} / ${hs.length}</span>`:''}<button class="chev-btn" data-act="tab" data-tab="habits" aria-label="Ouvrir Habitudes">${ICON.chevR}</button></span></div>
      ${hs.length?`<div class="hlist">${hs.map(h=>hRow(h,t)).join('')}</div>`:`<p class="empty">${past?'Aucune habitude prévue ce jour-là.':'Aucune habitude prévue aujourd’hui. Ajoute-en une dans l’onglet Habitudes.'}</p>`}</section>`;
  const carry=past?[]:carryCandidates(t),yest=addDays(t,-1);
  const todoSec=`<section class="sec td-tasks"><div class="sec-h"><h2>Mes tâches</h2>${items.length?`<span class="cnt">${done} / ${items.length}</span>`:''}</div>
      <div class="tlist">${items.length?`<ul class="todo">${items.map(i=>`<li class="${i.done?'done':''}"><button class="hcheck ${i.done?'on':''}" data-act="todo-toggle" data-id="${i.id}" aria-label="${i.done?'Décocher':'Cocher'} « ${esc(i.text)} »">${ICON.check}</button><span>${esc(i.text)}${i.from?`<small>Reportée du ${fmtD(i.from)}</small>`:''}</span><button class="x" data-act="todo-del" data-id="${i.id}" aria-label="Supprimer « ${esc(i.text)} »">${ICON.x}</button></li>`).join('')}</ul>`:''}
      <form class="tadd" data-form="todo"><button class="plus" type="submit" aria-label="Ajouter la tâche">${ICON.plus}</button><input id="todo-new" placeholder="${past?'Ajouter une tâche à ce jour':'Ajouter une tâche'}" autocomplete="off" aria-label="Nouvelle tâche"></form></div>
      ${items.length?'':`<p class="hint" style="margin-top:10px">${past?'Aucune tâche notée ce jour-là.':'Le matin, note les 3 à 5 tâches qui comptent aujourd’hui.'}</p>`}
      ${carry.length?`<button class="tmore" data-act="carry-open">${ICON.history}<span>${carry.every(c=>c.d===yest)?'Voir les tâches d’hier':'Voir les tâches en attente'} (${carry.length})</span></button>`:''}</section>`;
  return `${head}${remind}<div class="td-grid ${past?'past':''}">${prioCard(t)}${past?'':quarterCard()}${habitsSec}${todoSec}${past?'':studioCard()}<div class="td-side">${weeklyPrios(t)}${engCard(t)}</div></div>`}
/* F01 : une priorité principale par date. Elle référence une tâche, une preuve, une habitude, une priorité de la semaine
   ou une action Studio, sans jamais la recopier. Accomplie, elle le reste : aucune autre n'est imposée à sa place. */
function prioInfo(t){const d=dayOf(t),p=d.prio;if(!p)return null;const miss={p,missing:true,label:p.label||'Élément introuvable',icon:'⭐'};let label='',sub='',done=false,act='',icon='⭐',iid='';
  if(p.kind==='todo'){const it=todoItems(t).find(i=>i.id===p.id);if(!it)return miss;label=it.text;icon='📝';done=!!it.done;act=`<button class="btn" data-act="todo-toggle" data-id="${it.id}">Marquer comme faite</button>`}

  for(const k of weekProofs(mon)){if(idPausedWeek(k.identityId,mon))continue;const kind=kindOf(k),tg=krWeekTarget(k,mon);if(!(tg>0))continue;
    const v=Math.max(0,krWeekValue(k,mon)),r=v/tg,ex=isCur?krWeekExpected(k,mon,t):1,e=ex==null?(isCur?0:1):ex,name=nb[krTitle(k)]>1&&(S.data.objectives[k.objectiveId]||{}).title?`${krTitle(k)} (${S.data.objectives[k.objectiveId].title})`:krTitle(k),u=kind==='qty'?(k.unit||''):'',it={ic:krIcon(k),col:idColor(k.identityId),t:name,n:name};

    const rest=Math.round((tg-v)*10)/10;
    if(isCur){const nd=act<t?1:diffDays(t,act)+1,pd=kind==='qty'&&nd>1?`, soit ${per(Math.ceil(rest/nd*10)/10,u)} par jour`:'';
      tips.push({...it,cat:'qty',due:act,d:`encore ${per(rest,u)}${pd}${dueL}`,t:`${name} : encore ${per(rest,u)}`,p:`${name} : ${per(rest,u)} avant le ${fmtD(act)}`,w:e-r})}
    else{const nt=krWeekTarget(k,addDays(mon,7));tips.push({...it,cat:'qty',due:null,d:nt>0?`vise ${per(nt,u)}${kind==='qty'?', rattrapage inclus':''}${du&&du.src!=='q'?` · échéance ${fmtD(dd)}`:''}`:'à reprendre',t:nt>0?`${name} : vise ${per(nt,u)} la semaine prochaine`:`${name} : à reprendre la semaine prochaine`,p:`${name} : ${per(nt>0?nt:tg,u)}`,w:1-r})}}
  for(const h of trackerHabits()){if(hStart(h)>sun)continue;const it={ic:h.icon,col:habitColor(h),t:h.name||'Habitude',n:h.name||'Habitude'},a=maxD(mon,hStart(h));

      else if(!isCur){bad.push({...it,cat:'hab',days:null,s:`${c} / ${pw} cette semaine`,w:1-c/pw});tips.push({...it,cat:'hab',days:null,d:`vise ${Math.min(pw,c+1)} sur ${pw}`,t:`${it.t} : vise ${Math.min(pw,c+1)} sur ${pw} la semaine prochaine`,p:`${it.t} : ${Math.min(pw,c+1)} fois`,w:1-c/pw})}

    if(isCur){const remD=[];for(let d=t;d<=sun;d=addDays(d,1))if(fixedOn(h,d)&&habitState(h.id,d)==='none')remD.push(d);if(remD.length)tips.push({...it,cat:'hab',days:remD,d:`${remD.length} jour${remD.length>1?'s':''} prévu${remD.length>1?'s':''} restant${remD.length>1?'s':''}`,t:`${it.t} : ne plus rater`,p:`${it.t} : ne plus rater`,w:miss/exp})}
    else{const nx=occurrences(h,addDays(mon,7),addDays(mon,13));if(nx){const goal=Math.min(nx,Math.ceil(ok/exp*nx)+1);tips.push({...it,cat:'hab',days:null,d:`vise ${goal} sur ${nx} (cette semaine ${ok} sur ${exp})`,t:`${it.t} : vise ${goal} sur ${nx} la semaine prochaine`,p:`${it.t} : ${goal} sur ${nx}`,w:miss/exp})}}}

let navLock=false;
const navState=()=>({dq:1,tab:S.tab,day:S.tab==='today'&&S.day?S.day:null,sheet:S.sheet?{kind:S.sheet.kind,coll:S.sheet.coll||null,id:S.sheet.id||null}:null});
const navUrl=st=>{const t=TABS.find(x=>x.k===st.tab);return '#'+(t?t.hash:'reglages')};
function navPush(replace){if(navLock)return;const st=navState();if(JSON.stringify(history.state)===JSON.stringify(st))return;try{history[replace?'replaceState':'pushState'](st,'',navUrl(st))}catch(e){}}
const sheetOnTop=()=>{const h=history.state;return !!(h&&h.dq&&h.sheet)};
/* Fermer depuis l'app (Terminé, fond, Échap, suppression) revient aussi d'une page en arrière */
function dismissSheet(){if(sheetOnTop())history.back();else closeSheet()}
function dropSheet(){S.sheet=null;closeSheet();if(sheetOnTop())history.back()}
window.addEventListener('popstate',e=>{const st=e.state;navLock=true;try{
    const want=st&&st.dq?st.sheet:null;const cur=S.sheet;
    if(cur&&!(want&&want.kind===cur.kind&&want.id===(cur.id||null))){closeSheet(true);if(!want&&S.sheetTrig){S.refocus=S.sheetTrig;S.sheetTrig=null}}
    const nd=st&&st.dq?st.day||null:null;const dayChanged=nd!==S.day;S.day=nd;
    if(st&&st.dq&&st.tab&&st.tab!==S.tab){S.tab=st.tab;renderShell();renderMain(true);window.scrollTo(0,0)}
    else if(dayChanged&&S.tab==='today'){renderMain(true);window.scrollTo(0,0)}
    if(want&&!S.sheet)openSheet(want.kind,want.coll,want.id);
    schedule()}finally{navLock=false}});
function closeSheet(silent){const s=S.sheet;S.sheet=null;$('#sheet').hidden=true;$('#sheet-panel').innerHTML='';if(!silent&&S.sheetTrig){S.refocus=S.sheetTrig;S.sheetTrig=null}
  if(s&&s.isNew&&s.coll){const d=S.data[s.coll][s.id];if(d&&!String(d.title||d.name||d.text||'').trim()){if(s.coll==='krs')removeKr(s.id);else del(s.coll,s.id)}}
  if(!silent)schedule()}

  <section>${iconPicker('identities',id,i.icon)}${F('identities',id,'name','Nom',{ph:'Champion'})}
  <div class="field"><span>Statut</span>${pills('id-status',i.status||'',[['prioritaire','Prioritaire'],['entretenue','Entretenue'],['pause','En pause']],`data-id="${id}"`)}<span class="hint">Prioritaire et entretenue organisent ton attention, sans changer le calcul. En pause : plus aucune attente pour cette identité ; ses objectifs et son historique sont conservés.</span></div>
  ${F('identities',id,'statement','Phrase d’identité',{ph:'Je suis un créateur qui approfondit ses idées et termine ses vidéos.',hint:'Au présent, à la première personne, avec un comportement concret.'})}
  ${F('identities',id,'beliefs','Croyances',{area:1,rows:4,ph:'Une par ligne'})}
  ${F('identities',id,'vision','Vision',{area:1,rows:2,ph:'Où veux-tu en être fin 2027 ?'})}

function sheetKR(id){const k=S.data.krs[id];const kind=kindOf(k);const h=habitOf(k);const q=krQuarter(k);let extra='';

    ${(x=>x>1.2?'<p class="tone-neg" style="margin:4px 0 8px">Cible dépassée : tu peux t’arrêter ici.</p>':'')(krWeekRate(k,mon))}

    <div class="field"><span>Journal · ${fmtN(krValue(k))} / ${fmtN(krTarget(k))} ${esc(k.unit||'')} ce trimestre</span>${log.length?`<ul class="log">${log.map(([d,v])=>`<li><span>${fmtD(d,true)} · sem. ${isoWeek(d).w}</span><b>${signed(+v,k.unit||'')}</b><button class="x" data-act="log-del" data-id="${id}" data-d="${d}" aria-label="Supprimer la saisie du ${fmtD(d)}">${ICON.x}</button></li>`).join('')}</ul>`:'<p class="hint">Rien de saisi pour l’instant.</p>'}</div>`}
  else if(kind==='milestone')extra=`<div class="checks"><label><input type="checkbox" id="kr-done-${id}" data-bind="krs:${id}:done" ${k.done?'checked':''}><span><b>Faite</b>${k.done&&k.doneAt?`Le ${fmtD(k.doneAt,true)}`:'Coche quand l’étape est franchie.'}</span></label></div>

  return sheetTop(esc(krTitle(k)==='Preuve sans titre'?'Nouvelle preuve':krTitle(k)),'Preuve')+`<section>${iconPicker('krs',id,k.icon)}${F('krs',id,'title','Preuve',{ph:'Plan validé'})}</section>
  <section><h3>Comment la mesurer ?</h3><div class="kinds">${KINDS.map(([v,l,d])=>`<button class="kind" data-act="kr-kind" data-id="${id}" data-v="${v}" aria-pressed="${kind===v}"><b>${l}</b><span>${d}</span></button>`).join('')}</div>${howTo(k)}${extra}</section>
  ${delBtn('del-kr',id,h&&h.fromKr===id?'Supprimer la preuve et son habitude':'Supprimer cette preuve')}`}
/* Encadré « Comment ça marche » de la fiche preuve : où elle apparaît, comment elle avance */
function howTo(k){const kind=kindOf(k);const step=(ok,n,html)=>`<li class="${ok?'ok':'todo'}"><i aria-hidden="true">${ok?ICON.check:n}</i><span>${html}</span></li>`;
  const T={qty:['Sur sa ligne dans Identités&nbsp;: <b>−</b> et <b>+</b> (le pas se règle ci-dessous), ou le clavier pour un grand nombre. Elle n’apparaît pas dans Aujourd’hui, sauf choisie comme priorité du jour.','Chaque saisie s’additionne. L’objectif de la semaine se calcule à partir de ce qu’il reste à faire dans le trimestre.'],
    milestone:['Sur sa ligne dans Identités (rond ✓), ou avec la case « Faite » ci-dessous. Elle n’apparaît pas dans Aujourd’hui.','0 ou 100 %. Donne-lui une semaine prévue&nbsp;: elle comptera dans le score de cette semaine.'],
    level:['Sur sa ligne dans Identités, avec <b>−</b> et <b>+</b>, ou dans « Valeur actuelle » ci-dessous. Elle n’apparaît pas dans Aujourd’hui.','Elle avance du point de départ vers l’objectif. Chaque changement est daté.'],
    videos:['Rien à faire&nbsp;: le Studio compte les vidéos publiées.','Ancien type de preuve.']}[kind];
  if(!T)return '';
  return `<div class="howto"><h4>Comment ça marche</h4><dl><dt>Où la remplir</dt><dd>${T[0]}</dd><dt>Comment elle avance</dt><dd>${T[1]}</dd></dl></div>`}
/* Rattraper un oubli : un bouton par jour de la semaine en cours */
function weekToggles(h){const t=today(),mon=monday(t),simple=hMode(h)==='simple';return `<div class="field"><span>Cette semaine · touche un jour pour le saisir</span><div class="days wk">${[...Array(7)].map((_,i)=>{const d=addDays(mon,i),st=habitState(h.id,d);return `<button class="${st==='min'?'min':''}${habitOver(h,d)?' ov':''}" data-act="${simple?'habit-toggle':'hday-open'}" data-id="${h.id}" data-date="${d}" aria-pressed="${st==='target'}" ${d>t||d<hStart(h)?'disabled':''} aria-label="${esc(h.name||'Habitude')} le ${fmtD(d)}">${DAYS[i]}</button>`}).join('')}</div></div>`}
function hModeTxt(h){const m=hMode(h);if(m==='qty')return qTgt(h)?`quantité : ${qFmt(h,qTgt(h))}${qMinOf(h)?`, minimum ${fmtN(qMinOf(h))}`:''}`:'quantité à régler';return m==='tiers'?'minimum et cible':'fait / pas fait'}
function modeEditor(h){const m=hMode(h);
  return `<div class="field"><span>Type de suivi</span>${pills('habit-mode',m,[['simple','Fait / pas fait'],['tiers','Minimum et cible'],['qty','Quantité']],`data-id="${h.id}"`)}<span class="hint">${m==='simple'?'Un appui sur la case la coche, un second l’enlève.':m==='tiers'?'Pour les jours difficiles : le minimum garde ta série, sans compter comme cible atteinte. La case ouvre le choix.':'La case ouvre la saisie de ce que tu as fait. Sous la cible : minimum, en orange, il garde ta série. Au-delà : turquoise.'}</span></div>
  ${m==='tiers'?`<div class="two">${F('habits',h.id,'minLabel','Version minimale',{ph:'2 minutes de lecture'})}${F('habits',h.id,'targetLabel','Cible',{ph:'20 minutes de lecture'})}</div>`:''}
  ${m==='qty'?`<div class="two">${F('habits',h.id,'qTarget','Cible par jour',{type:'number',ph:'20'})}${F('habits',h.id,'qUnit','Unité',{ph:'pages'})}</div>${F('habits',h.id,'qMin','Minimum (facultatif)',{type:'number',ph:'5',hint:'Sans minimum, toute quantité sous la cible compte comme minimum. Avec un minimum, une quantité plus petite est notée mais ne compte pas.'})}`:''}`}
/* F17 / F18 : une étape en retard se replanifie, se réduit ou s'abandonne ; l'abandon demande deux validations */
function msBlock(k){const id=k.id;const hist=[...(k.reschedules||[]).map(x=>({at:x.at,t:`Replanifiée : semaine ${isoWeek(x.from).w} → ${x.to?`semaine ${isoWeek(x.to).w}`:'à planifier'}`})),...(k.scopes||[]).map(x=>({at:x.at,t:`Périmètre réduit : « ${x.from} » → « ${x.to} »`})),...(k.abandoned?[{at:k.abandoned.at,t:`Abandonnée${k.abandoned.reason?` : ${k.abandoned.reason}`:''}`}]:[]),...(k.reactivations||[]).map(x=>({at:x.at,t:'Réactivée'}))].sort((a,b)=>a.at.localeCompare(b.at));
  let out='';
  if(k.abandoned&&!k.done)out+=`<div class="howto"><h4>Abandonnée le ${fmtD(k.abandoned.at,true)}</h4><p style="margin-top:0">${k.abandoned.reason?`Motif : ${esc(k.abandoned.reason)}. `:''}Elle reste dans l’historique ; les semaines où elle était prévue gardent leur constat.</p><div style="margin-top:12px"><button class="btn-sec" data-act="kr-reactivate" data-id="${id}">Réactiver l’étape</button></div></div>`;
  else if(!k.done){const late=msLate(k);
    out+=`<div class="ms-act" id="ms-${id}"><h4>${late?`En retard depuis la semaine ${isoWeek(addDays(msWeek(k),7)).w}`:'Si l’étape ne passe pas'}</h4>${late?'<p class="hint">Elle reste visible tant qu’elle n’est pas faite. Trois options :</p>':''}
    <div class="field"><span>Réduire le périmètre</span><div class="qty-form" style="margin:0"><input id="scope-${id}" placeholder="Nouvelle formulation, plus petite" aria-label="Nouvelle formulation de l’étape"><button class="btn-sec" type="button" data-act="kr-scope" data-id="${id}">Réduire</button></div><span class="hint">L’étape reste à faire, avec sa nouvelle formulation.</span></div>
    <p class="hint">Replanifier : choisis une autre semaine ci-dessus.</p>
    <div><button class="btn-sec btn-danger" data-act="kr-abandon" data-id="${id}">Abandonner l’étape…</button></div></div>`}
  if(hist.length)out+=`<div class="field" style="margin-top:14px"><span>Historique</span><ul class="log">${hist.map(x=>`<li><span>${fmtD(x.at,true)}</span><b style="font-weight:500">${esc(x.t)}</b></li>`).join('')}</ul></div>`;
  return out}
function sheetAbandon(id){const k=S.data.krs[id];const o=S.data.objectives[k.objectiveId]||{};const ab=S.ab&&S.ab.id===id?S.ab:(S.ab={id,step:1,reason:''});
  if(ab.step===2)return sheetTop('Confirmer l’abandon','Étape · 2 / 2')+`<section><div class="howto"><h4>Récapitulatif</h4><dl><dt>Étape</dt><dd>${esc(krTitle(k))}${o.title?` · ${esc(o.title)}`:''}</dd><dt>Motif</dt><dd>${ab.reason?esc(ab.reason):'<span class="faint">Non précisé</span>'}</dd><dt>Conséquence</dt><dd>Cette étape sera conservée dans l’historique avec le statut Abandonnée. Les semaines où elle était prévue gardent leur constat ; elle ne comptera plus dans les semaines suivantes.</dd></dl></div>

  <label class="field" style="margin-top:14px"><span>Pourquoi souhaites-tu abandonner cette étape ?</span><textarea id="ab-reason" rows="3" placeholder="Ce qui a changé">${esc(ab.reason||'')}</textarea></label>

  ${F('videos',id,'refs','Références',{area:1,rows:3,ph:'Livres, vidéos, articles…'})}

function setPath(o,path,v){const ks=path.split('.');let c=o;for(let i=0;i<ks.length-1;i++){const k=ks[i],nk=ks[i+1];if(c[k]==null||typeof c[k]!=='object')c[k]=/^\d+$/.test(nk)?[]:{};c=c[k]}c[ks[ks.length-1]]=v}

  let base=coll==='settings'?settings():S.data[coll][id];

  if(!base)return;

  let doc=JSON.parse(JSON.stringify(clean(base)));setPath(doc,path,v);doc.updatedAt=nowIso();
  if(coll==='videos'&&path==='stage'&&base.stage!==v){doc.stageLog=[...(base.stageLog||[]),{stage:v,date:today()}];if(v==='publie'&&(!doc.publishDate||doc.publishDate>today()))doc.publishDate=today()}

  if(coll==='objectives'&&path==='videoId'&&v){const vid=S.data.videos[v];const t=S.data.templates[base.fromTemplate];const plain=(t&&t.objTitle)||'Vidéo';if(vid&&(!base.title||base.title.trim()===plain))doc.title=`${plain} ${vid.title||''}`.trim()}

document.addEventListener('pointerdown',e=>{const fg=e.target.closest&&e.target.closest('.swipe-fg');if(!fg||e.button>0)return;sw={fg,el:fg.parentElement,x:e.clientX,y:e.clientY,id:e.pointerId,drag:false,dx:0}});
document.addEventListener('pointermove',e=>{
  if(sw&&e.pointerId===sw.id){const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
    if(!sw.drag){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3){sw.drag=true;try{sw.fg.setPointerCapture(e.pointerId)}catch(_){}sw.fg.style.transition='none'}else if(Math.abs(dy)>12){sw=null;return}else return}
    const done=sw.el.dataset.done==='1';const thr=Math.min(110,sw.el.offsetWidth*.28);
    const lim=(dx>0&&done)||(dx<0&&!done)?Math.sign(dx)*Math.min(Math.abs(dx)*.25,30):dx;
    sw.dx=dx;sw.fg.style.transform=`translateX(${lim}px)`;sw.el.dataset.dir=dx>=0?'r':'l';
    sw.el.classList.toggle('go',dx>thr&&!done);sw.el.classList.toggle('back',dx<-thr&&done);return}
  const hit=e.target.closest&&e.target.closest('.c-hit');if(hit)scrub(hit.parentElement,e.clientX)});
function swEnd(e){if(!sw||e.pointerId!==sw.id)return;const s=sw;sw=null;if(!s.drag)return;swAt=Date.now();s.fg.style.transition='';s.fg.style.transform='';
  const done=s.el.dataset.done==='1';const thr=Math.min(110,s.el.offsetWidth*.28);s.el.classList.remove('go','back');

function create(coll,data){const id=uid();put(coll,id,{...data,createdAt:nowIso()});return id}
function makeHabitForKr(kid){const k=S.data.krs[kid];if(!k)return null;const o=S.data.objectives[k.objectiveId]||{};const hid=create('habits',{name:(k.title||'').trim(),identityId:o.identityId||'',freq:'daily',days:[],perWeek:3,icon:k.icon||'',fromKr:kid});put('krs',kid,{...k,kind:'habit',habitId:hid,target:null});return hid}
/* L'habitude créée pour une preuve disparaît avec elle ; si elle a déjà été cochée, elle reste dans Habitudes */
function dropOwnHabit(k){const h=habitOf(k);if(!h||h.fromKr!==k.id)return;if(hDates(h.id).length){put('habits',h.id,{...h,fromKr:''});toast(`« ${h.name||'Habitude'} » reste dans Habitudes : elle a déjà des validations`)}else del('habits',h.id)}
function repairHabits(){for(const h of list('habits')){const k=h.fromKr&&S.data.krs[h.fromKr];if(!k||kindOf(k)==='habit'||k.habitId!==h.id)continue;
    if(hDates(h.id).length)put('habits',h.id,{...h,fromKr:''});else del('habits',h.id);put('krs',k.id,{...k,habitId:''})}}
/* Type « Habitude » retiré : la preuve est supprimée, son habitude reste avec son historique et sa série.
   Une priorité du jour qui visait la preuve vise désormais l'habitude. */
function migrateHabitProofs(){const ks=list('krs').filter(k=>kindOf(k)==='habit');if(!ks.length)return;const map={};
  for(const k of ks){const h=habitOf(k);if(h){map[k.id]=h.id;if(h.fromKr||h.identityId)put('habits',h.id,{...h,fromKr:'',identityId:''})}del('krs',k.id)}
  for(const d of list('days')){const p=d.prio;if(!p)continue;let np=p;
    if(p.kind==='kr'&&map[p.id])np={...np,kind:'habit',id:map[p.id]};if(p.link&&p.link.kind==='kr'&&map[p.link.id])np={...np,link:{kind:'habit',id:map[p.link.id]}};
    if(np!==p)put('days',d.id,{...d,prio:np})}}
function migrateLevels(){for(const k of list('krs').filter(k=>kindOf(k)==='level')){const o=S.data.objectives[k.objectiveId]||{};const c=(k.createdAt||nowIso()).slice(0,10);const h={...(k.history||{})};
    if(+k.start&&!Object.keys(h).some(d=>d<=c))h[c]=+k.start;if(!Object.keys(h).length&&k.current!=null&&k.current!=='')h[today()]=+k.current;
    put('metrics','lv-'+k.id,{name:k.title||'Indicateur',icon:k.icon||'📈',type:'number',unit:k.unit||'',target:+k.target||null,identityId:o.identityId||'',history:h,createdAt:k.createdAt||nowIso(),fromKr:k.id});removeKr(k.id)}}
/* Ancien champ libre « 3 priorités » : découpé une fois en trois priorités à identifiant stable */
function migratePrios(){for(const rv of list('reviews')){if(rv.prios||!rv.next||!String(rv.next).trim())continue;const ps={};String(rv.next).split('\n').map(x=>x.replace(/^\s*(\d+[.)]|[-•*])\s*/,'').trim()).filter(Boolean).slice(0,3).forEach((text,i)=>ps['p'+(i+1)]={text,done:false});put('reviews',rv.id,{...rv,prios:ps})}}
function removeKr(kid){const k=S.data.krs[kid];if(!k)return;const h=S.data.habits[k.habitId];if(h&&h.fromKr===kid)del('habits',h.id);del('krs',kid)}

/* ---------- Export / import (F41-F44) ---------- */
const SCHEMA=3;
const COLL_FR={settings:'Réglages',identities:'Identités',objectives:'Objectifs',krs:'Preuves',habits:'Habitudes',habitlog:'Suivi des habitudes (mois)',todos:'Tâches (jours)',days:'Matins',metrics:'Indicateurs',plans:'Cibles hebdomadaires',justifs:'Justifications',reviews:'Revues',videos:'Vidéos',ideas:'Idées',templates:'Modèles'};
const DATE_FIELDS={todos:['date'],days:['date'],reviews:['monday'],plans:['monday'],justifs:['date'],videos:['publishDate'],krs:['week','doneAt']};
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function snapshotData(){return{app:'deviens-qui-tu-es',schemaVersion:SCHEMA,version:SCHEMA,exportedAt:nowIso(),data:Object.fromEntries(COLLS.map(c=>[c,Object.fromEntries(Object.entries(S.data[c]).map(([k,v])=>[k,clean(v)]))]))}}
async function saveJson(obj,name){const json=JSON.stringify(obj,null,2);
  if(window.claude&&typeof window.claude.use==='function'){let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
    if(dl){try{await dl.save({filename:name,data:json});return true}catch(e){return false}}}
  try{const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);return true}catch(e){return false}}
/* F41 : export complet, avec la version de schéma et la date ; aucun secret d'authentification */
async function exportData(){toast(await saveJson(snapshotData(),`deviens-qui-tu-es-${today()}.json`)?'Export enregistré':"L'export n'est pas disponible ici")}
/* F42 : un fichier invalide ne modifie rien ; le message dit ce qui ne va pas */
function validateImport(j){const errs=[];if(!j||typeof j!=='object'||Array.isArray(j))return{errs:['Le fichier ne contient pas de données lisibles.']};
  if(j.app&&j.app!=='deviens-qui-tu-es')errs.push('Ce fichier vient d’une autre application.');
  const ver=+(j.schemaVersion||j.version||1);if(ver>SCHEMA)errs.push(`Ce fichier utilise une version plus récente (${ver}) que l’application (${SCHEMA}). Mets l’application à jour avant d’importer.`);
  const d=j.data&&typeof j.data==='object'?j.data:j;const unknown=Object.keys(d).filter(c=>!COLLS.includes(c)&&!['app','version','schemaVersion','exportedAt','data'].includes(c));let count=0;
  for(const c of COLLS){const m=d[c];if(m==null)continue;if(typeof m!=='object'||Array.isArray(m)){errs.push(`${COLL_FR[c]} : format inattendu.`);continue}
    for(const[id,doc] of Object.entries(m)){if(!id||id.includes('/')){errs.push(`${COLL_FR[c]} : identifiant invalide « ${id} ».`);continue}if(!doc||typeof doc!=='object'||Array.isArray(doc)){errs.push(`${COLL_FR[c]} « ${id} » : élément illisible.`);continue}count++;
      for(const f of DATE_FIELDS[c]||[])if(doc[f]!=null&&doc[f]!==''&&!DATE_RE.test(String(doc[f]).slice(0,10)))errs.push(`${COLL_FR[c]} « ${doc.title||doc.name||id} » : date invalide (${f} = ${doc[f]}).`);
      if(c==='metrics'&&doc.history&&typeof doc.history==='object')for(const[k,v] of Object.entries(doc.history)){if(!DATE_RE.test(k))errs.push(`Indicateur « ${doc.name||id} » : date invalide « ${k} ».`);else if(v!==null&&v!==''&&!isFinite(+v))errs.push(`Indicateur « ${doc.name||id} » : valeur non numérique le ${k}.`)}
      if(c==='metrics'&&numOrNull(doc.min)!=null&&numOrNull(doc.max)!=null&&+doc.min>+doc.max)errs.push(`Indicateur « ${doc.name||id} » : minimum supérieur au maximum.`);
      if(c==='krs'&&doc.log&&typeof doc.log==='object')for(const[k,v] of Object.entries(doc.log))if(!DATE_RE.test(k)||!isFinite(+v))errs.push(`Preuve « ${doc.title||id} » : saisie invalide (${k}).`)}}
  if(!count&&!errs.length)errs.push('Le fichier ne contient aucun élément.');
  return{errs,data:d,unknown,count}}
const sortKeys=v=>Array.isArray(v)?v.map(sortKeys):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,sortKeys(v[k])])):v;
const sameDoc=(a,b)=>JSON.stringify(sortKeys(clean(a)))===JSON.stringify(sortKeys(clean(b)));
function importReport(d){const rows=[];for(const c of COLLS){const m=d[c];if(!m||typeof m!=='object')continue;let nw=0,mod=0,same=0;for(const[id,doc] of Object.entries(m)){const cur=S.data[c][id];if(!cur)nw++;else if(sameDoc(cur,doc))same++;else mod++}rows.push({c,nw,mod,same,del:Object.keys(S.data[c]).filter(id=>!(id in m)).length})}return rows}
function prepareImport(j,source){const v=validateImport(j);S.imp=v.errs.length?{errs:v.errs}:{data:v.data,rows:importReport(v.data),unknown:v.unknown,mode:source==='backup'?'replace':'merge',take:'keep',source};renderMain(true)}
function readImport(el){const file=el.files&&el.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{let j;try{j=JSON.parse(r.result)}catch(e){S.imp={errs:['Ce fichier n’est pas un JSON lisible : il est peut-être abîmé ou ce n’est pas un export de l’application.']};renderMain(true);el.value='';return}prepareImport(j,'file');el.value=''};r.readAsText(file)}
/* F43 : fusion ou remplacement, avec récapitulatif des ajouts, modifications et suppressions avant confirmation */
function importPanel(){const im=S.imp;if(!im)return '';
  if(im.errs)return `<div class="imp"><b class="imp-err">Import impossible : aucune donnée n’a été modifiée.</b><ul class="imp-err">${im.errs.slice(0,8).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>${im.errs.length>8?`<p class="hint">… et ${im.errs.length-8} autres problèmes.</p>`:''}<div><button class="btn-sec" data-act="imp-cancel">Fermer</button></div></div>`;
  const rep=im.mode==='replace';const tot=k=>im.rows.reduce((s,x)=>s+x[k],0);const writes=tot('nw')+(rep||im.take==='file'?tot('mod'):0),dels=rep?tot('del'):0;
  return `<div class="imp"><b>${im.source==='backup'?'Restaurer la sauvegarde':'Aperçu de l’import'}</b>
  <table><thead><tr><th>Catégorie</th><th>Nouveaux</th><th>Modifiés</th><th>Identiques</th>${rep?'<th>Supprimés</th>':''}</tr></thead><tbody>${im.rows.map(x=>`<tr><td>${esc(COLL_FR[x.c])}</td><td>${x.nw}</td><td>${x.mod}</td><td>${x.same}</td>${rep?`<td>${x.del}</td>`:''}</tr>`).join('')}</tbody></table>
  ${im.unknown&&im.unknown.length?`<p class="hint">Ignoré (inconnu de l’application) : ${esc(im.unknown.join(', '))}.</p>`:''}
  <div class="field"><span>Mode</span>${pills('imp-mode',im.mode,[['merge','Fusionner'],['replace','Remplacer']])}</div>
  ${rep?`<p class="hint">Remplacer : les catégories présentes dans le fichier prennent exactement son contenu. ${dels} élément${dels>1?'s':''} absent${dels>1?'s':''} du fichier ser${dels>1?'ont':'a'} supprimé${dels>1?'s':''}.</p>`:`<p class="hint">Fusionner : les nouveaux éléments sont ajoutés, rien n’est supprimé. Pour un même élément modifié des deux côtés :</p>${pills('imp-take',im.take,[['keep','Garder ma version'],['file','Prendre celle du fichier']])}`}
  <p><b>${writes} élément${writes>1?'s':''} écrit${writes>1?'s':''}${dels?`, ${dels} supprimé${dels>1?'s':''}`:''}.</b> Une sauvegarde de tes données actuelles est enregistrée juste avant.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sm" data-act="imp-go">Sauvegarder puis ${im.source==='backup'?'restaurer':'importer'}</button><button class="btn-sec" data-act="imp-cancel">Annuler</button></div></div>`}
function backupInfo(){let b=null;try{b=JSON.parse(localStorage.getItem('dqte:backup')||'null')}catch(e){}if(!b||!b.exportedAt)return '';return `<p class="hint" style="margin-top:12px">Sauvegarde d’avant ${b.reason==='reset'?'remise à zéro':'import'} du ${fmtD(b.exportedAt.slice(0,10),true)} sur cet appareil · <button class="act" data-act="backup-restore">Restaurer</button></p>`}
function restoreBackupPreview(){let b=null;try{b=JSON.parse(localStorage.getItem('dqte:backup')||'null')}catch(e){}if(!b){toast('Aucune sauvegarde sur cet appareil');return}prepareImport(b,'backup')}
function opsFor(d,mode,take){const ops=[];for(const c of COLLS){const m=d[c];if(!m||typeof m!=='object')continue;for(const[id,doc] of Object.entries(m)){const cur=S.data[c][id];if(cur&&sameDoc(cur,doc))continue;if(!cur||mode==='replace'||take==='file')ops.push({c,id,d:clean(doc)})}
    if(mode==='replace')for(const id of Object.keys(S.data[c]))if(!(id in m))ops.push({c,id,d:null})}return ops}
function applyOpsLocal(ops){for(const o of ops){const n={...S.data[o.c]};if(o.d===null)delete n[o.id];else n[o.id]={...o.d,id:o.id};S.data[o.c]=n}S.ver++}
/* Repartir de zéro : sauvegarde complète (fichier et copie sur l'appareil), puis remise à zéro de ce qui a été saisi avant aujourd'hui.
   Gardés : identités, objectifs, preuves et cibles, habitudes et réglages, indicateurs (dernière mesure), Studio, idées, modèles, réglages.
   La date de départ fait démarrer ce jour-là le rythme attendu des preuves et les habitudes. */
function sheetReset(){const c=today();
  return sheetTop('Repartir de zéro','Réglages')+`<section><p class="note">Départ : <b style="color:var(--fg)">${esc(fmtDay(c,true))}</b>. Tout ce qui a été saisi avant est remis à zéro ; ce que tu as saisi aujourd’hui reste.</p>
  <div class="howto"><h4>Gardé</h4><p style="margin:0">Identités, objectifs, preuves et leurs cibles, habitudes et leurs réglages, indicateurs avec leur dernière mesure, Studio, banque d’idées, modèles et réglages.</p></div>
  <div class="howto rz"><h4>Remis à zéro</h4><p style="margin:0">Cases d’habitudes et séries, quantités et étapes des preuves, tâches, priorités et temps de concentration, matins, revues et semaines sauvegardées, anciennes mesures des indicateurs.</p></div>
  <p class="hint" style="margin-top:14px">Avant, l’app enregistre une sauvegarde complète : un fichier JSON, et une copie sur cet appareil, restaurable depuis Réglages → Tes données.</p>
  <div class="prio-a" style="margin-top:18px"><button class="btn-sec" data-act="close-sheet">Annuler</button><button class="btn btn-warn" data-act="reset-go">Sauvegarder et repartir de zéro</button></div></section>`}
async function resetTracking(){const c=today();const backup={...snapshotData(),reason:'reset'};try{localStorage.setItem('dqte:backup',JSON.stringify(backup))}catch(e){}
  const saved=await saveJson(backup,`sauvegarde-avant-remise-a-zero-${c}.json`);const ops=[],W=(coll,id,d)=>ops.push({c:coll,id,d});
  for(const m of list('habitlog')){const n=JSON.parse(JSON.stringify(clean(m)));for(const f of ['days','mins','vals'])if(n[f])for(const d of Object.keys(n[f]))if(d<c)delete n[f][d];
    if(['days','mins','vals'].every(f=>!n[f]||!Object.keys(n[f]).length))W('habitlog',m.id,null);else if(!sameDoc(m,n))W('habitlog',m.id,n)}
  for(const j of list('justifs'))W('justifs',j.id,null);
  for(const x of list('todos'))if(String(x.date||x.id)<c)W('todos',x.id,null);
  for(const x of list('days'))if(String(x.date||x.id)<c)W('days',x.id,null);
  for(const r of list('reviews'))if(String(r.updatedAt||r.closedAt||r.createdAt||'').slice(0,10)<c)W('reviews',r.id,null);
  for(const p of list('plans'))W('plans',p.id,null);
  for(const k of list('krs'))W('krs',k.id,{...clean(k),log:{},history:{},done:false,doneAt:null,abandoned:null,reactivations:[],reschedules:[],scopes:[],current:k.start??0,updatedAt:nowIso()});
  for(const m of list('metrics')){const es=mEntries(m);W('metrics',m.id,{...clean(m),history:es.length?{[c]:es[es.length-1][1]}:{},updatedAt:nowIso()})}
  W('settings','main',{...clean(settings()),startDate:c,resetAt:nowIso()});
  fzSet(null);S.day=null;S.reviewWeek=monday(c);S.habitWeek=monday(c);applyOpsLocal(ops);schedule();
  const msg=`Suivi remis à zéro : départ le ${fmtD(c,true)}${saved?' · sauvegarde enregistrée':''}`;
  if(!db){for(const x of COLLS)saveLocal(x);toast(msg);return}
  if(!db.commit){for(const o of ops)queueWrite(o.c,o.id,o.d);toast(msg);return}
  SYNC.inflight++;renderSync();try{await db.commit(ops);toast(msg)}catch(e){const back=opsFor(backup.data,'replace','file');applyOpsLocal(back);schedule();try{await db.commit(back);toast('La remise à zéro a échoué : tes données sont restaurées.')}catch(e2){toast('La remise à zéro a échoué. Restaure la sauvegarde depuis Réglages.')}}
  finally{SYNC.inflight--;renderSync()}}
/* F44 : sauvegarde récupérable avant l'import ; en cas d'échec, l'état précédent est restauré intégralement */
async function applyImport(){const im=S.imp;if(!im||im.errs)return;S.imp=null;
  const backup=snapshotData();try{localStorage.setItem('dqte:backup',JSON.stringify(backup))}catch(e){}await saveJson(backup,`sauvegarde-avant-import-${today()}.json`);
  const ops=opsFor(im.data,im.mode,im.take);const w=ops.filter(o=>o.d).length,dl=ops.length-w;
  if(!ops.length){toast('Rien à importer : tout est déjà à jour');renderMain(true);return}
  applyOpsLocal(ops);schedule();
  if(!db){for(const c of COLLS)saveLocal(c);toast(`Import terminé : ${w} écrit${w>1?'s':''}${dl?`, ${dl} supprimé${dl>1?'s':''}`:''}`);return}
  if(!db.commit){for(const o of ops)queueWrite(o.c,o.id,o.d);toast(`Import en cours : ${w} éléments`);return}
  toast(SYNC.online?'Import en cours…':'Import enregistré sur cet appareil : en attente de synchronisation');SYNC.inflight++;renderSync();
  try{await db.commit(ops);toast(`Import terminé : ${w} écrit${w>1?'s':''}${dl?`, ${dl} supprimé${dl>1?'s':''}`:''}`)}
  catch(e){const back=opsFor(backup.data,'replace','file');applyOpsLocal(back);schedule();try{await db.commit(back);toast('L’import a échoué : tes données d’avant ont été restaurées.')}catch(e2){toast('L’import a échoué. Restaure la sauvegarde téléchargée depuis Réglages.')}}
  finally{SYNC.inflight--;renderSync()}}

(function boot(){const h=(location.hash||'').slice(1);const t=TABS.find(x=>x.hash===h);if(t)S.tab=t.k;else if(h==='reglages')S.tab='settings';try{history.replaceState(navState(),'',navUrl(navState()))}catch(e){}renderShell();initStore()})();
