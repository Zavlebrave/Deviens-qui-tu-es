<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deviens">
<title>Deviens qui tu es</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.auth{position:fixed;inset:0;z-index:80;background:var(--bg,#000);color:var(--fg,#fff);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.auth-box{width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.auth-box .brand{padding:0;font-size:26px;margin-bottom:4px}
.auth-err{color:var(--neg,#ff4d43);font-size:14px;min-height:20px}
</style>
</head>
<body>

<div id="auth" class="auth" hidden>
  <form id="auth-form" class="auth-box" novalidate>
    <div class="brand">Deviens qui tu es</div>
    <p class="note" id="auth-msg">Connecte-toi pour retrouver ton espace sur tous tes appareils.</p>
    <div id="auth-fields" style="display:flex;flex-direction:column;gap:14px">
      <label class="field"><span>E-mail</span><input id="auth-email" type="email" autocomplete="username" required></label>
      <label class="field"><span>Mot de passe</span><input id="auth-pass" type="password" autocomplete="current-password" minlength="6" required></label>
      <button class="btn" type="submit">Se connecter</button>
      <button class="btn-sec" type="button" id="auth-create">Créer mon compte</button>
      <button class="link" type="button" id="auth-reset" style="align-self:flex-start">Mot de passe oublié</button>
    </div>
    <p class="auth-err" id="auth-err" role="alert"></p>
  </form>
</div>
<script>window.DQ_BACKEND={};window.DQ_BACKEND.ready=new Promise(r=>{window.DQ_BACKEND._resolve=r});</script>
<script src="firebase-config.js"></script>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){const cfg=window.FIREBASE_CONFIG||{};const box=document.getElementById('auth');const msg=document.getElementById('auth-msg');const fields=document.getElementById('auth-fields');
  if(!cfg.apiKey){box.hidden=false;fields.hidden=true;msg.textContent='Configuration Firebase manquante : remplis le fichier firebase-config.js.';return}
  setTimeout(()=>{if(!window.DQ_BACKEND.loaded){box.hidden=false;fields.hidden=true;msg.textContent='Impossible de joindre Firebase pour l’instant. Vérifie ta connexion internet, puis recharge la page.'}},12000)})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout: Trade Republic grammar. Pure black ground, one calm column of flat lists,
   a big number with its delta and a line chart at the top of each screen, round
   pictogram avatars, pill buttons. Green and red only carry performance. */
:root{
  --bg:#000000; --surface:#0D0D0F; --surface-2:#1B1B1E; --surface-3:#2A2A2E; --line:#1A1A1D;
  --fg:#FFFFFF; --muted:#8E8E93; --faint:#545458;
  --pos:#21CE73; --neg:#FF4D43; --warn:#F5A524;
  --accent:#FFFFFF; --accent-ink:#000000;
  --ph-angle:#8E9AAF; --ph-recherche:#4C7DFF; --ph-ecriture:#9B6BFF; --ph-packaging:#E8B10E; --ph-voix:#19B9A8; --ph-montage:#FF7A45;
  --f:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FFFFFF; --surface:#F6F6F7; --surface-2:#EEEEF0; --surface-3:#E2E2E6; --line:#EFEFF1;
  --fg:#000000; --muted:#6E6E73; --faint:#AEAEB2;
  --pos:#00A657; --neg:#E5342A; --warn:#C27A00;
  --accent:#000000; --accent-ink:#FFFFFF; color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#FFFFFF; --surface:#F6F6F7; --surface-2:#EEEEF0; --surface-3:#E2E2E6; --line:#EFEFF1;
  --fg:#000000; --muted:#6E6E73; --faint:#AEAEB2;
  --pos:#00A657; --neg:#E5342A; --warn:#C27A00;
  --accent:#000000; --accent-ink:#FFFFFF; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)} .faint{color:var(--faint)} .sm{font-size:13px}
.up{color:var(--pos)} .down{color:var(--neg)}
.eyebrow{font-size:14px;color:var(--muted);font-weight:500}
.cap::first-letter{text-transform:uppercase}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:32px;padding:32px 16px 24px calc(20px + env(safe-area-inset-left,0px))}
.brand{font-size:18px;font-weight:700;letter-spacing:-.02em;padding:0 12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:999px;color:var(--muted);font-weight:600;text-align:left}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--surface-2)}
.nav svg{width:20px;height:20px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.store-state{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:0 12px}
.store-state i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.store-state.cloud i{background:var(--pos)}
main{min-width:0;width:100%;max-width:1080px;padding-block:36px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:820px){main{padding-left:32px;padding-right:max(48px,env(safe-area-inset-right,0px))}}
.mtop,.tabbar{display:none}
@media (max-width:819px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;justify-content:space-between;background:var(--bg);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .mtop .brand{padding:0;font-size:17px}
  main{padding-block:12px 120px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--faint);font-weight:600}
  .tabbar button[aria-current="page"]{color:var(--fg)}
  .tabbar svg{width:23px;height:23px}
}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--fg)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:21px;height:21px}

/* Page head & hero */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.h1{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.hero{display:flex;flex-direction:column;gap:6px;margin-top:20px}
.hero-v{font-size:clamp(44px,8vw,60px);font-weight:600;letter-spacing:-.045em;line-height:1}
.hero-v small{font-size:.5em;color:var(--muted);letter-spacing:-.02em;font-weight:500}
.hero-d{font-size:15px;font-weight:500;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;min-height:22px}
.chart{position:relative;height:190px;margin:22px 0 14px;user-select:none}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.l-act{fill:none;stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.l-act.up{stroke:var(--pos)} .l-act.down{stroke:var(--neg)}
.l-exp{fill:none;stroke:var(--faint);stroke-width:1.4;stroke-dasharray:2 5;vector-effect:non-scaling-stroke;stroke-linecap:round}
.c-dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:currentColor;pointer-events:none}
.c-dot.up{color:var(--pos)} .c-dot.down{color:var(--neg)}
@media (prefers-reduced-motion:no-preference){.c-dot.live::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:currentColor;opacity:.25;animation:pulse 2s ease-out infinite}@keyframes pulse{from{transform:scale(.5);opacity:.45}to{transform:scale(1.6);opacity:0}}}
.c-scrub{position:absolute;top:-6px;bottom:-6px;width:1px;margin-left:-.5px;background:var(--muted);pointer-events:none}
.c-hit{position:absolute;inset:-6px 0;cursor:crosshair;touch-action:pan-y}
.c-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:14px;text-align:center}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills button{height:34px;padding:0 15px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px}
.pills button:hover{color:var(--fg)}
.pills button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.qnav{display:inline-flex;align-items:center;gap:2px}
.qnav b{min-width:84px;text-align:center;font-weight:600}
.qnav button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.qnav button:hover{background:var(--surface-2)}

/* Sections & lists */
.sec{margin-top:44px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.sec-h h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.sec-h .act{color:var(--muted);font-weight:600;font-size:14px}
.sec-h .act:hover{color:var(--fg)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 56px}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 0;width:100%;text-align:left}
.row-l{display:flex;align-items:center;gap:14px;min-width:0;text-align:left}
.row .m{display:flex;flex-direction:column;min-width:0;gap:1px}
.row .t{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:1px;white-space:nowrap}
.row .r b{font-size:16px;font-weight:500}
.row .r span{font-size:13px;font-weight:500}
button.row:hover .t,.row-l:hover .t{text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.av{--c:#8E9AAF;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;line-height:1;background:color-mix(in srgb,var(--c) 22%,var(--surface-2));color:var(--fg);font-weight:600;flex:none}
.av.sm{width:36px;height:36px;font-size:17px}
.av.lg{width:64px;height:64px;font-size:30px}
.av.txt{font-size:16px}
.empty{color:var(--muted);font-size:15px;line-height:1.55;padding:10px 0}
.empty-state{padding:40px 0;display:flex;flex-direction:column;align-items:flex-start;gap:14px;max-width:560px}
.empty-state h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.note{font-size:15px;color:var(--muted);line-height:1.6;max-width:66ch}

/* Buttons & tags */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.btn-sec{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;background:var(--surface-2);color:var(--fg);font-weight:600;font-size:14px;white-space:nowrap}
.btn-sec:hover{background:var(--surface-3)}
.btn-danger{color:var(--neg)}
.link{color:var(--fg);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.add{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:15px;font-weight:600;padding:10px 0}
.add:hover{color:var(--fg)}
.add i{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--fg)}
.add svg{width:16px;height:16px}
.tag{font-size:13px;font-weight:600;white-space:nowrap}
.tag.pos{color:var(--pos)} .tag.neg{color:var(--neg)} .tag.warn{color:var(--warn)} .tag.mut{color:var(--muted)}
.bar{position:relative;height:4px;border-radius:999px;background:var(--surface-2);min-width:0}
.bar > i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--fg)}
.bar > b{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--muted);border-radius:2px}

/* Stats row */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:22px}
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .l{font-size:13px;color:var(--muted);font-weight:500}
.stat .v{font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.15}
.stat .v small{font-size:16px;color:var(--muted);font-weight:500}
.stat .s{font-size:13px;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:nth-child(3){grid-column:1/-1}}

/* Swipe rows (habits) */
.swipe{position:relative;overflow:hidden;border-radius:16px;margin:2px 0}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-start;padding:0 22px;font-weight:600;font-size:15px;color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,var(--bg))}
.swipe[data-dir="l"] .swipe-bg{justify-content:flex-end;color:var(--muted);background:var(--surface-2)}
.swipe.go .swipe-bg{background:var(--pos);color:#000}
.swipe.back .swipe-bg{background:var(--neg);color:#fff}
.swipe-fg{position:relative;background:var(--bg);touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.8,.2,1);padding:0 4px;cursor:grab}
.hcheck{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface-3);display:grid;place-items:center;color:transparent;flex:none}
.hcheck svg{width:16px;height:16px}
.hcheck.on{background:var(--pos);border-color:var(--pos);color:#000}
.swipe.done .t{color:var(--muted)}
.hint{font-size:13px;color:var(--faint)}

/* Todo */
.todo-add{display:flex;gap:8px;margin:6px 0 4px}
.todo-add input{flex:1;min-width:0;height:46px;padding:0 18px;border-radius:999px;border:0;background:var(--surface-2)}
.todo li{display:flex;align-items:center;gap:14px;padding:11px 0}
.todo li span{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px}
.todo li.done span{color:var(--faint);text-decoration:line-through}
.x{color:var(--faint);width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.x:hover{color:var(--neg);background:var(--surface-2)}
.x svg{width:14px;height:14px}

/* OKR */
.id-sec{margin-top:52px;scroll-margin-top:24px}
.id-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.id-head h2{font-size:24px;font-weight:700;letter-spacing:-.025em}
.id-head .st{font-size:15px;color:var(--muted)}
.id-meta{margin:14px 0 4px 80px;display:flex;flex-direction:column;gap:6px;max-width:64ch}
@media (max-width:640px){.id-meta{margin-left:0}}
.id-meta p{font-size:14px;color:var(--muted)}
.id-meta p b{color:var(--fg);font-weight:600;margin-right:6px}
.obj{margin:22px 0 0 80px}
@media (max-width:640px){.obj{margin-left:0}}
.obj-h{display:flex;align-items:center;gap:10px;padding:6px 0}
.obj-h button{font-size:17px;font-weight:700;letter-spacing:-.015em;text-align:left}
.obj-h span{font-size:18px}
.kr{padding:6px 0 12px}
.kr .row{grid-template-columns:minmax(0,1fr) auto;padding:6px 0}
.kr .bar{margin-left:50px}
.kr-r{display:flex;align-items:center;gap:12px}
.step{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:18px;line-height:1;color:var(--fg);font-weight:500}
.step:hover{background:var(--surface-3)}
.head-r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pill-mini{height:30px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:600;white-space:nowrap}
.pill-mini:hover{background:var(--surface-3)}
.kr.faded{opacity:.5}
.tpl-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.tpl-f{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:10px}
@media (max-width:480px){.tpl-f{grid-template-columns:minmax(0,1fr)}}
.tpl-item .x{margin-top:30px}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;margin-top:10px}
.wk{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border-radius:14px;background:var(--surface);min-width:60px}
.wk span{font-size:11px;color:var(--muted);font-weight:600}
.wk b{font-size:14px;font-weight:600}
.wk.on{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--fg)}
.wk:disabled{opacity:.35}
.obj-add{display:flex;gap:22px;flex-wrap:wrap}
.qty-form{display:flex;gap:8px;margin:6px 0 4px 50px}
.qty-form input{flex:1;min-width:0;height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--surface-2)}
.qty-form .qdate{flex:0 0 150px}
@media (max-width:640px){.qty-form{margin-left:0;flex-wrap:wrap}.qty-form .qdate{flex:1 1 140px}}
.log li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.log b{font-weight:600}

/* Habits grid */
.hgrid-wrap{overflow-x:auto}
.hgrid{width:100%;border-collapse:collapse;min-width:640px}
.hgrid th,.hgrid td{padding:8px 6px;text-align:center;font-weight:400}
.hgrid th{font-size:12px;color:var(--muted);font-weight:600}
.hgrid th.today{color:var(--fg)}
.hgrid td:first-child,.hgrid th:first-child{text-align:left;padding-left:0}
.hname{display:flex;align-items:center;gap:12px;text-align:left}
.hname b{font-weight:500;display:block}
.hname small{display:block;font-size:12px;color:var(--muted)}
.cell{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:inline-grid;place-items:center;color:transparent}
.cell svg{width:14px;height:14px}
.cell.on{background:var(--pos);color:#000}
.cell.off{background:transparent;border:1.5px dashed var(--surface-3)}
.cell:disabled{opacity:.35}
.idbar{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr) 3rem;align-items:center;gap:14px;padding:8px 0}
.idbar > span{display:flex;align-items:center;gap:10px;min-width:0;font-weight:500}
.idbar > span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idbar b{text-align:right;font-weight:600}

/* Forms & review */
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field > span{font-size:13px;color:var(--muted);font-weight:600}

<script>
/* ---------- Utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const maxD=(a,b)=>a>b?a:b, minD=(a,b)=>a<b?a:b;
const nowIso=()=>new Date().toISOString();
const nf=new Intl.NumberFormat('fr-FR');
const fmtN=n=>nf.format(Math.round((+n||0)*10)/10);
const pctS=p=>Math.round((p||0)*100)+' %';
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const plural=(n,w)=>`${n} ${w}${n>1?'s':''}`;
function fmtD(s,withYear){if(!s)return '—';const d=parse(s);const o={day:'numeric',month:'short'};if(withYear||d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString('fr-FR',o)}
function monday(s){const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function isoWeek(s){const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7)+3);const y=d.getFullYear();const f=new Date(y,0,4);f.setDate(f.getDate()-((f.getDay()+6)%7)+3);const w=1+Math.round((d-f)/(7*864e5));return{y,w,key:`${y}-W${pad(w)}`}}
const qKey=s=>{const[y,m]=s.split('-').map(Number);return `${y}-Q${Math.floor((m-1)/3)+1}`};
function qRange(k){const[y,q]=k.split('-Q').map(Number);const sm=(q-1)*3;return{start:ymd(new Date(y,sm,1)),end:ymd(new Date(y,sm+3,0))}}
const qLabel=k=>{const[y,q]=k.split('-Q');return `T${q} ${y}`};
function qShift(k,n){let[y,q]=k.split('-Q').map(Number);q+=n;while(q>4){q-=4;y++}while(q<1){q+=4;y--}return `${y}-Q${q}`}
function dPts(d,suffix){const n=Math.round(d*100);const cls=n>0?'up':n<0?'down':'muted';return `<span class="${cls}">${n>0?'▲ +':n<0?'▼ −':''}${Math.abs(n)} pts</span>${suffix?` <span class="muted">${suffix}</span>`:''}`}

const ICON={
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>',
  okr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>',
  habits:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.8 2.7L16.5 9"/></svg>',
  review:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17.5 9 12l4 4 7.5-8.5"/><path d="M15.5 7.5h5v5"/></svg>',
  studio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="m10 9.2 5 2.8-5 2.8z" fill="currentColor"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  left:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 6 6 6-6 6"/></svg>'
};

/* ---------- Référentiels ---------- */
const TABS=[
  {k:'today',label:"Aujourd'hui",short:"Aujourd'hui",hash:'aujourdhui'},
  {k:'okr',label:'Identités',short:'Identités',hash:'identites'},
  {k:'habits',label:'Habitudes',short:'Habitudes',hash:'habitudes'},
  {k:'review',label:'Revue',short:'Revue',hash:'revue'},
  {k:'studio',label:'Studio',short:'Studio',hash:'studio'}
];
const STAGES=[
  {k:'idee',label:'Idée'},{k:'angle',label:'Angle'},{k:'recherche',label:'Recherche'},{k:'ecriture',label:'Plan & script'},
  {k:'packaging',label:'Titre & miniature'},{k:'voix',label:'Voix'},{k:'montage',label:'Montage & mixage'},{k:'publie',label:'Publiée'}
];
const STAGE_LABEL=Object.fromEntries(STAGES.map(s=>[s.k,s.label]));
const PHASES=[{k:'angle',label:"Verrouiller l'angle"},{k:'recherche',label:'Recherche'},{k:'ecriture',label:'Plan en loops & script'},{k:'voix',label:'Enregistrement voix'},{k:'montage',label:'Montage & mixage'}];
const CPLX={legere:'Légère',moyenne:'Moyenne',lourde:'Lourde'};
const KINDS=[['habit','Habitude','Se coche au quotidien, compte tout seul.'],['qty','Quantité','Mots, heures, séances… tu ajoutes ce que tu fais.'],['milestone','Étape','Faite ou pas, à planifier sur une semaine.'],['level','Niveau','Elo, rang, poids : une valeur qui évolue.']];
const COLORS=['#FF7A45','#E8B10E','#4C7DFF','#9B6BFF','#19B9A8','#FF5D8F','#6CC56C','#8E9AAF'];
const PICTOS=['🥊','🏆','💪','🏃','🧘','😴','🌅','🥗','💧','📚','✍️','🎬','🎙️','🎞️','🖼️','💡','🧠','♟️','🎮','💼','💻','🚀','📈','💰','✈️','🎯','🔥','⭐','🗣️','❤️','🎵','🙏'];
const DEF={phases:{angle:5,recherche:20,ecriture:10,voix:2,montage:10,marge:2},complexity:{legere:.6,moyenne:.8,lourde:1},goals:{'2026':4,'2027':7},capacity:20,hoursPerVideo:45,channel:'Zav le brave'};
const COLLS=['settings','identities','objectives','krs','habits','habitlog','todos','reviews','videos','ideas','templates'];

/* ---------- Etat ---------- */
const S={
  data:Object.fromEntries(COLLS.map(c=>[c,{}])), ver:0,
  mode:'boot', loaded:{},
  tab:'today', quarter:qKey(today()), habitWeek:monday(today()), reviewWeek:monday(today()),
  okrMode:'week', week:monday(today()), qtyOpen:null, studio:'pipeline', ideaCat:'Tout', ideaQuery:'', allIdeas:false, range:{okr:'q',habits:'m'}, sheet:null, pendingImport:null
};
try{const v=JSON.parse(localStorage.getItem('dqte:ui')||'{}');if(v.studio)S.studio=v.studio;if(v.ideaCat)S.ideaCat=v.ideaCat;if(v.range)S.range={...S.range,...v.range};if(v.okrMode)S.okrMode=v.okrMode}catch(e){}
function saveUi(){try{localStorage.setItem('dqte:ui',JSON.stringify({studio:S.studio,ideaCat:S.ideaCat,range:S.range,okrMode:S.okrMode}))}catch(e){}}

/* ---------- Stockage : base en ligne (claude.ai) ou navigateur ---------- */
let db=null;
const writeQ={};
const clean=d=>{const o={...d};delete o.id;return o};
function loadLocal(){for(const c of COLLS){let raw={};try{raw=JSON.parse(localStorage.getItem('dqte:'+c)||'{}')||{}}catch(e){}S.data[c]=Object.fromEntries(Object.entries(raw).map(([k,v])=>[k,{...v,id:k}]))}S.ver++}
function saveLocal(c){try{localStorage.setItem('dqte:'+c,JSON.stringify(Object.fromEntries(Object.entries(S.data[c]).map(([k,v])=>[k,clean(v)]))))}catch(e){toast("Le navigateur refuse d'enregistrer. Exporte tes données pour ne rien perdre.")}}
function put(c,id,data){if(!id){console.error('Écriture sans identifiant ignorée',c);return}const doc=clean(data);S.data[c]={...S.data[c],[id]:{...doc,id}};S.ver++;schedule();if(db)queueWrite(c,id,doc);else saveLocal(c)}
function del(c,id){if(!id)return;const n={...S.data[c]};delete n[id];S.data[c]=n;S.ver++;schedule();if(db)queueWrite(c,id,null);else saveLocal(c)}
function queueWrite(c,id,data){const k=c+'/'+id;const q=writeQ[k]||(writeQ[k]={running:false,next:undefined});q.next=data;if(!q.running)flush(k,c,id)}
async function flush(k,c,id){const q=writeQ[k];q.running=true;while(q.next!==undefined){const d=q.next;q.next=undefined;try{const ref=db.collection(c).doc(id);if(d===null)await ref.delete();else await ref.set(d)}catch(e){dbError(e)}}q.running=false}
function dbError(e){const c=e&&e.code;if(c==='quota_exceeded')toast("Stockage plein : supprime d'anciennes données ou exporte-les.");else if(c==='invalid_argument')toast("Cette modification n'a pas pu être enregistrée.");else if(c==='revoked')toast("L'accès en écriture a été retiré pour cette session.");else toast('Enregistrement impossible pour le moment, réessaie dans un instant.')}
async function initStore(){
  let api=null;
  if(window.DQ_BACKEND){try{api=await window.DQ_BACKEND.ready}catch(e){api=null}}
  else try{api=(window.claude&&typeof window.claude.use==='function')?await window.claude.use('db'):null}catch(e){api=null}
  if(!api){S.mode='local';loadLocal();renderShell();schedule();return}
  db=api;S.mode='cloud';renderShell();
  for(const c of COLLS){
    let q=db.collection(c);
    if(c==='todos')q=q.where('date','>=',addDays(today(),-120));
    q.onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]={...d.data(),id:d.id}});S.data[c]=m;S.loaded[c]=true;S.ver++;schedule()},err=>{S.loaded[c]=true;if(err&&err.code!=='revoked')toast('Synchronisation interrompue. Recharge la page.');schedule()});
  }
}
const ready=()=>S.mode==='local'||(S.mode==='cloud'&&COLLS.every(c=>S.loaded[c]));

/* ---------- Domaine : identités, objectifs, preuves ---------- */
const list=c=>Object.values(S.data[c]);
const byCreated=(a,b)=>(a.createdAt||'').localeCompare(b.createdAt||'');
function settings(){const m=S.data.settings.main||{};return{...DEF,...clean(m),phases:{...DEF.phases,...(m.phases||{})},complexity:{...DEF.complexity,...(m.complexity||{})},goals:m.goals||DEF.goals}}
const identities=()=>list('identities').sort((a,b)=>(a.order??99)-(b.order??99)||byCreated(a,b));
const idOf=id=>S.data.identities[id];
const idColor=id=>(idOf(id)||{}).color||'#8E9AAF';
const objectivesOf=(q,iid)=>list('objectives').filter(o=>o.quarter===q&&(!iid||o.identityId===iid)).sort(byCreated);
const krsOf=oid=>list('krs').filter(k=>k.objectiveId===oid).sort(byCreated);
const krsOfQuarter=q=>objectivesOf(q).flatMap(o=>krsOf(o.id).map(k=>({...k,identityId:o.identityId})));
const habits=()=>list('habits').sort(byCreated);
const videos=()=>list('videos');
const ideas=()=>list('ideas');
function av(icon,color,cls='',fallback=''){const t=(icon||'').trim();return `<span class="av ${cls} ${t?'':'txt'}" style="--c:${esc(color||'#8E9AAF')}" aria-hidden="true">${t?esc(t):esc((fallback||'·').trim().charAt(0).toUpperCase()||'·')}</span>`}

function krQuarter(kr){if(kr._q)return kr._q;const o=S.data.objectives[kr.objectiveId];return o?o.quarter:qKey(today())}
function krSpan(kr){const{start,end}=qRange(krQuarter(kr));const c=(kr.createdAt||'').slice(0,10);let s=c&&c>start?c:start;if(s>end)s=start;return{qs:start,s,e:end}}
const kindOf=kr=>kr.kind==='manual'?'level':(kr.kind||'habit');
const habitOf=kr=>S.data.habits[kr.habitId];
const krTitle=kr=>kr.title||(habitOf(kr)||{}).name||'Preuve sans titre';
const krIcon=kr=>kr.icon||(habitOf(kr)||{}).icon||'';
const sumLog=(log,a,b)=>Object.entries(log||{}).reduce((s,[d,v])=>d>=a&&d<=b?s+(+v||0):s,0);
const signed=(v,u)=>`${v>0?'+':v<0?'−':''}${fmtN(Math.abs(v))}${u?' '+esc(u):''}`;
function autoTarget(kr){const h=habitOf(kr);if(!h)return 0;const{s,e}=krSpan(kr);return occurrences(h,maxD(s,hStart(h)),e)}
function krTarget(kr){const k=kindOf(kr);if(k==='milestone')return 1;if(k==='habit')return (+kr.target>0)?+kr.target:autoTarget(kr);return +kr.target||0}
const krStart=kr=>kindOf(kr)==='level'?(+kr.start||0):0;
function levelAt(kr,d){const h=kr.history||{};const ks=Object.keys(h).filter(x=>x<=d).sort();if(ks.length)return +h[ks[ks.length-1]]||0;return Object.keys(h).length?krStart(kr):(+kr.current||0)}
function krValueAt(kr,d){const{qs}=krSpan(kr);const k=kindOf(kr);
  if(k==='habit')return habitCount(kr.habitId,qs,d);
  if(k==='qty')return sumLog(kr.log,qs,d);
  if(k==='videos')return publishedBetween(qs,d).length;
  if(k==='milestone')return kr.done&&(kr.doneAt||'0000')<=d?1:0;
  return levelAt(kr,d)}
function krValue(kr){const k=kindOf(kr);if(k==='level')return +kr.current||0;if(k==='milestone')return kr.done?1:0;const{e}=krSpan(kr);return krValueAt(kr,minD(today(),e))}
function prog(kr,v){const s=krStart(kr),t=krTarget(kr);if(t===s)return t>0&&v>=t?1:0;return clamp((v-s)/(t-s),0,1)}
const krProgress=kr=>prog(kr,krValue(kr));
const krProgressAt=(kr,d)=>prog(kr,krValueAt(kr,d));
function krExpectedAt(kr,d){const{s,e}=krSpan(kr);if(d<s)return 0;if(d>=e)return 1;return (diffDays(s,d)+1)/(diffDays(s,e)+1)}
function krStatus(kr){const p=krProgress(kr),t=today(),{s,e}=krSpan(kr),x=krExpectedAt(kr,t);
  if(p>=1)return{k:'pos',t:'Atteint'};
  if(t>e)return{k:'neg',t:'Non atteint'};
  if(t<s)return{k:'mut',t:'À venir'};
  if(x<.08)return{k:'mut',t:'Démarrage'};
  if(p>=x-.08)return{k:'pos',t:'Dans les temps'};
  if(p>=x-.25)return{k:'warn',t:'À surveiller'};
  return{k:'neg',t:'En retard'}}
function krUnit(kr){const k=kindOf(kr);if(k==='habit')return 'fois';if(k==='videos')return 'vidéos';if(k==='milestone')return '';return kr.unit||''}
function withHistory(k){if(kindOf(k)!=='level')return k;return{...k,history:{...(k.history||{}),[today()]:+k.current||0}}}

/* ---------- Semaine : tout est daté, la semaine en cours se calcule depuis la date du jour ---------- */
const weekQuarter=mon=>qKey(addDays(mon,3));
function weeksOfQuarter(q){const{start,end}=qRange(q);const out=[];for(let m=monday(start);m<=end;m=addDays(m,7))if(weekQuarter(m)===q)out.push(m);return out}
function krWeekValue(kr,mon,until){const sun=until||addDays(mon,6);const k=kindOf(kr);
  if(k==='habit')return habitCount(kr.habitId,mon,sun);
  if(k==='qty')return sumLog(kr.log,mon,sun);
  if(k==='milestone')return kr.done&&kr.doneAt>=mon&&kr.doneAt<=sun?1:0;
  if(k==='videos')return publishedBetween(mon,sun).length;
  return levelAt(kr,sun)-levelAt(kr,addDays(mon,-1))}
function krWeekTarget(kr,mon){const k=kindOf(kr);const sun=addDays(mon,6);const{qs,s,e}=krSpan(kr);
  if(k==='habit'){const h=habitOf(kr);return h?weekExpected(h,mon):0}
  if(sun<s||mon>e)return 0;
  if(k==='qty'){if(+kr.weekTarget>0)return +kr.weekTarget;const before=sumLog(kr.log,qs,addDays(mon,-1));const rem=Math.max(0,krTarget(kr)-before);const wl=Math.max(1,Math.ceil((diffDays(maxD(mon,s),e)+1)/7));return Math.ceil(rem/wl)}
  if(k==='milestone'){if(kr.done&&kr.doneAt<mon)return 0;if(kr.done&&kr.doneAt<=sun)return 1;return kr.week&&kr.week<=mon?1:0}
  return 0}
function weekScoreAt(mon,d){const sc=[];for(const k of allProofs(weekQuarter(mon))){const t=krWeekTarget(k,mon);if(t>0)sc.push(Math.min(1,Math.max(0,krWeekValue(k,mon,d))/t))}return sc.length?avg(sc):null}
function krWeekScore(kr,mon){const t=krWeekTarget(kr,mon);if(!(t>0))return null;return Math.min(1,Math.max(0,krWeekValue(kr,mon))/t)}
function milestoneTag(kr,mon){const sun=addDays(mon,6);
  if(kr.done){const inW=kr.doneAt>=mon&&kr.doneAt<=sun;return `<span class="tag ${inW?'pos':'mut'}">Faite le ${fmtD(kr.doneAt)}</span>`}
  if(!kr.week)return '<span class="tag mut">À planifier</span>';
  if(kr.week===mon)return '<span class="tag warn">Prévue cette semaine</span>';
  if(kr.week<mon)return `<span class="tag neg">En retard · prévue sem. ${isoWeek(kr.week).w}</span>`;
  return `<span class="tag mut">Prévue sem. ${isoWeek(kr.week).w}</span>`}
function weekSub(kr,mon){const k=kindOf(kr);
  if(k==='habit'){const h=habitOf(kr);if(!h)return 'Aucune habitude liée';return `${esc(freqLabel(h))} · trimestre ${fmtN(krValue(kr))}/${fmtN(krTarget(kr))}`}
  if(k==='qty')return `Trimestre ${fmtN(krValue(kr))} / ${fmtN(krTarget(kr))} ${esc(kr.unit||'')}`;
  if(k==='milestone')return milestoneTag(kr,mon);
  if(k==='videos')return 'Automatique · Studio';
  return `Niveau ${fmtN(kr.current)} ${esc(kr.unit||'')} · objectif ${fmtN(krTarget(kr))}`}
function quarterSub(kr){const k=kindOf(kr);
  if(k==='habit'){const h=habitOf(kr);return h?esc(freqLabel(h)):'Aucune habitude liée'}
  if(k==='qty')return `${fmtN(krWeekTarget(kr,monday(today())))} ${esc(kr.unit||'')} / semaine pour tenir`;
  if(k==='milestone')return kr.done?`Faite le ${fmtD(kr.doneAt)}`:kr.week?`Prévue sem. ${isoWeek(kr.week).w}`:'À planifier';
  if(k==='videos')return 'Automatique · Studio';
  return `${esc(kr.unit||'Niveau')} · départ ${fmtN(krStart(kr))}`}
function weekVal(k,mon){const kind=kindOf(k);if(kind==='milestone')return k.done&&k.doneAt<=addDays(mon,6)?'Faite':'À faire';if(kind==='level')return signed(krWeekValue(k,mon),k.unit||'');return `${fmtN(krWeekValue(k,mon))} / ${fmtN(krWeekTarget(k,mon))}`}
const editAttr=k=>k.virtual?`data-act="edit-habit" data-id="${k.habitId}"`:`data-act="edit-kr" data-id="${k.id}"`;
/* Une habitude qui n'est rattachée à aucun objectif devient une preuve « virtuelle » de son identité */
function virtualKrs(q){const{end}=qRange(q);const linked=new Set(list('krs').filter(k=>kindOf(k)==='habit'&&krQuarter(k)===q).map(k=>k.habitId));
  return habits().filter(h=>!linked.has(h.id)&&hStart(h)<=end).map(h=>({id:'h:'+h.id,kind:'habit',habitId:h.id,_q:q,createdAt:h.createdAt,identityId:h.identityId,title:'',icon:'',virtual:true}))}
const allProofs=q=>[...krsOfQuarter(q),...virtualKrs(q)];
function weekSummary(mon){const q=weekQuarter(mon);const items=[];for(const k of allProofs(q)){const s=krWeekScore(k,mon);if(s!=null)items.push({iid:k.identityId,s})}
  const per={};for(const it of items)(per[it.iid]=per[it.iid]||[]).push(it.s);
  return{q,score:items.length?avg(items.map(i=>i.s)):null,per:Object.fromEntries(Object.entries(per).map(([k,v])=>[k,avg(v)])),n:items.length}}
function qSummary(q){const krs=allProofs(q);const t=today();const actual=avg(krs.map(krProgress)),expected=avg(krs.map(k=>krExpectedAt(k,t)));
  const per=identities().map(i=>{const mine=krs.filter(k=>k.identityId===i.id);return{...i,p:mine.length?avg(mine.map(krProgress)):null,e:mine.length?avg(mine.map(k=>krExpectedAt(k,t))):null,n:mine.length}});
  return{krs,actual,expected,per}}
/* Archivage : au premier lancement d'une nouvelle semaine, les semaines terminées sont figées dans la base */
let archived=false;
function archiveOf(mon){const ws=weekSummary(mon);const st=weekStats(mon);const snap={},vals={};for(const k of allProofs(ws.q)){snap[k.id]=krValueAt(k,addDays(mon,6));vals[k.id]={v:krWeekValue(k,mon),t:krWeekTarget(k,mon)}}
  return{snapshot:snap,weekVals:vals,weekScore:ws.score,identityScores:ws.per,habitRate:st.rate,todosDone:st.todosDone}}
function autoArchive(){if(archived||!ready())return;archived=true;const starts=[...list('habits'),...list('krs')].map(x=>(x.createdAt||'').slice(0,10)).filter(Boolean).sort();if(!starts.length)return;
  const first=monday(starts[0]),cur=monday(today());
  for(let i=1;i<=6;i++){const mon=addDays(cur,-7*i);if(mon<first)break;const key=isoWeek(mon).key;const r=S.data.reviews[key];if(r&&r.snapshot)continue;
    put('reviews',key,{...(r?clean(r):{}),week:key,monday:mon,createdAt:(r&&r.createdAt)||nowIso(),...archiveOf(mon),auto:true,closedAt:nowIso()})}}

/* ---------- Habitudes ---------- */
const freqOf=h=>h.freq||(Array.isArray(h.days)&&h.days.length?'days':'daily');
const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function freqLabel(h){const f=freqOf(h);if(f==='weekly')return `${h.perWeek||3} fois / semaine`;if(f==='days')return (h.days||[]).map(d=>DAYS[d].toLowerCase()).join(', ')||'aucun jour';return 'tous les jours'}
const wd=s=>(parse(s).getDay()+6)%7;
function fixedOn(h,s){const f=freqOf(h);if(f==='weekly')return false;if(f==='days')return (h.days||[]).includes(wd(s));return true}
const visibleOn=(h,s)=>freqOf(h)==='weekly'||fixedOn(h,s);
function occurrences(h,a,b){if(b<a)return 0;const f=freqOf(h);const n=diffDays(a,b)+1;if(f==='weekly')return Math.round((h.perWeek||3)*n/7);if(f==='daily')return n;let c=0;for(let d=a;d<=b;d=addDays(d,1))if(fixedOn(h,d))c++;return c}
let memo={ver:-1,dates:{}};
function hDates(hid){if(memo.ver!==S.ver)memo={ver:S.ver,dates:{}};if(!memo.dates[hid]){const arr=[];for(const m of Object.values(S.data.habitlog))for(const[d,ids] of Object.entries(m.days||{}))if((ids||[]).includes(hid))arr.push(d);memo.dates[hid]=arr.sort()}return memo.dates[hid]}
const habitCount=(hid,a,b)=>hDates(hid).filter(d=>d>=a&&d<=b).length;
function habitDone(hid,s){const m=S.data.habitlog[s.slice(0,7)];return !!(m&&m.days&&(m.days[s]||[]).includes(hid))}
function toggleHabit(hid,s){const k=s.slice(0,7);const base=S.data.habitlog[k];const doc=base?JSON.parse(JSON.stringify(clean(base))):{month:k,days:{}};doc.days=doc.days||{};const arr=doc.days[s]||[];doc.days[s]=arr.includes(hid)?arr.filter(x=>x!==hid):[...arr,hid];if(!doc.days[s].length)delete doc.days[s];put('habitlog',k,doc)}
const hStart=h=>(h.createdAt||'2000-01-01').slice(0,10);
const weekCount=(h,mon)=>habitCount(h.id,mon,addDays(mon,6));
function weekExpected(h,mon){const sun=addDays(mon,6);if(hStart(h)>sun)return 0;return freqOf(h)==='weekly'?(h.perWeek||3):occurrences(h,maxD(mon,hStart(h)),sun)}
function streakTxt(h){const t=today();
  if(freqOf(h)==='weekly'){let mon=monday(t),n=0;if(weekCount(h,mon)<(h.perWeek||3))mon=addDays(mon,-7);for(let i=0;i<120&&addDays(mon,6)>=hStart(h);i++){if(weekCount(h,mon)>=(h.perWeek||3)){n++;mon=addDays(mon,-7)}else break}return `série ${n} sem.`}
  let s=t;if(fixedOn(h,s)&&!habitDone(h.id,s))s=addDays(s,-1);let n=0;for(let i=0;i<500&&s>=hStart(h);i++){if(!fixedOn(h,s)){s=addDays(s,-1);continue}if(habitDone(h.id,s)){n++;s=addDays(s,-1)}else break}return `série ${n} j`}
function rate30(h){const t=today();const a=maxD(addDays(t,-29),hStart(h));const exp=occurrences(h,a,t);if(!exp)return null;return Math.min(1,habitCount(h.id,a,t)/exp)}
function dayScore(d){let den=0,dn=0;for(const h of habits()){if(d<hStart(h))continue;const done=habitDone(h.id,d);if(freqOf(h)==='weekly'){den+=(h.perWeek||3)/7;if(done)dn+=1}else if(fixedOn(h,d)){den++;if(done)dn++}}return den?Math.min(1,dn/den):null}
function weekStats(mon){const t=today();let sc=0,dn=0;const votes={};
  for(const h of habits()){const end=minD(addDays(mon,6),t);if(end<mon)continue;const c=habitCount(h.id,mon,end);votes[h.identityId||'_']=(votes[h.identityId||'_']||0)+c;
    if(freqOf(h)==='weekly'){if(addDays(mon,6)>=hStart(h)){sc+=(h.perWeek||3);dn+=Math.min(c,h.perWeek||3)}}else{const a=maxD(mon,hStart(h));const e=occurrences(h,a,end);sc+=e;dn+=Math.min(c,e)}}
  const days=[...Array(7)].map((_,i)=>addDays(mon,i));let td=0,tt=0;for(const d of days){const it=todoItems(d);tt+=it.length;td+=it.filter(x=>x.done).length}
  const moves=[];for(const v of videos()){const lg=v.stageLog||[];lg.forEach((l,i)=>{if(i>0&&l.date>=mon&&l.date<=days[6]&&stageIdx(l.stage)>stageIdx(lg[i-1].stage))moves.push({v,...l})})}
  return{rate:sc?dn/sc:null,done:dn,sched:sc,votes,todosDone:td,todosTotal:tt,moves}}

const todoItems=s=>((S.data.todos[s]||{}).items||[]);
function saveTodos(s,items){put('todos',s,{date:s,items})}

/* ---------- Studio ---------- */
const stageIdx=k=>Math.max(0,STAGES.findIndex(s=>s.k===k));
const publishedBetween=(a,b)=>videos().filter(v=>v.stage==='publie'&&v.publishDate&&v.publishDate>=a&&v.publishDate<=b);
const publishedInYear=y=>publishedBetween(`${y}-01-01`,`${y}-12-31`);
function plan(v){if(!v.publishDate)return null;const st=settings();const f=st.complexity[v.complexity||'lourde']??1;let end=addDays(v.publishDate,-(+st.phases.marge||0));const out={};
  for(const p of [...PHASES].reverse()){const d=Math.max(1,Math.round((+st.phases[p.k]||0)*f));const start=addDays(end,-d);out[p.k]={start,end};end=start}
  out.packaging={start:out.recherche.start,end:out.ecriture.end};out.start=out.angle.start;return out}
function deadline(v,p){p=p||plan(v);if(!p)return null;const m={idee:p.angle.start,angle:p.angle.end,recherche:p.recherche.end,ecriture:p.ecriture.end,packaging:p.ecriture.end,voix:p.voix.end,montage:p.montage.end};const d=m[v.stage];return d?addDays(d,-1):null}
function videoStatus(v){if(v.stage==='publie')return{k:'pos',t:'Publiée'};const p=plan(v);if(!p)return{k:'mut',t:'Sans date'};const dl=deadline(v,p);if(!dl)return{k:'mut',t:''};const late=diffDays(dl,today());
  if(late>0)return{k:'neg',t:`Retard ${late} j`};if(late>-4)return{k:'warn',t:late===0?"Échéance aujourd'hui":`Échéance ${fmtD(dl)}`};return{k:'pos',t:'Dans les temps'}}
function setStage(id,k){const v=S.data.videos[id];if(!v||v.stage===k)return;const n={...v,stage:k,stageLog:[...(v.stageLog||[]),{stage:k,date:today()}],updatedAt:nowIso()};
  if(k==='publie'&&(!n.publishDate||n.publishDate>today()))n.publishDate=today();put('videos',id,n);
  if(k==='publie')toast('Vidéo publiée : tes preuves « vidéos » sont à jour')}
function ideaScore(i){if(!i.potentiel||!i.envie)return null;return Math.round((+i.potentiel)*(+i.envie)/Math.max(1,+i.effort||3)*10)/10}

/* ---------- Composants ---------- */
const bar=(p,e,color)=>`<div class="bar"><i style="width:${(clamp(p,0,1)*100).toFixed(1)}%${color?`;background:${esc(color)}`:''}"></i>${e!=null?`<b style="left:${(clamp(e,0,1)*100).toFixed(1)}%" title="Attendu à date"></b>`:''}</div>`;
const stat=(l,v,s)=>`<div class="stat"><span class="l">${l}</span><span class="v">${v}</span><span class="s">${s}</span></div>`;
const tag=st=>st&&st.t?`<span class="tag ${st.k||'mut'}">${esc(st.t)}</span>`:'';
const qnav=(act,label)=>`<div class="qnav"><button data-act="${act}" data-d="-1" aria-label="Précédent">${ICON.left}</button><b>${label}</b><button data-act="${act}" data-d="1" aria-label="Suivant">${ICON.right}</button></div>`;
const addBtn=(act,label,attrs='')=>`<button class="add" data-act="${act}" ${attrs}><i>${ICON.plus}</i>${label}</button>`;
const pills=(act,cur,opts,attrs='')=>`<div class="pills" role="group">${opts.map(([k,l])=>`<button data-act="${act}" data-v="${esc(k)}" ${attrs} aria-pressed="${cur===k}">${esc(l)}</button>`).join('')}</div>`;

/* Graphique en ligne façon Trade Republic : courbe réelle + trajectoire attendue en pointillés ; survol ou doigt pour lire une date */
const CH={};
function lineChart(id,{xs,act,exp,y0=0,y1=1,fmtV=pctS,fmtX=null,live=true}){
  const n=xs.length;const X=i=>n<=1?500:i/(n-1)*1000;const Y=v=>200-(clamp(v,y0,y1)-y0)/((y1-y0)||1)*200;
  const path=arr=>{let p='';(arr||[]).forEach((v,i)=>{if(v==null)return;p+=(p?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});return p};
  let li=-1;act.forEach((v,i)=>{if(v!=null)li=i});
  if(li<0)return `<div class="chart"><div class="c-empty">Pas encore de données sur cette période</div></div>`;
  const fi=act.findIndex(v=>v!=null);
  const up=exp?act[li]>=exp[li]-.005:act[li]>=act[fi];
  CH[id]={xs,act,exp,fmtV,fmtX,X,Y};
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">${exp?`<path class="l-exp" d="${path(exp)}"/>`:''}<path class="l-act ${up?'up':'down'}" d="${path(act)}"/></svg>
  <i class="c-dot ${up?'up':'down'} ${live?'live':''}" style="left:${(X(li)/10).toFixed(2)}%;top:${(Y(act[li])/2).toFixed(2)}%"></i><i class="c-scrub" hidden></i><i class="c-dot c-sd ${up?'up':'down'}" hidden></i><div class="c-hit" role="img" aria-label="Courbe de progression"></div></div>`}
function scrub(el,clientX){const id=el.dataset.chart;const c=CH[id];if(!c)return;const r=el.getBoundingClientRect();const n=c.xs.length;let i=Math.round(clamp((clientX-r.left)/r.width,0,1)*(n-1));while(i>0&&c.act[i]==null)i--;if(c.act[i]==null)return;
  const sl=el.querySelector('.c-scrub'),sd=el.querySelector('.c-sd');sl.hidden=false;sd.hidden=false;sl.style.left=sd.style.left=(c.X(i)/10)+'%';sd.style.top=(c.Y(c.act[i])/2)+'%';
  const v=$('#'+id+'-v'),d=$('#'+id+'-d');if(v&&!c.orig)c.orig=[v.innerHTML,d?d.innerHTML:''];if(v)v.textContent=c.fmtV(c.act[i]);
  if(d)d.innerHTML=`<span class="muted">${esc(c.fmtX?c.fmtX(c.xs[i]):fmtD(c.xs[i],true))}${c.exp?` · attendu ${esc(c.fmtV(c.exp[i]))}`:''}</span>`}
function unscrub(el){const id=el.dataset.chart;const c=CH[id];if(!c)return;el.querySelector('.c-scrub').hidden=true;el.querySelector('.c-sd').hidden=true;if(c.orig){const v=$('#'+id+'-v'),d=$('#'+id+'-d');if(v)v.innerHTML=c.orig[0];if(d)d.innerHTML=c.orig[1];c.orig=null}}
const hero=(id,label,v,d)=>`<div class="hero"><p class="eyebrow">${label}</p><div class="hero-v" id="${id}-v">${v}</div><div class="hero-d" id="${id}-d">${d}</div></div>`;

/* Ligne d'habitude à glisser */
function swipeRow(h,d){const on=habitDone(h.id,d);const i=idOf(h.identityId);
  const sub=freqOf(h)==='weekly'?`${weekCount(h,monday(d))}/${h.perWeek||3} cette semaine`:streakTxt(h);
  return `<div class="swipe ${on?'done':''}" data-swipe="${h.id}" data-date="${d}" data-done="${on?1:0}"><div class="swipe-bg">${on?'Annuler':'✓ Fait'}</div>
  <div class="swipe-fg row">${av(h.icon,idColor(h.identityId),'',h.name)}<div class="m"><span class="t">${esc(h.name||'Habitude sans nom')}</span><span class="s">${i?esc(i.name)+' · ':''}${sub}</span></div>
  <button class="hcheck ${on?'on':''}" data-act="habit-toggle" data-id="${h.id}" data-date="${d}" aria-label="${on?'Annuler':'Valider'} ${esc(h.name)}">${ICON.check}</button></div></div>`}

/* ---------- Vue : Aujourd'hui ---------- */
function viewToday(){
  const t=today(),mon=monday(t),q=weekQuarter(mon),reset=diffDays(t,addDays(mon,7));
  const title=parse(t).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const items=todoItems(t),done=items.filter(i=>i.done).length;
  const hs=habits().filter(h=>visibleOn(h,t)&&t>=hStart(h)),hd=hs.filter(h=>habitDone(h.id,t)).length;
  const ws=weekSummary(mon),pw=weekSummary(addDays(mon,-7));const carry=todoItems(addDays(t,-1)).filter(i=>!i.done);
  return `<header class="page-head"><h1 class="h1 cap">${esc(title)}</h1></header>
  <p class="eyebrow">Semaine ${isoWeek(t).w} · ${qLabel(q)} · nouvelle semaine dans ${plural(reset,'jour')}</p>
  <section class="stats">
    ${stat('Votes du jour',`${hd}<small> / ${hs.length}</small>`,hs.length?`${pctS(hd/hs.length)} des habitudes`:'Aucune habitude prévue')}
    ${stat('To-do',`${done}<small> / ${items.length}</small>`,items.length?(done===items.length?'Tout est fait':`${plural(items.length-done,'tâche')} à faire`):'Rien de noté')}
    ${stat('Semaine',ws.score==null?'—':pctS(ws.score),ws.score!=null&&pw.score!=null?dPts(ws.score-pw.score,'vs sem. dernière'):`jour ${diffDays(mon,t)+1} / 7`)}
  </section>
  <div class="cols">
    <section class="sec"><div class="sec-h"><h2>Habitudes</h2><span class="hint">Glisse vers la droite pour valider</span></div>
      ${hs.length?`<div class="list">${hs.map(h=>swipeRow(h,t)).join('')}</div>`:`<p class="empty">Aucune habitude aujourd'hui. Ajoute-en une sous une identité.</p>`}
    </section>
    <section class="sec"><div class="sec-h"><h2>To-do</h2>${carry.length?`<button class="act" data-act="carry">Reprendre ${plural(carry.length,'tâche')} d'hier</button>`:''}</div>
      <form class="todo-add" data-form="todo"><input id="todo-new" placeholder="Ajouter une tâche" autocomplete="off" aria-label="Nouvelle tâche"><button class="btn sm" type="submit">Ajouter</button></form>
      ${items.length?`<ul class="todo">${items.map(i=>`<li class="${i.done?'done':''}"><button class="hcheck ${i.done?'on':''}" data-act="todo-toggle" data-id="${i.id}" aria-label="${i.done?'Décocher':'Cocher'} « ${esc(i.text)} »">${ICON.check}</button><span>${esc(i.text)}</span><button class="x" data-act="todo-del" data-id="${i.id}" aria-label="Supprimer">${ICON.x}</button></li>`).join('')}</ul>`:`<p class="empty">Le matin, note les 3 à 5 tâches qui comptent aujourd'hui.</p>`}
    </section>
  </div>
  <div class="cols">
    <section class="sec">${weekFocus(mon)}</section>
    <section class="sec">${focusVideo()}</section>
  </div>`}
function focusVideo(){
  const prod=videos().filter(v=>v.stage!=='publie'&&v.stage!=='idee').sort((a,b)=>(a.publishDate||'9999').localeCompare(b.publishDate||'9999'));
  const v=prod[0];
  if(!v)return `<div class="sec-h"><h2>Studio</h2></div><p class="empty">Aucune vidéo en production.</p><button class="btn-sec" data-act="tab" data-tab="studio">Ouvrir le studio</button>`;
  const dl=deadline(v);
  return `<div class="sec-h"><h2>Prochaine vidéo</h2><button class="act" data-act="tab" data-tab="studio">Studio</button></div>
  <button class="row" data-act="edit-video" data-id="${v.id}">${av('🎬','#E8B10E')}<span class="m"><span class="t">${esc(v.title||'Sans titre')}</span><span class="s">${esc(STAGE_LABEL[v.stage])}${dl?` · à boucler avant le ${fmtD(dl)}`:''}</span></span><span class="r"><b>${v.publishDate?fmtD(v.publishDate):'Sans date'}</b>${tag(videoStatus(v))}</span></button>
  ${bar(stageIdx(v.stage)/(STAGES.length-1),null)}`}
function proofRow(k,mon){const s=krWeekScore(k,mon);return `<button class="row" ${editAttr(k)}>${av(krIcon(k),idColor(k.identityId),'sm',krTitle(k))}<span class="m"><span class="t">${esc(krTitle(k))}</span><span class="s">${weekSub(k,mon)}</span></span><span class="r"><b>${weekVal(k,mon)}</b><span class="muted">${s==null?'':pctS(s)}</span></span></button>`}
function weekFocus(mon){const all=allProofs(weekQuarter(mon)).map(k=>({k,s:krWeekScore(k,mon)})).filter(x=>x.s!=null);
  if(!all.length)return `<div class="sec-h"><h2>Cette semaine</h2></div><p class="empty">Rien à tenir cette semaine. Planifie des étapes ou ajoute des habitudes dans Identités.</p><button class="btn-sec" data-act="tab" data-tab="okr">Ouvrir Identités</button>`;
  const open=all.filter(x=>x.s<1).sort((a,b)=>a.s-b.s);
  return `<div class="sec-h"><h2>Cette semaine</h2><button class="act" data-act="tab" data-tab="okr">${all.length-open.length}/${all.length} tenues</button></div>
  ${open.length?`<div class="list">${open.slice(0,6).map(({k})=>proofRow(k,mon)).join('')}</div>`:'<p class="empty">Toutes les preuves de la semaine sont tenues.</p>'}`}

/* ---------- Vue : Identités (semaine / trimestre) ---------- */
function okrSeries(q,range){const{start,end}=qRange(q);const t=today();let a=start,b=end;
  if(range!=='q'){b=minD(t,end);a=addDays(b,range==='w'?-6:-29);if(a<start)a=start}
  const xs=[];for(let d=a;d<=b;d=addDays(d,1))xs.push(d);const krs=allProofs(q);
  return{xs,act:xs.map(d=>d>t?null:avg(krs.map(k=>krProgressAt(k,d)))),exp:xs.map(d=>avg(krs.map(k=>krExpectedAt(k,d))))}}
function viewOKR(){
  const mode=S.okrMode,ids=identities(),cur=monday(today());
  const mon=S.week,q=mode==='week'?weekQuarter(mon):S.quarter;
  const nav=mode==='week'?qnav('week',`Sem. ${isoWeek(mon).w}`):qnav('quarter',qLabel(q));
  const head=`<header class="page-head"><h1 class="h1">Qui je deviens</h1><div class="head-r">${pills('okr-mode',mode,[['week','Semaine'],['quarter','Trimestre']])}${nav}</div></header>`;
  if(!ids.length)return head+`<div class="empty-state"><h2>Qui veux-tu être ?</h2><p class="note">Commence par l'identité que tu veux incarner (« Je suis un champion »). Les objectifs du trimestre et leurs preuves en découlent.</p><button class="btn" data-act="new-identity">Créer ma première identité</button></div>`;
  let top='',scoreOf;
  if(mode==='week'){const ws=weekSummary(mon),pw=weekSummary(addDays(mon,-7));const rev=S.data.reviews[isoWeek(mon).key];
    const label=`Semaine ${isoWeek(mon).w} · ${mon===cur?'en cours':mon>cur?'à venir':'archivée'}`;
    const d1=ws.score!=null&&pw.score!=null?dPts(ws.score-pw.score,'vs semaine précédente'):'';
    const d2=mon===cur?`<span class="muted">jour ${diffDays(mon,today())+1}/7 · remise à zéro lundi</span>`:`<span class="muted">du ${fmtD(mon)} au ${fmtD(addDays(mon,6))}${rev&&rev.snapshot?' · sauvegardée':''}</span>`;
    const days=[...Array(7)].map((_,i)=>addDays(mon,i)),t=today();
    const strip=`<div class="weeks" role="group" aria-label="Semaines de ${qLabel(q)}">${weeksOfQuarter(q).map(m=>{const sc=m>cur?null:weekSummary(m).score;return `<button class="wk ${m===mon?'on':''}" data-act="goto-week" data-mon="${m}" ${m>cur?'disabled':''} aria-label="Semaine ${isoWeek(m).w}"><span>S${isoWeek(m).w}</span><b>${sc==null?'—':pctS(sc)}</b></button>`}).join('')}</div>`;
    top=hero('okr',label,ws.score==null?'—':pctS(ws.score),[d1,d2].filter(Boolean).join('<span class="muted">·</span>'))
      +lineChart('okr',{xs:days,act:days.map(d=>d>t?null:weekScoreAt(mon,d)),exp:days.map((_,i)=>(i+1)/7),fmtX:d=>parse(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'}),live:mon===cur})
      +`<p class="hint">La courbe suit ta semaine jour après jour ; les pointillés montrent un rythme régulier. Chaque lundi, tout repart à zéro et la semaine terminée est sauvegardée ici :</p>`+strip;
    scoreOf=i=>{const s=ws.per[i.id];return s==null?null:{v:s,d:pw.per[i.id]!=null?s-pw.per[i.id]:null}};
  }else{const sum=qSummary(q),range=S.range.okr;
    if(sum.krs.length){const s=okrSeries(q,range);let y0=0,y1=1;
      if(range!=='q'){const vals=[...s.act,...s.exp].filter(v=>v!=null);const mn=Math.min(...vals),mx=Math.max(...vals);const pd=Math.max(.04,(mx-mn)*.2);y0=Math.max(0,mn-pd);y1=Math.min(1,mx+pd);if(y1-y0<.1)y1=Math.min(1,y0+.1)}
      const li=s.act.reduce((m,v,i)=>v!=null?i:m,-1),fi=s.act.findIndex(v=>v!=null);const ch=fi>=0&&li>=0?s.act[li]-s.act[fi]:0;
      const per={w:'sur 7 jours',m:'sur 30 jours',q:'depuis le début du trimestre'}[range];
      top=hero('okr',`Progression ${qLabel(q)}`,pctS(sum.actual),`${dPts(ch,per)}<span class="muted">·</span>${dPts(sum.actual-sum.expected,`vs attendu (${pctS(sum.expected)})`)}`)+lineChart('okr',{...s,y0,y1})+pills('okr-range',range,[['w','1S'],['m','1M'],['q','Trimestre']]);
    }else top=`<p class="note" style="margin-top:16px">Aucune preuve pour ${qLabel(q)}. Ajoute un objectif sous une identité, puis ses preuves.</p>`;
    scoreOf=i=>{const x=sum.per.find(p=>p.id===i.id);return x&&x.p!=null?{v:x.p,d:x.p-x.e}:null}}
  const wk=weekStats(mode==='week'?mon:cur);
  const overview=`<section class="sec"><div class="sec-h"><h2>Identités</h2><span class="head-r"><button class="act" data-act="open-templates">Modèles</button><button class="act" data-act="new-identity">Ajouter</button></span></div><div class="list">${ids.map(i=>{const sc=scoreOf(i);return `<button class="row" data-act="jump" data-id="${i.id}">${av(i.icon,i.color,'',i.name)}<span class="m"><span class="t">${esc(i.name||'Identité sans nom')}</span><span class="s">${esc(i.statement||'')}${i.statement?' · ':''}${plural(wk.votes[i.id]||0,'vote')} ${mode==='week'?'cette semaine':'cette semaine'}</span></span><span class="r">${sc==null?'<b class="muted">—</b><span class="muted">rien à tenir</span>':`<b>${pctS(sc.v)}</b>${sc.d!=null?dPts(sc.d):''}`}</span></button>`}).join('')}</div></section>`;
  return head+top+overview+ids.map(i=>identityBlock(i,q,mode,mon,scoreOf(i))).join('')}
function identityBlock(i,q,mode,mon,sc){
  const objs=objectivesOf(q,i.id);const loose=virtualKrs(q).filter(v=>v.identityId===i.id);const beliefs=(i.beliefs||'').split('\n').map(s=>s.trim()).filter(Boolean);
  return `<section class="id-sec" id="id-${esc(i.id)}">
  <div class="id-head">${av(i.icon,i.color,'lg',i.name)}<div><h2>${esc(i.name||'Identité sans nom')}</h2><p class="st">${i.statement?esc(i.statement):'<span class="faint">Écris ta phrase d\'identité</span>'}${sc?` · <b style="color:var(--fg)">${pctS(sc.v)}</b> ${mode==='week'?'cette semaine':'du trimestre'}`:''}</p></div><button class="btn-sec" data-act="edit-identity" data-id="${i.id}">Modifier</button></div>
  ${beliefs.length||i.vision?`<div class="id-meta">${beliefs.map(b=>`<p>${esc(b)}</p>`).join('')}${i.vision?`<p><b>Vision</b>${esc(i.vision)}</p>`:''}</div>`:''}
  ${objs.map(o=>`<div class="obj"><div class="obj-h">${o.icon?`<span aria-hidden="true">${esc(o.icon)}</span>`:''}<button data-act="edit-objective" data-id="${o.id}">${esc(o.title||'Objectif sans titre')}</button>${o.videoId&&S.data.videos[o.videoId]?`<button class="pill-mini" data-act="edit-video" data-id="${o.videoId}">Fiche vidéo</button>`:''}</div>
    ${krsOf(o.id).map(k=>krRow({...k,identityId:i.id},i.color,mode,mon)).join('')}${addBtn('new-kr','Ajouter une preuve',`data-id="${o.id}"`)}</div>`).join('')}
  ${loose.length?`<div class="obj"><div class="obj-h"><span aria-hidden="true">🔁</span><button data-act="tab" data-tab="habits">Habitudes</button></div>${loose.map(k=>krRow(k,i.color,mode,mon)).join('')}</div>`:''}
  <div class="obj obj-add">${addBtn('new-objective',`Objectif pour ${qLabel(q)}`,`data-id="${i.id}"`)}${addBtn('new-habit','Habitude',`data-id="${i.id}"`)}</div></section>`}
function krRow(k,color,mode,mon){const kind=kindOf(k);const cur=monday(today());const isCur=mon===cur;const actDate=mode==='week'&&mon<cur?addDays(mon,6):today();
  let rb,rs,sub,bp,be=null;
  if(mode==='week'){const t=krWeekTarget(k,mon),s=krWeekScore(k,mon);sub=weekSub(k,mon);rb=weekVal(k,mon);
    rs=kind==='level'?`${fmtN(k.current)} ${esc(k.unit||'')}`:kind==='milestone'?'':(t>0?pctS(s):'pas prévu');
    bp=kind==='milestone'?(k.done&&k.doneAt<=addDays(mon,6)?1:0):(s||0);if(isCur&&kind!=='milestone'&&t>0)be=(diffDays(mon,today())+1)/7}
  else{rb=kind==='milestone'?(k.done?'Faite':'À faire'):kind==='level'?`${fmtN(krValue(k))} / ${fmtN(krTarget(k))}`:`${fmtN(krValue(k))} / ${fmtN(krTarget(k))}`;rs=pctS(krProgress(k));sub=`${tag(krStatus(k))} · ${quarterSub(k)}`;bp=krProgress(k);be=krExpectedAt(k,today())}
  let ctl='';
  if(kind==='habit'&&habitOf(k)&&(mode==='quarter'||isCur)){const on=habitDone(k.habitId,today());ctl=`<button class="hcheck ${on?'on':''}" data-act="habit-toggle" data-id="${k.habitId}" data-date="${today()}" aria-label="${on?'Annuler':'Valider'} aujourd'hui">${ICON.check}</button>`}
  else if(kind==='qty')ctl=`<button class="step" data-act="qty-open" data-id="${k.id}" aria-label="Ajouter des ${esc(k.unit||'unités')}">+</button>`;
  else if(kind==='milestone')ctl=`${!k.done&&k.week!==mon&&mode==='week'?`<button class="pill-mini" data-act="plan-week" data-id="${k.id}" data-mon="${mon}">Cette semaine</button>`:''}<button class="hcheck ${k.done?'on':''}" data-act="kr-done" data-id="${k.id}" data-date="${actDate}" aria-label="${k.done?'Marquer à faire':'Marquer faite'}">${ICON.check}</button>`;
  else if(kind==='level')ctl=`<button class="step" data-act="kr-step" data-id="${k.id}" data-d="-1" aria-label="Retirer 1">−</button><button class="step" data-act="kr-step" data-id="${k.id}" data-d="1" aria-label="Ajouter 1">+</button>`;
  const form=kind==='qty'&&S.qtyOpen===k.id?`<form class="qty-form" data-form="qty" data-id="${k.id}" data-date="${actDate}"><input id="qty-${k.id}" type="number" step="any" inputmode="decimal" placeholder="Combien de ${esc(k.unit||'unités')} ?" aria-label="Quantité à ajouter" required><button class="btn sm" type="submit">Ajouter</button><button class="btn-sec" type="button" data-act="qty-close">Annuler</button></form>`:'';
  const faded=mode==='week'&&kind==='milestone'&&((k.done&&k.doneAt<mon)||(!k.done&&k.week&&k.week>mon));
  return `<div class="kr ${faded?'faded':''}"><div class="row"><button class="row-l" ${editAttr(k)}>${av(krIcon(k),color,'sm',krTitle(k))}<span class="m"><span class="t">${esc(krTitle(k))}</span><span class="s">${sub}</span></span></button><span class="kr-r"><span class="r"><b>${rb}</b><span class="muted">${rs}</span></span>${ctl}</span></div>${bar(bp,be,color)}${form}</div>`}

/* ---------- Vue : Habitudes ---------- */
function viewHabits(){
  const mon=S.habitWeek,t=today(),hs=habits(),range=S.range.habits;const days=[...Array(7)].map((_,i)=>addDays(mon,i));
  const head=`<header class="page-head"><h1 class="h1">Habitudes</h1><button class="btn sm" data-act="new-habit">Nouvelle habitude</button></header>`;
  if(!hs.length)return head+`<div class="empty-state"><h2>Aucune habitude pour l'instant</h2><p class="note">Une habitude est un petit geste répété qui prouve ton identité. Le plus simple : ajoute une preuve de type « Habitude » sous un objectif, l'habitude est créée avec.</p><button class="btn" data-act="new-habit">Créer une habitude</button></div>`;
  const ws=weekStats(monday(t)),pw=weekStats(addDays(monday(t),-7));
  const n=range==='w'?7:range==='m'?30:90;const xs=[...Array(n)].map((_,i)=>addDays(t,i-n+1));const act=xs.map(dayScore);
  const todayHs=hs.filter(h=>visibleOn(h,t)&&t>=hStart(h));
  const rows=hs.map(h=>{const c=idColor(h.identityId);const r=rate30(h);return `<tr><td><button class="hname" data-act="edit-habit" data-id="${h.id}">${av(h.icon,c,'sm',h.name)}<span><b>${esc(h.name||'Sans nom')}</b><small>${esc(freqLabel(h))}</small></span></button></td>
    ${days.map(d=>{const on=habitDone(h.id,d),fx=freqOf(h)==='weekly'||fixedOn(h,d),fut=d>t||d<hStart(h);return `<td><button class="cell ${on?'on':''} ${!fx&&!on?'off':''}" ${fut?'disabled':''} data-act="habit-toggle" data-id="${h.id}" data-date="${d}" aria-label="${esc(h.name)} le ${fmtD(d)}">${ICON.check}</button></td>`}).join('')}
    <td class="sm">${freqOf(h)==='weekly'?`${weekCount(h,mon)}/${h.perWeek||3}`:streakTxt(h).replace('série ','')}</td><td class="sm">${r==null?'—':pctS(r)}</td></tr>`}).join('');
  return head+hero('hab','Habitudes tenues cette semaine',ws.rate==null?'—':pctS(ws.rate),ws.rate!=null&&pw.rate!=null&&pw.sched?dPts(ws.rate-pw.rate,'vs semaine dernière'):`<span class="muted">${ws.done} votes sur ${ws.sched} prévus</span>`)
  +lineChart('hab',{xs,act,exp:null})+pills('hab-range',range,[['w','1S'],['m','1M'],['t','3M']])+
  `<div class="cols"><section class="sec"><div class="sec-h"><h2>Aujourd'hui</h2><span class="hint">Glisse à droite pour valider, à gauche pour annuler</span></div><div class="list">${todayHs.map(h=>swipeRow(h,t)).join('')||'<p class="empty">Rien de prévu aujourd\'hui.</p>'}</div></section>

/* ---------- Vue : Studio YouTube (année en cours) ---------- */
function viewStudio(){

  const n=publishedInYear(y).length,g=+st.goals[y]||0,rem=Math.max(0,g-n),daysLeft=diffDays(t,`${y}-12-31`)+1;

  return `<header class="page-head"><h1 class="h1">Studio</h1><button class="btn sm" data-act="new-video">Nouvelle vidéo</button></header>
  <p class="eyebrow">${esc(st.channel)} · vidéo-essais longs</p>

function vCard(v){const st=videoStatus(v),i=stageIdx(v.stage);

  <button class="vc-open" data-act="edit-video" data-id="${v.id}"><span class="vc-t">${esc(v.title||'Sans titre')}</span>${v.oeuvre?`<span class="vc-o">${esc(v.oeuvre)}</span>`:''}</button>
  <div class="vc-meta">${tag(st)}${v.publishDate&&v.stage!=='publie'?`<span class="muted">${fmtD(v.publishDate)}</span>`:''}${v.stage==='publie'&&v.stats&&v.stats.views?`<span class="muted">${fmtN(v.stats.views)} vues</span>`:''}</div>
  <div class="vc-move">${i>1?`<button class="step" data-act="stage" data-id="${v.id}" data-d="-1" aria-label="Revenir à ${esc(STAGES[i-1].label)}">‹</button>`:'<span></span>'}<span class="faint sm">${v.complexity?esc(CPLX[v.complexity]):''}</span>${i<STAGES.length-1?`<button class="step" data-act="stage" data-id="${v.id}" data-d="1" aria-label="Passer à ${esc(STAGES[i+1].label)}">›</button>`:'<span></span>'}</div></article>`}
function viewPipeline(){
  const vs=videos();const y=String(new Date().getFullYear());
  return `<div class="kanban">${STAGES.filter(s=>s.k!=='idee').map(s=>{let col=vs.filter(v=>v.stage===s.k);
    if(s.k==='publie')col=col.filter(v=>(v.publishDate||'').startsWith(y));
    col.sort(s.k==='publie'?(a,b)=>(b.publishDate||'').localeCompare(a.publishDate||''):(a,b)=>(a.publishDate||'9999').localeCompare(b.publishDate||'9999')||byCreated(a,b));
    return `<section class="kcol" data-drop="${s.k}"><div class="kcol-h"><b>${s.label}${s.k==='publie'?` ${y}`:''}</b><span>${col.length}</span></div>${col.map(vCard).join('')}${s.k==='angle'?addBtn('new-video','Ajouter'):''}</section>`}).join('')}</div>
  <p class="hint">Glisse une carte d'une colonne à l'autre, ou utilise ‹ ›. Les sujets pas encore lancés sont dans l'onglet Idées.</p>`}
function viewGantt(){
  const t=today(),y=new Date().getFullYear(),Y0=`${y}-01-01`,Y1=`${y}-12-31`;
  const rows=videos().filter(v=>v.publishDate&&v.publishDate>=Y0&&v.publishDate<=Y1&&(v.stage!=='publie'||v.publishDate>=addDays(t,-45))).map(v=>({v,p:plan(v)})).sort((a,b)=>a.v.publishDate.localeCompare(b.v.publishDate));
  if(!rows.length)return `<div class="empty-state"><h2>Rien à planifier en ${y}</h2><p class="note">Donne une date de sortie ${y} à une vidéo : le rétroplanning se calcule tout seul à partir de tes réglages et de la complexité.</p></div>`;
  let start=rows.reduce((m,x)=>x.p.start<m?x.p.start:m,t);start=maxD(addDays(start,-7),Y0);start=minD(start,t).slice(0,8)+'01';
  const end=Y1;const DW=7,W=(diffDays(start,end)+1)*DW,x=s=>clamp(diffDays(start,s),0,diffDays(start,end)+1)*DW;
  let months='',lines='';for(let d=parse(start);ymd(d)<=end;d=new Date(d.getFullYear(),d.getMonth()+1,1)){const s=ymd(d);months+=`<div class="g-month" style="left:${x(s)}px"><span>${d.toLocaleDateString('fr-FR',{month:'long'})}</span></div>`;lines+=`<div class="g-month" style="left:${x(s)}px"></div>`}
  const todayL=t>=start&&t<=end?`<div class="g-today" style="left:${x(t)+DW/2}px" title="Aujourd'hui"></div>`:'';
  const body=rows.map(({v,p})=>{const bars=PHASES.map(ph=>{const a=p[ph.k];if(a.end<start||a.start>end)return '';const l=x(a.start),w=Math.max(4,x(a.end)-l-2);return `<div class="g-bar ph-${ph.k}" style="left:${l}px;width:${w}px" title="${esc(ph.label)} : ${fmtD(a.start)} → ${fmtD(addDays(a.end,-1))}"></div>`}).join('');
    const pk=p.packaging,pl=x(pk.start),pw=Math.max(4,x(pk.end)-pl-2);
    return `<div class="g-row"><div class="g-lab"><button data-act="edit-video" data-id="${v.id}">${esc(v.title||'Sans titre')}</button><span>${esc(STAGE_LABEL[v.stage])} · sortie ${fmtD(v.publishDate)}</span></div><div class="g-tr" style="width:${W}px">${lines}${bars}<div class="g-pack" style="left:${pl}px;width:${pw}px" title="Titre & miniature, en parallèle"></div><div class="g-pub" style="left:${x(v.publishDate)+DW/2}px" title="Publication le ${fmtD(v.publishDate,true)}"></div>${todayL}</div></div>`}).join('');
  return `<div class="gantt-wrap"><div class="gantt"><div class="g-row g-head"><div class="g-lab">Vidéo</div><div class="g-tr" style="width:${W}px">${months}${todayL}</div></div>${body}</div></div>
  <div class="legend">${PHASES.map(p=>`<span><i class="ph-${p.k}"></i>${p.label}</span>`).join('')}<span><i class="ph-packaging"></i>Titre & miniature</span><span><i style="background:var(--fg);transform:rotate(45deg)"></i>Publication</span><span><i style="background:var(--neg);width:2px"></i>Aujourd'hui</span></div>`}
function viewFrise(){

  ${undated.length?`<p class="hint" style="margin-top:12px">${plural(undated.length,'vidéo')} en production sans date de sortie.</p>`:''}</section>`}
function viewIdeas(){
  const all=ideas();const cats=['Tout',...new Set(all.map(i=>i.category||'Autre'))];const tierRank={S:0,A:1,B:2,C:3};
  let rows=all.filter(i=>S.ideaCat==='Tout'||(i.category||'Autre')===S.ideaCat);
  rows.sort((a,b)=>{const sa=ideaScore(a),sb=ideaScore(b);if(sa!=null||sb!=null)return (sb??-1)-(sa??-1);return (tierRank[a.tier]??9)-(tierRank[b.tier]??9)||(a.text||'').localeCompare(b.text||'')});

  ${pills('idea-cat',S.ideaCat,cats.map(c=>[c,c]))}
  <p class="hint" style="margin:10px 0">Score = potentiel × envie ÷ effort (notes de 1 à 5). Les idées notées remontent en tête.</p>
  ${rows.length?`<div class="list" id="idea-list">${rows.map(i=>{const sc=ideaScore(i);return `<button class="idea" data-act="edit-idea" data-id="${i.id}" data-text="${esc(((i.text||'')+' '+(i.notes||'')+' '+(i.category||'')).toLowerCase())}"><span class="m"><span class="txt">${esc(i.text)}</span><span class="cat">${esc(i.category||'Autre')}${i.status?` · ${esc(i.status)}`:''}</span></span><span class="tier ${esc(i.tier||'')}">${esc(i.tier||'–')}</span><span class="score">${sc==null?'':sc.toString().replace('.',',')}</span></button>`}).join('')}</div>`:`<p class="empty">La banque est vide.</p>`}`}
function viewStats(){
  const pub=videos().filter(v=>v.stage==='publie').sort((a,b)=>(b.publishDate||'').localeCompare(a.publishDate||''));
  if(!pub.length)return `<p class="empty" style="margin-top:20px">Les statistiques apparaissent dès qu'une vidéo passe à « Publiée ».</p>`;
  const views=pub.map(v=>+(v.stats&&v.stats.views)||0);const tot=views.reduce((a,b)=>a+b,0),avgV=tot/pub.length,mx=Math.max(1,...views);
  const subs=pub.reduce((a,v)=>a+(+(v.stats&&v.stats.subs)||0),0);
  const val=(v,f,suf='')=>v.stats&&v.stats[f]!=null&&v.stats[f]!==''?fmtN(v.stats[f])+suf:'—';
  return `<section class="stats">${stat('Vues cumulées',fmtN(tot),plural(pub.length,'vidéo'))}${stat('Moyenne par vidéo',fmtN(avgV),'référence de la chaîne')}${stat('Abonnés gagnés',subs?fmtN(subs):'—',subs?'vidéos renseignées':'à saisir dans les fiches')}</section>

  <section class="sec"><div class="sec-h"><h2>Détail</h2></div><div class="table-wrap"><table class="data"><thead><tr><th>Date</th><th>Vidéo</th><th>Durée</th><th>Vues</th><th>Rétention</th><th>CTR</th><th>Abonnés</th></tr></thead><tbody>${pub.map(v=>`<tr><td>${fmtD(v.publishDate,true)}</td><td><button class="link" data-act="edit-video" data-id="${v.id}">${esc(v.title||'Sans titre')}</button></td><td>${esc(v.length||'—')}</td><td>${val(v,'views')}</td><td>${val(v,'retention',' %')}</td><td>${val(v,'ctr',' %')}</td><td>${val(v,'subs')}</td></tr>`).join('')}</tbody></table></div></section>`}

const F=(coll,id,path,label,o={})=>{const doc=S.data[coll][id]||{};const v=path.split('.').reduce((a,k)=>a==null?a:a[k],doc);const fid=`f-${coll}-${id}-${path.replace(/\./g,'-')}`;const common=`id="${esc(fid)}" data-bind="${coll}:${id}:${path}"${o.type==='number'?' data-type="number"':''}${o.ph?` placeholder="${esc(o.ph)}"`:''}`;
  let input;if(o.area)input=`<textarea ${common} rows="${o.rows||3}">${esc(v??'')}</textarea>`;
  else if(o.options)input=`<select ${common}>${o.options.map(([k,l])=>`<option value="${esc(k)}" ${String(v??'')===String(k)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  else input=`<input ${common} type="${o.type||'text'}" ${o.type==='number'?'step="any" inputmode="decimal"':''} value="${esc(v??'')}">`;

  const base=Date.now();

    put('krs',kid,{title:it.title||'',icon:it.icon||'',objectiveId:oid,kind,target:kind==='milestone'?1:kind==='habit'?null:(+it.target||null),unit:it.unit||'',weekTarget:+it.weekTarget||null,done:false,log:{},start:0,current:0,createdAt:new Date(base+(i+1)*1000).toISOString()});
    if(kind==='habit'){const hid=makeHabitForKr(kid);const h=hid&&S.data.habits[hid];if(h&&it.freq)put('habits',hid,{...h,freq:it.freq,days:it.days||[],perWeek:it.perWeek||3})}});
  return oid}

  const vid=!!o.videoId;const id=create('templates',{name:vid?'Vidéo longue':(o.title||'Modèle'),objTitle:vid?'Vidéo':(o.title||''),icon:o.icon||'',identityId:o.identityId||'',video:vid,items});
