function create(coll,data){const id=uid();put(coll,id,{...data,createdAt:nowIso()});return id}
function makeHabitForKr(kid){const k=S.data.krs[kid];if(!k)return null;const o=S.data.objectives[k.objectiveId]||{};const hid=create('habits',{name:(k.title||'').trim(),identityId:o.identityId||'',freq:'daily',days:[],perWeek:3,icon:k.icon||'',fromKr:kid});put('krs',kid,{...k,kind:'habit',habitId:hid,target:null});return hid}
function linkHabit(hid,oid){const h=S.data.habits[hid];if(!h)return;const q=qKey(today());const ex=list('krs').find(k=>k.habitId===hid&&kindOf(k)==='habit'&&krQuarter(k)===q);
  if(!oid){if(ex){del('krs',ex.id);if(h.fromKr===ex.id)put('habits',hid,{...h,fromKr:null})}}
  else if(ex)put('krs',ex.id,{...ex,objectiveId:oid});
  else create('krs',{title:'',icon:'',objectiveId:oid,kind:'habit',habitId:hid,target:null});
  setTimeout(renderSheet,0)}
/* L'habitude créée pour une preuve disparaît avec elle ; si elle a déjà été cochée, elle reste dans Habitudes */
function dropOwnHabit(k){const h=habitOf(k);if(!h||h.fromKr!==k.id)return;if(hDates(h.id).length){put('habits',h.id,{...h,fromKr:''});toast(`« ${h.name||'Habitude'} » reste dans Habitudes : elle a déjà des validations`)}else del('habits',h.id)}
function repairHabits(){for(const h of list('habits')){const k=h.fromKr&&S.data.krs[h.fromKr];if(!k||kindOf(k)==='habit'||k.habitId!==h.id)continue;
    if(hDates(h.id).length)put('habits',h.id,{...h,fromKr:''});else del('habits',h.id);put('krs',k.id,{...k,habitId:''})}}
function migrateLevels(){for(const k of list('krs').filter(k=>kindOf(k)==='level')){const o=S.data.objectives[k.objectiveId]||{};const c=(k.createdAt||nowIso()).slice(0,10);const h={...(k.history||{})};
    if(+k.start&&!Object.keys(h).some(d=>d<=c))h[c]=+k.start;if(!Object.keys(h).length&&k.current!=null&&k.current!=='')h[today()]=+k.current;
    put('metrics','lv-'+k.id,{name:k.title||'Indicateur',icon:k.icon||'📈',type:'number',unit:k.unit||'',target:+k.target||null,identityId:o.identityId||'',history:h,createdAt:k.createdAt||nowIso(),fromKr:k.id});removeKr(k.id)}}
/* Ancien champ libre « 3 priorités » : découpé une fois en trois priorités à identifiant stable */
function migratePrios(){for(const rv of list('reviews')){if(rv.prios||!rv.next||!String(rv.next).trim())continue;const ps={};String(rv.next).split('\n').map(x=>x.replace(/^\s*(\d+[.)]|[-•*])\s*/,'').trim()).filter(Boolean).slice(0,3).forEach((text,i)=>ps['p'+(i+1)]={text,done:false});put('reviews',rv.id,{...rv,prios:ps})}}
function removeKr(kid){const k=S.data.krs[kid];if(!k)return;const h=S.data.habits[k.habitId];if(h&&h.fromKr===kid)del('habits',h.id);del('krs',kid)}

  'metric-dir':a=>{const m=S.data.metrics[a.dataset.id];if(!m)return;put('metrics',m.id,{...m,dir:a.dataset.v});renderSheet()},
  'metric-sel':a=>{S.metricSel=a.dataset.v;renderMain(true)},
  'mpt':a=>{const c=a.dataset.c;const v=document.getElementById(c+'-v'),d=document.getElementById(c+'-d');if(v){v.textContent=a.dataset.v;const e=v.previousElementSibling;if(e)e.textContent='Mesure sélectionnée'}if(d)d.innerHTML=`<span class="muted">Mesure du ${esc(a.dataset.d)}</span>`;document.querySelectorAll('.m-pt.on').forEach(x=>x.classList.remove('on'));a.classList.add('on')},
  'metric-type':a=>{const m=S.data.metrics[a.dataset.id];if(!m||m.type===a.dataset.v)return;put('metrics',m.id,{...m,type:a.dataset.v,target:null});renderSheet()},
  'metric-del':a=>{const m=S.data.metrics[a.dataset.id];if(!m)return;const history={...(m.history||{})};delete history[a.dataset.d];put('metrics',m.id,{...m,history});renderSheet()},
  'del-metric':a=>{del('metrics',a.dataset.id);dropSheet()},
  'id-status':a=>{const i=S.data.identities[a.dataset.id];if(!i)return;const v=i.status===a.dataset.v?'':a.dataset.v;const t=today();const pauses=[...(i.pauses||[])];const open=pauses.findIndex(x=>!x.to);
    if(v==='pause'&&open<0)pauses.push({from:t,to:null});
    if(v!=='pause'&&open>=0){const end=addDays(t,-1);if(end<pauses[open].from)pauses.splice(open,1);else pauses[open]={...pauses[open],to:end}}
    put('identities',i.id,{...i,status:v,pauses});renderSheet()},
  'obj-res':a=>{const o=S.data.objectives[a.dataset.id];if(!o)return;put('objectives',o.id,{...o,resType:a.dataset.v});renderSheet()},
  'day-sleep':a=>{const t=a.dataset.date||today(),n=+a.dataset.n;setDay(t,{sleep:dayOf(t).sleep===n?null:n})},
  'day-mood':a=>{const t=a.dataset.date||today(),v=a.dataset.v;setDay(t,{mood:dayOf(t).mood===v?'':v})},
  'qty-step':a=>{const k=S.data.krs[a.dataset.id];if(!k)return;stepQty(k,a.dataset.date||today(),+a.dataset.d,a.dataset.from);if(S.sheet)renderSheet()},
  'new-identity':()=>{const n=identities().length;const id=create('identities',{name:'',statement:'',beliefs:'',vision:'',icon:'',color:COLORS[n%COLORS.length],order:n});openSheet('identity','identities',id,true)},
  'edit-identity':a=>openSheet('identity','identities',a.dataset.id),
  'set-color':a=>{const i=S.data.identities[a.dataset.id];if(!i)return;put('identities',i.id,{...i,color:a.dataset.c});renderSheet()},
  'new-objective':a=>{if(templates().length){openSheet('pick',null,a.dataset.id);return}const id=create('objectives',{title:'',icon:'',identityId:a.dataset.id,quarter:curQ()});openSheet('objective','objectives',id,true)},
  'pick-empty':a=>{const id=create('objectives',{title:'',icon:'',identityId:a.dataset.id,quarter:curQ()});openSheet('objective','objectives',id,true)},
  'pick-tpl':a=>{const t=S.data.templates[a.dataset.id];if(!t)return;const oid=applyTemplate(t.id,{identityId:a.dataset.iid||t.identityId||(identities()[0]||{}).id});openSheet('objective','objectives',oid);toast(`Objectif créé avec ${plural((t.items||[]).length,'preuve')}${t.video?' · choisis la vidéo liée':''}`)},
  'video-objective':a=>{const t=videoTemplate();const v=S.data.videos[a.dataset.id];if(!t||!v)return;const oid=applyTemplate(t.id,{videoId:v.id});openSheet('objective','objectives',oid);toast(`Objectif « ${S.data.objectives[oid].title} » créé dans Identités`)},
  'open-templates':()=>openSheet('pick',null,''),
  'save-template':a=>templateFromObjective(a.dataset.id),
  'edit-template':a=>openSheet('template','templates',a.dataset.id),
  'new-template':()=>{const id=create('templates',{name:'',objTitle:'',icon:'',identityId:(identities()[0]||{}).id||'',video:false,items:[{title:'',kind:'milestone',icon:''}]});openSheet('template','templates',id,true)},
  'tpl-item-add':a=>{const t=S.data.templates[a.dataset.id];if(!t)return;put('templates',t.id,{...t,items:[...(t.items||[]),{title:'',kind:'milestone',icon:''}]});renderSheet()},
  'tpl-item-del':a=>{const t=S.data.templates[a.dataset.id];if(!t)return;const it=[...(t.items||[])];it.splice(+a.dataset.i,1);put('templates',t.id,{...t,items:it});renderSheet()},
  'del-template':a=>{del('templates',a.dataset.id);dropSheet()},
  'edit-objective':a=>openSheet('objective','objectives',a.dataset.id),
  'new-kr':a=>{const id=create('krs',{title:'',icon:'',objectiveId:a.dataset.id,kind:'habit',start:0,target:null,current:0,unit:''});makeHabitForKr(id);openSheet('kr','krs',id,true)},
  'edit-kr':a=>openSheet('kr','krs',a.dataset.id),
  'new-habit':a=>{const id=create('habits',{name:'',icon:'',identityId:(a&&a.dataset.id)||'',freq:'daily',days:[],perWeek:3});openSheet('habit','habits',id,true)},
  'edit-habit':a=>openSheet('habit','habits',a.dataset.id),
  'new-video':()=>{const id=create('videos',{title:'',stage:'angle',complexity:'lourde',stageLog:[{stage:'angle',date:today()}],loops:[],titles:['','',''],filters:{},stats:{}});openSheet('video','videos',id,true)},
  'edit-video':a=>openSheet('video','videos',a.dataset.id),
  'stage':a=>{const v=S.data.videos[a.dataset.id];if(!v)return;const i=clamp(stageIdx(v.stage)+(+a.dataset.d),0,STAGES.length-1);setStage(v.id,STAGES[i].k)},
  'loop-add':a=>{const v=S.data.videos[a.dataset.id];if(!v)return;put('videos',v.id,{...v,loops:[...(v.loops||[]),{ctx:'',rev:''}]});renderSheet()},
  'loop-del':a=>{const v=S.data.videos[a.dataset.id];if(!v)return;const l=[...(v.loops||[])];l.splice(+a.dataset.i,1);put('videos',v.id,{...v,loops:l});renderSheet()},
  'new-idea':()=>{const id=create('ideas',{text:'',category:S.ideaCat!=='Tout'?S.ideaCat:'Question philo',status:'',tier:'',notes:''});openSheet('idea','ideas',id,true)},
  'edit-idea':a=>openSheet('idea','ideas',a.dataset.id),
  'idea-to-video':a=>{const i=S.data.ideas[a.dataset.id];if(!i)return;const vid=create('videos',{title:i.text||'',oeuvre:i.category==='Manga'?i.text:'',subject:i.category==='Manga'?'':i.text,notes:i.notes||'',stage:'idee',complexity:'lourde',stageLog:[{stage:'idee',date:today()}],loops:[],titles:['','',''],filters:{},stats:{},fromIdea:i.id});put('ideas',i.id,{...i,videoId:vid});openSheet('video','videos',vid);toast('Vidéo créée dans le pipeline')},
  'arm':a=>{if(a.dataset.armed){ACT[a.dataset.next](a);return}a.dataset.armed='1';a.textContent='Confirmer la suppression';setTimeout(()=>{if(a.isConnected)delete a.dataset.armed},5000)},
  'del-identity':a=>{const id=a.dataset.id;for(const o of list('objectives').filter(o=>o.identityId===id)){krsOf(o.id).forEach(k=>removeKr(k.id));del('objectives',o.id)}del('identities',id);dropSheet()},
  'del-objective':a=>{krsOf(a.dataset.id).forEach(k=>removeKr(k.id));del('objectives',a.dataset.id);dropSheet()},
  'del-kr':a=>{removeKr(a.dataset.id);dropSheet()},
  'del-habit':a=>{const id=a.dataset.id;list('krs').filter(k=>k.habitId===id&&kindOf(k)==='habit').forEach(k=>del('krs',k.id));del('habits',id);dropSheet()},
  'del-video':a=>{del('videos',a.dataset.id);dropSheet()},
  'del-idea':a=>{del('ideas',a.dataset.id);dropSheet()},
  'export':()=>exportData(),
  'sign-out':()=>{if((SYNC.inflight||Object.keys(SYNC.failed).length)&&!confirm('Des modifications ne sont pas encore synchronisées. Si tu te déconnectes maintenant, elles pourraient être perdues. Te déconnecter quand même ?'))return;if(window.DQ_BACKEND&&window.DQ_BACKEND.signOut)window.DQ_BACKEND.signOut()},
  'sync-retry':()=>retrySync(),
  'bilan':a=>{if(S.sheet)closeSheet(true);setTab(a.dataset.v)},
  'import-go':()=>runImport(),
  'import-cancel':()=>{S.pendingImport=null;renderMain(true)}
};
document.addEventListener('click',e=>{if(Date.now()-swAt<350&&e.target.closest('.swipe')){e.preventDefault();return}const a=e.target.closest('[data-act]');if(!a||a.tagName==='A')return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a,e)}});

/* Glisser-déposer du pipeline */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move';c.classList.add('dragging')});
document.addEventListener('dragend',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(c)c.classList.remove('dragging');document.querySelectorAll('.kcol.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col)return;e.preventDefault();document.querySelectorAll('.kcol.over').forEach(x=>{if(x!==col)x.classList.remove('over')});col.classList.add('over')});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col)return;e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(id&&S.data.videos[id])setStage(id,col.dataset.drop)});

/* ---------- Export / import ---------- */
async function exportData(){const data=Object.fromEntries(COLLS.map(c=>[c,Object.fromEntries(Object.entries(S.data[c]).map(([k,v])=>[k,clean(v)]))]));const json=JSON.stringify({app:'deviens-qui-tu-es',version:2,exportedAt:nowIso(),data},null,2);const name=`deviens-qui-tu-es-${today()}.json`;
  if(window.claude&&typeof window.claude.use==='function'){let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
    if(dl){try{await dl.save({filename:name,data:json});toast('Export enregistré')}catch(e){if(e&&e.code!=='declined')toast("L'export n'a pas pu être enregistré")}return}}
  try{const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(e){toast("L'export n'est pas disponible ici")}}
function readImport(el){const file=el.files&&el.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const d=j.data||j;let count=0;for(const c of COLLS)if(d[c]&&typeof d[c]==='object')count+=Object.keys(d[c]).length;if(!count)throw new Error('vide');S.pendingImport={data:d,count};renderMain(true)}catch(e){toast("Ce fichier n'est pas un export valide de l'application")}el.value=''};r.readAsText(file)}
async function runImport(){const d=S.pendingImport&&S.pendingImport.data;if(!d)return;S.pendingImport=null;let n=0;
  for(const c of COLLS){const m=d[c];if(!m||typeof m!=='object')continue;for(const[id,doc] of Object.entries(m)){if(!doc||typeof doc!=='object')continue;const cd=clean(doc);S.data[c]={...S.data[c],[id]:{...cd,id}};if(db){try{await db.collection(c).doc(id).set(cd)}catch(e){dbError(e);break}}n++}if(!db)saveLocal(c)}
  S.ver++;toast(`${n} éléments importés`);schedule()}

/* ---------- Démarrage ---------- */
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);const t=TABS.find(x=>x.hash===h);const k=t?t.k:h==='reglages'?'settings':null;if(k&&k!==S.tab){if(S.sheet)closeSheet(true);S.tab=k;renderShell();renderMain(true)}});
(function boot(){const h=(location.hash||'').slice(1);const t=TABS.find(x=>x.hash===h);if(t)S.tab=t.k;else if(h==='reglages')S.tab='settings';try{history.replaceState(navState(),'',navUrl(navState()))}catch(e){}renderShell();initStore()})();
</script>

<script type="module">
// Connexion à Firebase : compte e-mail/mot de passe + base Firestore (données sous users/<ton id>/…)
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {initializeFirestore,getFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot,query,where} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const B=window.DQ_BACKEND,$=id=>document.getElementById(id);B.loaded=true;
const showAuth=(msg,err)=>{$('auth').hidden=false;if(msg)$('auth-msg').textContent=msg;$('auth-err').textContent=err||''};
const ERR={'auth/invalid-credential':'E-mail ou mot de passe incorrect.','auth/wrong-password':'E-mail ou mot de passe incorrect.','auth/user-not-found':'Aucun compte avec cet e-mail : crée-le d’abord.','auth/email-already-in-use':'Un compte existe déjà avec cet e-mail : connecte-toi.','auth/weak-password':'Mot de passe trop court : 6 caractères minimum.','auth/invalid-email':'Cet e-mail n’est pas valide.','auth/missing-password':'Saisis ton mot de passe.','auth/network-request-failed':'Pas de connexion internet. Réessaie dès que tu es en ligne.','auth/too-many-requests':'Trop de tentatives. Patiente quelques minutes.','auth/operation-not-allowed':'Active « E-mail/Mot de passe » dans Firebase → Authentication.','auth/admin-restricted-operation':'La création de compte est désactivée dans Firebase.'};
const say=e=>{$('auth-err').textContent=ERR[e&&e.code]||('Erreur : '+((e&&e.message)||'inconnue'))};
const cfg=window.FIREBASE_CONFIG||{};
if(cfg.apiKey){
  const app=initializeApp(cfg);
  let fs;try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()}),ignoreUndefinedProperties:true})}catch(e){fs=getFirestore(app)}
  const auth=getAuth(app);let started=false;
  const makeApi=uid=>{const wrap=(c,qq)=>({
      where:(f,op,v)=>wrap(c,query(qq,where(f,op,v))),
      onSnapshot:(next,err)=>onSnapshot(qq,s=>next({docs:s.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()}))}),e=>err&&err({code:e.code==='permission-denied'?'revoked':'unavailable',message:e.message})),
      doc:id=>{const r=doc(fs,'users',uid,c,id);return{set:d=>setDoc(r,d),delete:()=>deleteDoc(r)}}});
    return{collection:c=>wrap(c,collection(fs,'users',uid,c))}};
  onAuthStateChanged(auth,u=>{
    if(u){$('auth').hidden=true;B.user=u.email;if(!started){started=true;B._resolve(makeApi(u.uid))}}
    else{if(started){location.reload();return}showAuth()}});
  B.signOut=()=>signOut(auth);
  const creds=()=>[$('auth-email').value.trim(),$('auth-pass').value];
  $('auth-form').addEventListener('submit',e=>{e.preventDefault();$('auth-err').textContent='';signInWithEmailAndPassword(auth,...creds()).catch(say)});
  $('auth-create').addEventListener('click',()=>{$('auth-err').textContent='';createUserWithEmailAndPassword(auth,...creds()).catch(say)});
  $('auth-reset').addEventListener('click',()=>{const m=creds()[0];if(!m){$('auth-err').textContent='Saisis ton e-mail, puis touche « Mot de passe oublié ».';return}sendPasswordResetEmail(auth,m).then(()=>{$('auth-err').textContent='E-mail de réinitialisation envoyé.'}).catch(say)});
}
</script>
